<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111315"><title>ギターチューナー</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="tuner">
<header><a href="../../index.html" aria-label="ツール一覧へ">一覧</a><h1>ギターチューナー</h1><span>440</span></header>
<section class="display" aria-label="音程">
<div id="string-label">自動</div><div id="note">—<small id="octave"></small></div>
<div class="meter" id="meter"><div class="center-zone"></div><div class="ticks"></div><div class="center"></div><div id="needle"></div><div class="signs"><span>♭</span><span>♯</span></div></div>
<div id="deviation" aria-label="音程差">— <small>cents</small></div><div id="range">&nbsp;</div>
</section>
<footer><div class="strings" aria-label="弦の選択"></div><button id="auto" aria-pressed="true">自動</button><p id="status" role="status"></p><button id="power">START</button></footer>
</main><script type="module" src="./app.js"></script></body></html>
