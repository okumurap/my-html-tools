<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0e5b79">
<meta name="description" content="投げて、さびいて、アタリに合わせる。スマホで遊べるキス釣りミニゲーム。">
<title>坂本のキス釣り</title>
<style>
:root{--ink:#153047;--panel:#f7fbfd;--line:#c8dce5;--blue:#167ea3;--deep:#0e5b79;--coral:#ef6b55;--gold:#f3b54a;--green:#3c9b72}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{height:100%;touch-action:manipulation;background:#0e5b79}
body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:#dff4fb}
button{font:inherit;color:inherit;touch-action:none}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:7px;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.top{min-height:48px;display:flex;align-items:center;gap:8px;padding:0 2px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#fff;box-shadow:0 4px 14px #0e40551d;font-size:24px}.title{font-size:clamp(16px,3.7vw,22px);font-weight:950;white-space:nowrap}.sub{font-size:10px;color:#507183;white-space:nowrap}.top-stats{margin-left:auto;display:flex;gap:5px}.pill{min-width:68px;height:40px;padding:4px 9px;border:1px solid #c5dce6;border-radius:13px;background:#ffffffd9;display:grid;align-content:center;text-align:center;box-shadow:0 3px 10px #0e405512}.pill small{font-size:9px;color:#608090;line-height:1}.pill b{font-size:14px;line-height:1.25}.icon-btn{width:42px;min-width:42px;height:40px;border:1px solid #c5dce6;border-radius:13px;background:#ffffffd9;font-size:18px;box-shadow:0 3px 10px #0e405512}
.stage{position:relative;min-height:0;overflow:hidden;border-radius:19px;border:1px solid #90bccf;background:#8dd8ef;box-shadow:0 12px 28px #0b405426}.stage canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;inset:0;pointer-events:none}.message{position:absolute;left:50%;top:12%;transform:translate(-50%,-8px) scale(.96);opacity:0;max-width:88%;padding:9px 17px;border-radius:999px;background:#102f40e8;color:white;font-weight:950;font-size:clamp(14px,4vw,22px);text-align:center;white-space:nowrap;box-shadow:0 5px 18px #0826343f;transition:.18s}.message.show{opacity:1;transform:translate(-50%,0) scale(1)}.message.bite{background:#ef6b55;font-size:clamp(20px,6vw,34px)}.depth{position:absolute;left:9px;bottom:9px;padding:6px 10px;border-radius:999px;background:#ffffffd8;font-size:11px;font-weight:900}.wind{position:absolute;right:9px;top:9px;padding:6px 10px;border-radius:999px;background:#ffffffd8;font-size:11px;font-weight:900}.tension-wrap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(330px,72%);display:none}.tension-wrap.show{display:block}.tension-label{display:flex;justify-content:space-between;color:white;text-shadow:0 1px 4px #123;font-size:10px;font-weight:900}.tension{height:14px;border-radius:999px;background:linear-gradient(90deg,#e95f58 0 18%,#f2b54b 18% 35%,#4bb17f 35% 76%,#f2b54b 76% 88%,#e95f58 88%);border:2px solid #ffffffd8;box-shadow:0 2px 9px #0b304344;position:relative}.tension i{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:#132d3d;transform:translateX(-2px);left:45%;box-shadow:0 0 0 2px white}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;min-height:82px}.control-main{position:relative;display:grid}.action{width:100%;height:82px;border:1px solid #c3d8e1;border-radius:18px;background:#fff;font-size:20px;font-weight:950;box-shadow:0 6px 15px #123a4a1a;overflow:hidden;position:relative}.action.primary{background:var(--coral);color:#fff;border-color:#d85743}.action.sabiki{background:#fff7e9;border-color:#e9c882}.action.hook{background:#f0a33b;color:white;border-color:#dc8b25;animation:pulse .45s infinite alternate}.action.reel{background:#287e9d;color:white;border-color:#1f6580}.action:active,.action.held{transform:translateY(2px);box-shadow:0 2px 7px #123a4a16}.action .minor{display:block;font-size:11px;font-weight:750;opacity:.82;margin-top:2px}.power{position:absolute;left:10px;right:10px;bottom:8px;height:8px;border-radius:999px;background:#ffffff66;overflow:hidden}.power i{display:block;height:100%;width:0;background:#ffe66b;border-radius:inherit}.side-controls{display:grid;grid-template-columns:repeat(3,58px);gap:6px}.side{height:82px;border:1px solid #c3d8e1;border-radius:17px;background:#fff;font-weight:900;font-size:11px;box-shadow:0 5px 14px #123a4a17;padding:4px}.side strong{display:block;font-size:22px}.side.active{background:#153d50;color:#fff;border-color:#153d50}.hidden{display:none!important}
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#082e40a8;backdrop-filter:blur(5px)}.overlay.hidden{display:none}.card{width:min(520px,100%);max-height:90vh;overflow:auto;background:#f9fdff;border-radius:24px;padding:21px;box-shadow:0 18px 60px #06233066}.card h1,.card h2{margin:0 0 8px}.card p{margin:8px 0;line-height:1.65}.time-select{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.time-btn{height:63px;border:1px solid #c5dce6;border-radius:15px;background:#fff;font-weight:900}.time-btn span{display:block;font-size:25px}.time-btn.active{border:2px solid var(--coral);background:#fff2ed}.start-btn{width:100%;height:54px;border:0;border-radius:16px;background:var(--coral);color:white;font-weight:950;font-size:18px}.how{font-size:12px;color:#4c6f80;background:#edf7fa;border-radius:14px;padding:11px 13px}.result-list{display:grid;gap:6px;margin:12px 0}.catch-row{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;background:#edf7fa;border-radius:13px;padding:8px}.catch-row .emoji{font-size:27px}.catch-row b{display:block}.catch-row small{color:#607d8b}.result-score{text-align:center;font-size:33px;font-weight:950;color:#ef6b55;margin:10px}.new-record{color:#c37908;font-weight:950;text-align:center}
@keyframes pulse{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.08);transform:scale(1.015)}}
@media(orientation:portrait) and (max-width:700px){.app{grid-template-rows:auto minmax(0,1fr) auto}.stage{border-radius:16px}.top{min-height:43px}.logo{width:36px;height:36px}.pill{min-width:58px;height:36px;padding:3px 6px}.icon-btn{width:38px;min-width:38px;height:36px}.controls,.action{min-height:92px;height:92px}.side{height:92px}.sub{display:none}}
@media(max-width:430px){.top-stats .score-pill{display:none}.title{font-size:17px}.controls{grid-template-columns:minmax(0,1fr) 165px}.side-controls{grid-template-columns:repeat(3,51px)}.action{font-size:18px}}
@media(max-height:470px){.app{gap:4px;padding-top:4px;padding-bottom:4px}.top{min-height:39px}.logo{width:35px;height:35px}.sub{display:none}.pill,.icon-btn{height:35px}.controls{min-height:64px}.action,.side{height:64px}.action{font-size:17px}.action .minor{font-size:9px}.stage{border-radius:13px}.message{top:8%}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">🎣</div><div><div class="title">坂本のキス釣り</div><div class="sub">投げる・さびく・合わせる</div></div></div>
  <div class="top-stats"><div class="pill"><small>のこり</small><b id="timer">3:00</b></div><div class="pill score-pill"><small>スコア</small><b id="score">0</b></div><button class="icon-btn" id="soundBtn" aria-label="音のオンオフ">🔊</button></div>
</header>
<main class="stage" id="stage">
  <canvas id="game"></canvas>
  <div class="hud"><div class="message" id="message"></div><div class="wind" id="wind">風 2.1m/s →</div><div class="depth" id="depth">距離 0m</div><div class="tension-wrap" id="tensionWrap"><div class="tension-label"><span>ゆるい</span><span>糸のテンション</span><span>切れる</span></div><div class="tension"><i id="tensionNeedle"></i></div></div></div>
</main>
<section class="controls">
  <div class="control-main">
    <button class="action primary" id="actionBtn">長押しで投げる<span class="minor">離すとキャスト</span><span class="power"><i id="powerFill"></i></span></button>
  </div>
  <div class="side-controls"><button class="side active" data-time="morning"><strong>🌅</strong>朝</button><button class="side" data-time="day"><strong>☀️</strong>昼</button><button class="side" data-time="evening"><strong>🌇</strong>夕</button></div>
</section>
</div>
<div class="overlay" id="startOverlay"><div class="card"><h1>坂本のキス釣り</h1><p>3分間でキスを狙う、スマホ向けミニゲームです。夕まずめはキスが少し釣れやすくなります。</p><div class="time-select"><button class="time-btn active" data-pick="morning"><span>🌅</span>朝</button><button class="time-btn" data-pick="day"><span>☀️</span>昼</button><button class="time-btn" data-pick="evening"><span>🌇</span>夕まずめ</button></div><div class="how"><b>遊び方</b><br>①「投げる」を長押しして離す<br>② 海底に着いたら「さびく」を短く押す<br>③ ブルッ！ときたらすぐ「合わせる」<br>④ テンションを見ながら「巻く」</div><button class="start-btn" id="startBtn">釣りを始める</button></div></div>
<div class="overlay hidden" id="catchOverlay"><div class="card" id="catchCard"></div></div>
<div class="overlay hidden" id="resultOverlay"><div class="card" id="resultCard"></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const cv=$('#game'),ctx=cv.getContext('2d'),stage=$('#stage'),actionBtn=$('#actionBtn'),message=$('#message');
const timerEl=$('#timer'),scoreEl=$('#score'),depthEl=$('#depth'),powerFill=$('#powerFill'),tensionWrap=$('#tensionWrap'),tensionNeedle=$('#tensionNeedle');
let W=0,H=0,DPR=1,last=performance.now(),state='menu',roundLeft=180,score=0,catches=[],timeMode='morning',soundOn=true,audio=null;
let power=0,powerDir=1,charging=false,line={distance:0,maxDistance:0,x:0,y:0,targetY:0},castT=0,sinkSpeed=0,retrieveHeld=false,biteTimer=0,biteFish=null,tension=.46,hookProgress=0,fight=0,particles=[],ripples=[],fishShadows=[];
const times={morning:{sky:['#f8c78d','#8ecbe2'],sea:['#4eb0cc','#0b607f'],sun:'#ffe6a1',label:'朝'},day:{sky:['#8fd8f0','#dff7ff'],sea:['#43a9c5','#075a79'],sun:'#fff4af',label:'昼'},evening:{sky:['#f4a06f','#7468a9'],sea:['#3b8da9','#174c70'],sun:'#ffd079',label:'夕'}};
const species=[
 {name:'シロギス',emoji:'🐟',min:12,max:27,base:52,points:12,color:'#f5e6c9'},
 {name:'ハゼ',emoji:'🐟',min:8,max:19,base:14,points:8,color:'#ae8f60'},
 {name:'メゴチ',emoji:'🐡',min:10,max:23,base:11,points:9,color:'#8c8067'},
 {name:'クサフグ',emoji:'🐡',min:9,max:20,base:14,points:4,color:'#91b873'},
 {name:'カニ',emoji:'🦀',min:4,max:11,base:6,points:6,color:'#d16b4d'},
 {name:'長靴',emoji:'🥾',min:24,max:31,base:3,points:1,color:'#394c52'}
];
function resize(){const r=stage.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
function seabedY(x){const u=x/Math.max(W,1);return H*(.77+.12*u)+Math.sin(u*8)*H*.015}
function rodTip(){return{x:W*.15,y:H*.27}}
function setMessage(text,type='',ms=900){message.textContent=text;message.className='message show'+(type?' '+type:'');clearTimeout(setMessage.t);if(ms)setMessage.t=setTimeout(()=>message.className='message',ms)}
function setAction(kind){actionBtn.className='action';powerFill.parentElement.classList.add('hidden');if(kind==='cast'){actionBtn.classList.add('primary');actionBtn.innerHTML='長押しで投げる<span class="minor">離すとキャスト</span><span class="power"><i id="powerFill2"></i></span>';window.powerBar=$('#powerFill2');}
 if(kind==='wait'){actionBtn.textContent='海底まで待つ';actionBtn.disabled=true}
 if(kind==='sabiki'){actionBtn.disabled=false;actionBtn.classList.add('sabiki');actionBtn.innerHTML='ゆっくり さびく<span class="minor">短く押すのがコツ</span>'}
 if(kind==='hook'){actionBtn.disabled=false;actionBtn.classList.add('hook');actionBtn.innerHTML='合わせる！<span class="minor">今すぐタップ</span>'}
 if(kind==='reel'){actionBtn.disabled=false;actionBtn.classList.add('reel');actionBtn.innerHTML='巻く<span class="minor">テンションが赤なら離す</span>'}
 if(kind==='over'){actionBtn.disabled=true;actionBtn.textContent='終了'}
}
function selectTime(t){timeMode=t;$$('[data-time]').forEach(b=>b.classList.toggle('active',b.dataset.time===t));$$('[data-pick]').forEach(b=>b.classList.toggle('active',b.dataset.pick===t));makeFishShadows()}
function makeFishShadows(){fishShadows=Array.from({length:9},(_,i)=>({x:Math.random()*W,y:H*(.48+Math.random()*.34),s:.55+Math.random()*.8,v:(Math.random()*.16+.06)*(Math.random()<.5?-1:1),phase:Math.random()*6.28}))}
function startRound(){state='idle';roundLeft=180;score=0;catches=[];line.distance=0;scoreEl.textContent='0';timerEl.textContent='3:00';$('#startOverlay').classList.add('hidden');$('#resultOverlay').classList.add('hidden');setAction('cast');setMessage(times[timeMode].label+'の釣り、開始！','',1200);beep(520,.12);last=performance.now()}
function finishRound(){state='over';charging=false;retrieveHeld=false;tensionWrap.classList.remove('show');setAction('over');const best=Number(localStorage.getItem('kissFishingBest')||0),isBest=score>best;if(isBest)localStorage.setItem('kissFishingBest',score);const rows=catches.length?catches.map(c=>`<div class="catch-row"><div class="emoji">${c.emoji}</div><div><b>${c.name} ${c.size.toFixed(1)}cm</b><small>${c.points}点</small></div><strong>+${c.points}</strong></div>`).join(''):'<p>今回は釣果なし。海底を短く刻むようにさびくと、アタリが増えます。</p>';$('#resultCard').innerHTML=`<h2>本日の釣果</h2><div class="result-score">${score}点</div>${isBest?'<div class="new-record">自己ベスト更新！</div>':''}<div class="result-list">${rows}</div><p>釣果：${catches.length}匹　ベスト：${Math.max(best,score)}点</p><button class="start-btn" id="againBtn">もう一度</button>`;$('#resultOverlay').classList.remove('hidden');$('#againBtn').onclick=startRound;beep(330,.12);setTimeout(()=>beep(440,.16),150)}
function cast(){if(state!=='idle')return;charging=false;const p=Math.max(.18,power);line.maxDistance=Math.round(25+p*75);line.distance=line.maxDistance;castT=0;state='casting';setAction('wait');setMessage(`${line.maxDistance}m キャスト！`);whoosh();navigator.vibrate?.(25)}
function beginCharge(){if(state!=='idle')return;charging=true;power=.08;powerDir=1;actionBtn.classList.add('held')}
function endCharge(){if(!charging)return;actionBtn.classList.remove('held');cast()}
function startSabiki(){if(state==='retrieving'){retrieveHeld=true;actionBtn.classList.add('held')}else if(state==='bite')hook() ;else if(state==='hooked'){retrieveHeld=true;actionBtn.classList.add('held')}}
function stopSabiki(){retrieveHeld=false;actionBtn.classList.remove('held')}
function chooseFish(){let weights=species.map(s=>s.base);if(timeMode==='evening')weights[0]*=1.38;if(timeMode==='morning')weights[0]*=1.18;if(timeMode==='day')weights[3]*=1.18;const d=line.distance/Math.max(line.maxDistance,1);weights[0]*=.72+d*.68;weights[5]*=d<.25?1.8:.7;let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total;for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return species[i]}return species[0]}
function triggerBite(){state='bite';biteFish=chooseFish();biteTimer=.95;retrieveHeld=false;setAction('hook');setMessage('ブルッ！','bite',850);vibrateBite();biteSound()}
function hook(){if(state!=='bite')return;if(biteTimer<=0){miss();return}state='hooked';tension=.43;hookProgress=Math.max(8,line.distance);fight=.2+Math.random()*.35;setAction('reel');tensionWrap.classList.add('show');setMessage('のった！ 巻け！','',850);beep(690,.08);navigator.vibrate?.(45)}
function miss(){state='retrieving';biteFish=null;setAction('sabiki');setMessage('あっ、遅かった…','',800);beep(180,.14)}
function landFish(){const s=biteFish,size=s.min+Math.random()*(s.max-s.min);let pts=Math.round(size*s.points);if(s.name==='シロギス'&&size>=23)pts+=80;const item={...s,size,points:pts};catches.push(item);score+=pts;scoreEl.textContent=score;state='caught';retrieveHeld=false;tensionWrap.classList.remove('show');popParticles(W*.22,H*.42,s.color);catchSound();navigator.vibrate?.([40,50,80]);$('#catchCard').innerHTML=`<div style="text-align:center;font-size:70px">${s.emoji}</div><h2 style="text-align:center">${s.name} ${size.toFixed(1)}cm</h2><div class="result-score">+${pts}点</div>${s.name==='シロギス'&&size>=23?'<div class="new-record">良型キス！</div>':''}<button class="start-btn" id="nextCast">次を投げる</button>`;$('#catchOverlay').classList.remove('hidden');$('#nextCast').onclick=()=>{$('#catchOverlay').classList.add('hidden');state='idle';line.distance=0;setAction('cast')};}
function loseFish(){state='retrieving';biteFish=null;retrieveHeld=false;tensionWrap.classList.remove('show');setAction('sabiki');setMessage('バレた！','',850);beep(150,.2)}
function update(dt){if(state!=='menu'&&state!=='over'&&state!=='caught'){roundLeft-=dt;if(roundLeft<=0){roundLeft=0;finishRound();return}const sec=Math.ceil(roundLeft);timerEl.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
 if(charging){power+=powerDir*dt*.85;if(power>=1){power=1;powerDir=-1}if(power<=.12){power=.12;powerDir=1}const pb=window.powerBar||powerFill;if(pb)pb.style.width=(power*100)+'%'}
 if(state==='casting'){castT+=dt;const t=Math.min(1,castT/1.05),tip=rodTip(),tx=W*(.25+.68*(line.maxDistance/100));line.x=tip.x+(tx-tip.x)*t;line.y=tip.y-4*H*t*(1-t)+H*.18*t;if(t>=1){state='sinking';sinkSpeed=H*.13;line.targetY=seabedY(line.x)-5;setMessage('仕掛けが沈んでいます…','',700)}}
 else if(state==='sinking'){line.y+=sinkSpeed*dt;sinkSpeed+=H*.18*dt;if(line.y>=line.targetY){line.y=line.targetY;state='retrieving';setAction('sabiki');setMessage('着底！ ゆっくりさびこう','',1200);beep(250,.06)}}
 else if(state==='retrieving'){if(retrieveHeld){const speed=8.5;line.distance=Math.max(0,line.distance-speed*dt);line.x-=W*(speed/100)*dt;line.x=Math.max(W*.17,line.x);line.y=seabedY(line.x)-5;spawnRipple(line.x,line.y);if(Math.random()<dt*(.62+(timeMode==='evening'?.22:0))&&line.distance>4)triggerBite();if(Math.random()<dt*4)beep(270+Math.random()*40,.018,.018)}if(line.distance<=2){state='idle';line.distance=0;setAction('cast');setMessage('エサを付け直して再投入','',950)}}
 else if(state==='bite'){biteTimer-=dt;if(biteTimer<=0)miss()}
 else if(state==='hooked'){const fishPull=.13+Math.sin(performance.now()/260)*.06+fight*Math.random()*.18;tension+=dt*(retrieveHeld?.52:-.28)+fishPull*dt; tension=Math.max(0,Math.min(1.12,tension));if(retrieveHeld&&tension<.9){hookProgress-=dt*(8.5+(1-tension)*3);line.distance=Math.max(0,hookProgress);line.x=Math.max(W*.17,line.x-W*.085*dt)}if(tension>1.03||tension<.04){loseFish()}else if(hookProgress<=1){landFish()}tensionNeedle.style.left=(tension*100)+'%'}
 ripples.forEach(r=>{r.life-=dt;r.rad+=dt*28});ripples=ripples.filter(r=>r.life>0);particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt});particles=particles.filter(p=>p.life>0);fishShadows.forEach(f=>{f.x+=f.v*dt*W;if(f.x<-50)f.x=W+50;if(f.x>W+50)f.x=-50;f.phase+=dt})}
function draw(){const theme=times[timeMode],seaTop=H*.31;const sky=ctx.createLinearGradient(0,0,0,seaTop);sky.addColorStop(0,theme.sky[0]);sky.addColorStop(1,theme.sky[1]);ctx.fillStyle=sky;ctx.fillRect(0,0,W,seaTop);drawSun(theme.sun);const sea=ctx.createLinearGradient(0,seaTop,0,H);sea.addColorStop(0,theme.sea[0]);sea.addColorStop(1,theme.sea[1]);ctx.fillStyle=sea;ctx.fillRect(0,seaTop,W,H-seaTop);drawSeaLines(seaTop);drawSlipway();drawSeabed();drawFishShadows();drawLine();drawRig();drawRipples();drawParticles();depthEl.textContent=line.distance?`距離 ${Math.round(line.distance)}m`:'距離 0m'}
function drawSun(color){const x=timeMode==='evening'?W*.78:W*.75,y=timeMode==='evening'?H*.21:H*.13;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,Math.max(14,H*.055),0,Math.PI*2);ctx.fill()}
function drawSeaLines(y){ctx.strokeStyle='#ffffff42';ctx.lineWidth=1.5;for(let j=0;j<5;j++){ctx.beginPath();for(let x=0;x<=W;x+=18){const yy=y+10+j*14+Math.sin(x*.035+j+performance.now()*.0012)*2;ctx.lineTo(x,yy)}ctx.stroke()}}
function drawSlipway(){ctx.fillStyle='#c8c4b8';ctx.beginPath();ctx.moveTo(0,H*.25);ctx.lineTo(W*.21,H*.3);ctx.lineTo(W*.17,H*.77);ctx.lineTo(0,H*.72);ctx.closePath();ctx.fill();ctx.strokeStyle='#918f87';ctx.lineWidth=2;for(let y=H*.31;y<H*.7;y+=H*.08){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W*.18,y+H*.03);ctx.stroke()}drawAngler()}
function drawAngler(){const x=W*.105,y=H*.27,s=Math.max(.75,Math.min(1.2,H/420));ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='#233a47';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,-22,8,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(1,16);ctx.moveTo(1,16);ctx.lineTo(-10,36);ctx.moveTo(1,16);ctx.lineTo(14,35);ctx.moveTo(0,-8);ctx.lineTo(20,5);ctx.stroke();ctx.strokeStyle='#825b35';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(18,5);ctx.lineTo(65,-32);ctx.stroke();ctx.restore()}
function drawSeabed(){ctx.beginPath();ctx.moveTo(0,seabedY(0));for(let x=0;x<=W;x+=16)ctx.lineTo(x,seabedY(x));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();const sand=ctx.createLinearGradient(0,H*.72,0,H);sand.addColorStop(0,'#d7c38e');sand.addColorStop(1,'#8d7650');ctx.fillStyle=sand;ctx.fill();ctx.fillStyle='#7b6848aa';for(let x=20;x<W;x+=55){const y=seabedY(x)+10;ctx.beginPath();ctx.ellipse(x,y,10,3,0,0,Math.PI*2);ctx.fill()}}
function drawFishShadows(){ctx.save();ctx.globalAlpha=.26;ctx.fillStyle='#073e57';for(const f of fishShadows){if(f.y>seabedY(f.x)-10)f.y=seabedY(f.x)-18;ctx.save();ctx.translate(f.x,f.y+Math.sin(f.phase)*2);ctx.scale(Math.sign(f.v),1);ctx.beginPath();ctx.ellipse(0,0,17*f.s,6*f.s,0,0,Math.PI*2);ctx.moveTo(-14*f.s,0);ctx.lineTo(-25*f.s,-8*f.s);ctx.lineTo(-25*f.s,8*f.s);ctx.closePath();ctx.fill();ctx.restore()}ctx.restore()}
function drawLine(){if(!line.distance||state==='idle')return;const tip=rodTip();ctx.strokeStyle='#f7fbffdd';ctx.lineWidth=1.15;ctx.beginPath();ctx.moveTo(tip.x+40,tip.y-28);ctx.lineTo(line.x,line.y);ctx.stroke()}
function drawRig(){if(!line.distance||state==='idle')return;ctx.fillStyle='#5b6770';ctx.beginPath();ctx.ellipse(line.x,line.y,5,8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e2d6ad';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(line.x,line.y);ctx.lineTo(line.x+19,line.y+2);ctx.stroke();ctx.fillStyle='#f07a54';ctx.beginPath();ctx.arc(line.x+21,line.y+3,2.5,0,Math.PI*2);ctx.fill();if(state==='hooked'){ctx.save();ctx.translate(line.x+28,line.y-5);ctx.fillStyle=biteFish?.color||'#eee';ctx.beginPath();ctx.ellipse(0,0,16,6,0,0,Math.PI*2);ctx.lineTo(-24,-8);ctx.lineTo(-24,8);ctx.closePath();ctx.fill();ctx.restore()}}
function spawnRipple(x,y){if(Math.random()<.22)ripples.push({x,y,rad:3,life:.35})}
function drawRipples(){ctx.strokeStyle='#fff7';for(const r of ripples){ctx.globalAlpha=Math.max(0,r.life/.35);ctx.beginPath();ctx.arc(r.x,r.y,r.rad,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1}
function popParticles(x,y,color){for(let i=0;i<30;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:-40-Math.random()*130,life:.7+Math.random()*.6,color})}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2+Math.random()*2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function loop(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
function ensureAudio(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function beep(freq=440,dur=.08,vol=.035){if(!soundOn)return;ensureAudio();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function whoosh(){if(!soundOn)return;ensureAudio();for(let i=0;i<5;i++)setTimeout(()=>beep(180+i*55,.05,.02),i*30)}
function biteSound(){beep(330,.05,.05);setTimeout(()=>beep(460,.05,.05),85);setTimeout(()=>beep(350,.06,.05),165)}
function catchSound(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.11,.045),i*80))}
function vibrateBite(){navigator.vibrate?.([45,45,45])}
function bindHold(el,start,end){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);ensureAudio();start()});el.addEventListener('pointerup',e=>{e.preventDefault();end()});el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end)}
bindHold(actionBtn,()=>{if(state==='idle')beginCharge();else startSabiki()},()=>{if(state==='idle'&&charging)endCharge();else stopSabiki()});
$$('[data-time]').forEach(b=>b.onclick=()=>{if(state==='idle'||state==='menu')selectTime(b.dataset.time)});$$('[data-pick]').forEach(b=>b.onclick=()=>selectTime(b.dataset.pick));
$('#startBtn').onclick=()=>{ensureAudio();startRound()};$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn)beep(500,.05)};
window.addEventListener('resize',()=>{resize();makeFishShadows()});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());
resize();makeFishShadows();selectTime('morning');requestAnimationFrame(loop);
})();
</script>
