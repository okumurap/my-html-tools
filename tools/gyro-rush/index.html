:root{color-scheme:dark;font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#f3f8ff;background:#050916}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f9e783;outline-offset:2px}.app{height:100vh;height:100dvh;max-width:620px;margin:auto;display:flex;flex-direction:column;background:#071027;overflow:hidden}.top,.bottom{flex:none;background:#0b1630;border-color:#345173;border-style:solid;border-width:0;display:flex;align-items:center;gap:12px}.top{border-bottom-width:1px;justify-content:space-between;padding:calc(9px + env(safe-area-inset-top)) 15px 10px;min-height:55px}.brand{font-weight:950;letter-spacing:.18em;font-size:16px}.brand span{color:#53e6ff}.home{color:#b6d6ef;text-decoration:none;font-size:12px}.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:0 0 auto;padding:11px 12px 0;pointer-events:none;text-shadow:0 2px 5px #000}.hud[hidden]{display:none}.hud-line{display:flex;justify-content:space-between;align-items:center;gap:8px}.hud-label{font-size:10px;color:#aac9f3}.hud-value{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}.hearts{color:#ff728c}.hud-mid{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-top:7px}.hud-mid b{color:#ffe67a}.pause{pointer-events:auto;background:#1b3054;color:#fff;border:1px solid #6c93c4;border-radius:12px;min-width:44px;min-height:44px;font-weight:900;font-size:18px}.progress{background:#263b5d;height:4px;border-radius:4px;margin-top:9px;overflow:hidden}.progress div{height:100%;background:#42dbef;width:0}.message{position:absolute;top:30%;left:0;right:0;text-align:center;color:#ffe17e;font-size:23px;font-weight:1000;text-shadow:0 2px 12px #000,0 0 20px #fcbd56;pointer-events:none;opacity:0;transition:opacity .17s}.message.show{opacity:1}.bottom{border-top-width:1px;padding:10px 12px calc(9px + env(safe-area-inset-bottom));min-height:94px}.energy{flex:1;min-width:0}.energy-label{display:flex;justify-content:space-between;gap:4px;color:#bad5f6;font-size:11px;font-weight:800;letter-spacing:.05em}.meter{height:12px;background:#243c60;border:1px solid #52769d;border-radius:50px;overflow:hidden;margin-top:8px}.meter div{height:100%;width:0;background:linear-gradient(90deg,#188cff,#5aeeff)}.hint{font-size:10px;color:#93b5d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.boost{min-width:114px;min-height:69px;border:1px solid #55dfff;border-radius:17px;background:linear-gradient(135deg,#136f9b,#27438b);color:white;font-size:17px;font-weight:950}.boost small{display:block;font-size:10px;margin-top:2px}.boost:disabled{opacity:.4}.boost.ready{box-shadow:0 0 20px #42dfff66}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#050a1bd9,#050a1bef);z-index:5;overflow:auto;padding:14px}.overlay[hidden]{display:none}.panel{width:min(100%,390px);padding:19px 17px;background:linear-gradient(145deg,#142b51,#09152e);border:1px solid #466a96;border-radius:22px;text-align:center;box-shadow:0 20px 55px #0009}.eyebrow{color:#79e8ff;font-size:10px;font-weight:900;letter-spacing:.19em}.panel h1{margin:7px 0;font-size:clamp(31px,9vw,46px);letter-spacing:.04em}.panel h2{font-size:29px;margin:8px 0}.sub{font-size:12px;color:#bad4f5;line-height:1.6}.rules{text-align:left;background:#0b1c3d;border:1px solid #315078;border-radius:12px;padding:11px;font-size:12px;line-height:1.85;margin:13px 0}.rules strong{color:#68eaff}.primary,.secondary{display:block;width:100%;min-height:48px;border-radius:12px;font-weight:900;margin-top:9px}.primary{border:0;color:#05243a;background:linear-gradient(110deg,#61f4ff,#75b7ff)}.secondary{border:1px solid #4d72a6;color:#e8f5ff;background:#20375d}.settings{border-top:1px solid #42608c;margin-top:13px;padding-top:12px}.setting{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:8px 0}.setting input[type=range]{width:52%;accent-color:#57e0f3}.setting input[type=checkbox]{width:20px;height:20px;accent-color:#50d5ed}.notice{font-size:11px;color:#ffd88b;min-height:16px;margin-top:10px}.small{color:#a8bddc;font-size:10px;line-height:1.6;margin-top:10px}.total{font-size:48px;font-weight:950;color:#77f0ff;margin:10px 0}.stats{display:grid;grid-template-columns:1fr 1fr;text-align:left;gap:8px;margin:13px 0}.stats div{background:#0a1e3f;border:1px solid #32527b;border-radius:10px;color:#a9c5e9;padding:9px;font-size:11px}.stats b{display:block;color:#fff;font-size:17px;margin-top:3px}.best{color:#ffe084;font-weight:900}.landscape{display:none}@media(max-height:640px){.panel{padding:11px 14px}.panel h1{font-size:31px}.rules{padding:6px 10px;margin:8px 0}.bottom{min-height:77px}.boost{min-height:57px}}@media(orientation:landscape) and (max-height:430px){.landscape{position:absolute;inset:0;display:grid;place-items:center;background:#071027;z-index:9;font-weight:800;text-align:center;padding:20px}}@media(prefers-reduced-motion:reduce){.message{transition:none}}

:root{background:#090f18;color:#e8e9df}.app{position:relative;background:#0d1723}.top,.bottom{background:#111f2b;border-color:#354854}.top{min-height:56px}.brand{font-size:14px;letter-spacing:.22em;color:#e2e3da}.brand span{color:#a9c3c9}.home{color:#9cb1ba;font-size:10px}.hud-label{color:#9db1b9;font-size:9px;letter-spacing:.12em}.hud-value{font-size:18px;color:#e0e3dc}.hearts{color:#b7c6bd;letter-spacing:.08em}.hud-mid{font-size:10px;color:#c0c9c8;letter-spacing:.06em}.hud-mid b{color:#d4c49d}.progress{background:#253944;height:3px}.progress div{background:#a5c3bd}.pause{background:#1b2d3c;border-color:#4c626e;color:#c7d0ce;border-radius:8px}.message{font-size:19px;letter-spacing:.06em;color:#dfd0aa;text-shadow:0 2px 8px #000;top:29%}.bottom{min-height:100px;padding:13px 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none}.energy-label{color:#b2c2c5;font-size:10px;letter-spacing:.12em}.meter{height:7px;border:0;background:#2b3d47;margin-top:9px}.meter div{background:linear-gradient(90deg,#5a7e88,#abc9bd)}.hint{font-size:9px;color:#819ba5;margin-top:8px}
.boost-zone{position:absolute;z-index:3;left:0;right:0;bottom:0;width:100%;height:30%;border:0;border-top:1px dashed #bacac12e;border-radius:0;background:linear-gradient(#d8dfc703,#d8dfc700 25%);color:#c4d1cd;touch-action:none;cursor:pointer;padding:0;box-shadow:none;opacity:1!important}.boost-zone:disabled{cursor:default}.boost-zone::before{content:'';position:absolute;left:50%;top:0;width:44px;border-top:2px solid #b0c3bd55;transform:translateX(-50%)}.boost-zone>span{position:absolute;left:0;right:0;text-align:center;pointer-events:none}.boost-state{left:12px!important;right:auto!important;top:9px;text-align:left!important;font-size:9px;font-weight:700;letter-spacing:.14em;color:#829da8}.boost-instruction{left:auto!important;right:12px!important;top:9px;font-size:8px;color:#6e8c99}.boost-zone.ready{background:linear-gradient(#c5d9bc0c,#b6d4c300 45%);box-shadow:inset 0 1px 0 #c1d1b247}.boost-zone.ready .boost-state{color:#d4dbba}.boost-zone.ready .boost-instruction{color:#a6b9ad}.boost-zone.is-active{border-top-color:#bcd3c966;background:linear-gradient(#c5d9bc12,#b6d4c300 55%)}.boost-zone.is-active .boost-state{color:#e1e6cf}.boost-zone:focus-visible{outline:2px solid #d8cc9f;outline-offset:-3px}.boost-zone:disabled{pointer-events:auto}
.overlay{background:linear-gradient(#07121ec9,#07121ef2);z-index:6}.panel{background:linear-gradient(145deg,#1c3040,#111e2c);border-color:#49616b;border-radius:17px;box-shadow:0 20px 55px #0005}.eyebrow{font-size:9px;color:#9fbcc0;letter-spacing:.18em}.panel h1{font-size:clamp(30px,8vw,42px);color:#e7e7dc;letter-spacing:.1em}.panel h2{font-size:27px;color:#d5dcd4}.sub{font-size:11px;color:#a7b9bf}.rules{background:#10212e;border-color:#344c59;border-radius:8px;font-size:11px;color:#b4c6c9;line-height:1.9}.rules strong{color:#c9d5d2}.primary,.secondary{border-radius:8px;min-height:46px;font-size:12px;letter-spacing:.03em}.primary{background:linear-gradient(110deg,#adc6c3,#93b0b9);color:#183342}.secondary{border-color:#49626f;background:#223747;color:#c4d0cf}.setting{color:#acbfc2;font-size:11px}.setting input[type=range],.setting input[type=checkbox]{accent-color:#a1b9ad}.notice{font-size:10px;color:#d4c49b}.small{color:#839ca8;font-size:9px}.stats div{background:#102331;border-color:#344d59;border-radius:8px;color:#9cb1ba}.stats b{color:#d1dcd7}.total{color:#c3d3cb}.best{color:#d4c7a2}.landscape{z-index:9;background:#111e2cf5;color:#bdccce}
@media(max-height:640px){.bottom{min-height:84px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}.panel h1{font-size:29px}.panel{padding:12px 14px}.rules{font-size:10px}}

<body class="mobile-touch-game">
<main class="app" aria-label="ジャイロ宇宙船ゲーム">
<header class="top"><div class="brand">GYRO <span>RUSH</span></div><a class="home" href="../../index.html">ツール一覧へ</a></header>
<section class="stage" id="stage" aria-label="宇宙船ゲーム。画面を横になぞると機体が移動します"><canvas id="game" tabindex="0" aria-label="宇宙船と隕石"></canvas>
<div class="hud" id="hud" hidden><div class="hud-line"><div><div class="hud-label">HULL</div><div class="hud-value hearts" id="hp">♥ ♥ ♥</div></div><div style="text-align:right"><div class="hud-label">SCORE</div><div class="hud-value" id="score">0</div></div><button class="pause" id="pause" type="button" aria-label="一時停止">Ⅱ</button></div><div class="hud-mid"><span id="time">02:00</span><b id="combo">COMBO ×1</b></div><div class="progress"><div id="progress"></div></div></div>
<div class="message" id="message" aria-live="polite"></div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div><div class="landscape">縦向きに戻すとプレイできます</div></section>
<footer class="bottom" id="energyPanel"><div class="energy"><div class="energy-label"><span>BOOST ENERGY</span><span id="energyText">0 / 100</span></div><div class="meter"><div id="energyFill"></div></div><div class="hint" id="hint">左右に傾ける／画面をなぞって移動</div></div></footer>
<button id="boost" class="boost-zone" type="button" disabled aria-label="画面下部のブースト領域。エネルギー50で発動"><span class="boost-state">BOOST · 50 ENERGY</span><span class="boost-instruction">下のエリアをタッチ</span></button>
</main>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false}),stage=$('stage'),overlay=$('overlay'),panel=$('panel');
const ui={hud:$('hud'),hp:$('hp'),score:$('score'),time:$('time'),combo:$('combo'),progress:$('progress'),energy:$('energyFill'),energyText:$('energyText'),hint:$('hint'),boost:$('boost'),pause:$('pause'),message:$('message')};
const KEY='gyro-rush:v1',DURATION=120,TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),random=(a,b)=>a+Math.random()*(b-a);
let w=360,h=600,dpr=1,phase='menu',mode='touch',game=null,raf=0,last=0,seen=false,sensor=null,neutral=null,sensorEnabled=false,sensorTimeout=0,pointer=null,touchUntil=0,audio=null;
let sensitivity=1,sound=true,best=0;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(Number.isFinite(saved.highScore))best=Math.max(0,saved.highScore);if(Number.isFinite(saved.sensitivity))sensitivity=clamp(saved.sensitivity,.55,1.65);if(typeof saved.sound==='boolean')sound=saved.sound}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify({highScore:best,sensitivity,sound}))}catch{}}
function state(){return {elapsed:0,ship:{x:w/2,target:w/2,y:h*.78,r:12,inv:0},hp:3,score:0,comboCount:0,multi:1,maxCombo:1,comboTime:0,energy:0,boost:0,boostUses:0,coins:0,near:0,hits:0,spawn:0,waves:0,safe:2,filtered:null,stars:Array.from({length:75},()=>({x:random(0,w),y:random(0,h),z:random(.35,1.7)})),rocks:[],items:[],particles:[],shake:0,flash:0,notice:0,hudTick:0};}
function resize(){const r=stage.getBoundingClientRect(),ow=w,oh=h;w=Math.max(200,r.width||360);h=Math.max(200,r.height||600);dpr=Math.min(window.devicePixelRatio||1,2);ui.boost.style.height=(r.height*.28+$('energyPanel').getBoundingClientRect().height)+'px';canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);if(window.matchMedia('(orientation:landscape) and (max-height:430px)').matches&&phase==='playing')pause(true);if(game){let sx=w/ow;game.ship.x*=sx;game.ship.target*=sx;game.ship.y=h*.78;for(const o of [...game.rocks,...game.items])o.x*=sx;for(const s of game.stars){s.x*=sx;s.y=s.y/oh*h}}draw()}
function panelShow(html){panel.innerHTML=html;overlay.hidden=false;ui.message.classList.remove('show')}
function panelHide(){overlay.hidden=true;canvas.focus({preventScroll:true})}
function menu(note=''){phase='menu';ui.hud.hidden=true;ui.boost.disabled=true;ui.energy.style.width='0%';ui.energyText.textContent='0 / 100';ui.hint.textContent='傾き操作・タッチ操作に対応';panelShow(`<div class="eyebrow">TILT · DODGE · SURVIVE</div><h1>GYRO RUSH</h1><p class="sub">傾けて、かわせ。120秒の宇宙サバイバル。</p><div class="rules"><strong>操作</strong>：左右に傾ける／画面をなぞる<br><strong>得点</strong>：コインとニアミスでコンボ<br><strong>ブースト</strong>：画面下の広い領域をタッチ<br>ゲージ50で2秒間、スコア2倍<br><strong>終了</strong>：3回被弾または120秒でクリア</div><button class="primary" type="button" id="startTilt">◈ ジャイロでスタート</button><button class="secondary" type="button" id="startTouch">☝ タッチでスタート</button><div class="settings"><label class="setting">傾き感度 <input id="sense" type="range" min="0.55" max="1.65" step="0.05" value="${sensitivity}"></label><label class="setting">効果音 <input id="sound" type="checkbox" ${sound?'checked':''}></label></div><div id="notice" class="notice"></div><div class="small">${note}<br>ジャイロ利用時はセンサーの許可が必要です。<br>大きく振らず、座って遊べます。 BEST ${best.toLocaleString('ja-JP')} PTS</div>`);$('sense').oninput=e=>{sensitivity=Number(e.target.value);save()};$('sound').onchange=e=>{sound=e.target.checked;save()};$('startTouch').onclick=()=>start('touch');$('startTilt').onclick=startTilt;draw()}
async function startTilt(){let request;try{if(!('DeviceOrientationEvent' in window))throw Error('傾きセンサーがありません。');request=typeof DeviceOrientationEvent.requestPermission==='function'?DeviceOrientationEvent.requestPermission():Promise.resolve('granted')}catch(e){$('notice').textContent=e.message+' タッチ操作を利用してください。';return}try{$('notice').textContent='センサー接続中…';if(await request!=='granted')throw Error('センサーが許可されませんでした。');seen=false;sensor=null;neutral=null;if(!sensorEnabled){window.addEventListener('deviceorientation',orientation,{passive:true});sensorEnabled=true}start('tilt');clearTimeout(sensorTimeout);sensorTimeout=setTimeout(()=>{if(phase==='playing'&&mode==='tilt'&&!seen){mode='touch';ui.hint.textContent='センサーが応答しないためタッチ操作に変更';announce('タッチ操作に切替',1.8)}},2200)}catch(e){$('notice').textContent=e.message+' タッチ操作を利用してください。'}}
function orientation(e){if(!Number.isFinite(e.gamma))return;sensor=e.gamma;seen=true;if(neutral===null)neutral=sensor}
function soundStart(){if(!sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{}}
function beep(freq=500,duration=.1,type='sine',volume=.06,end){if(!sound||!audio||audio.state!=='running')return;try{const osc=audio.createOscillator(),gain=audio.createGain(),at=audio.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,at);if(end)osc.frequency.exponentialRampToValueAtTime(Math.max(end,30),at+duration);gain.gain.setValueAtTime(volume,at);gain.gain.exponentialRampToValueAtTime(.001,at+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(at);osc.stop(at+duration+.01)}catch{}}
function announce(text,duration=1){if(!game)return;ui.message.textContent=text;ui.message.classList.add('show');game.notice=duration}
function start(which){pointer=null;clearTimeout(sensorTimeout);cancelAnimationFrame(raf);soundStart();phase='playing';mode=which;game=state();last=0;ui.hud.hidden=false;ui.hint.textContent=which==='tilt'?'傾けて移動 · 下側タッチでブースト':'上側をなぞって移動 · 下側タッチでブースト';panelHide();announce('MISSION START',1.2);hud();raf=requestAnimationFrame(loop)}
function pause(auto=false){if(phase!=='playing')return;phase='paused';pointer=null;cancelAnimationFrame(raf);clearTimeout(sensorTimeout);ui.boost.disabled=true;panelShow(`<div class="eyebrow">FLIGHT PAUSED</div><h2>一時停止</h2><p class="sub">スコア ${Math.floor(game.score).toLocaleString('ja-JP')} · 残り ${time(DURATION-game.elapsed)}</p><button class="primary" id="resume">▶ 再開</button>${mode==='tilt'?'<button class="secondary" id="calibrate">◎ 現在の角度を中央に設定</button>':''}<button class="secondary" id="touch">☝ タッチ操作に変更</button><button class="secondary" id="restart">↻ 最初からやり直す</button><div class="small">${auto?'画面が非表示になったため自動停止しました。':'停止中は時間が進みません。'}</div>`);$('resume').onclick=resume;if($('calibrate'))$('calibrate').onclick=()=>{if(Number.isFinite(sensor)){neutral=sensor;game.filtered=sensor;game.ship.target=w/2}resume()};$('touch').onclick=()=>{mode='touch';ui.hint.textContent='画面を左右になぞって移動';resume()};$('restart').onclick=()=>start(mode);draw()}
function resume(){if(phase!=='paused')return;phase='playing';last=0;panelHide();hud();raf=requestAnimationFrame(loop)}
function time(t){let n=Math.max(0,Math.ceil(t));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function boost(){if(phase!=='playing'||game.energy<50||game.boost>0)return;game.energy-=50;game.boost=2;game.boostUses++;beep(240,.2,'sawtooth',.05,850);announce('HYPER BOOST ×2',1.25);hud()}
function finish(clear){if(phase!=='playing')return;phase='result';pointer=null;cancelAnimationFrame(raf);clearTimeout(sensorTimeout);let n=Math.floor(game.score),record=n>best;if(record){best=n;save()}ui.hud.hidden=true;ui.boost.disabled=true;beep(clear?720:170,.34,clear?'triangle':'sawtooth',.07,clear?1100:60);panelShow(`<div class="eyebrow">${clear?'MISSION COMPLETE':'MISSION FAILED'}</div><h2>${clear?'120秒、生還！':'宇宙に散った…'}</h2><div class="total">${n.toLocaleString('ja-JP')}</div><div class="eyebrow">TOTAL SCORE</div><div class="stats"><div>生存時間<b>${game.elapsed.toFixed(1)}秒</b></div><div>獲得コイン<b>${game.coins}個</b></div><div>ニアミス<b>${game.near}回</b></div><div>最大倍率<b>×${game.maxCombo}</b></div><div>被弾回数<b>${game.hits}回</b></div><div>ブースト<b>${game.boostUses}回</b></div></div><div class="best">${record?'★ NEW BEST!':'BEST '+best.toLocaleString('ja-JP')+' PTS'}</div><button class="primary" id="again">↻ もう一度プレイ</button><button class="secondary" id="menu">メニューへ戻る</button>`);$('again').onclick=()=>start(mode);$('menu').onclick=()=>menu();draw()}
function combo(){game.comboCount++;game.comboTime=4;game.multi=game.comboCount>=12?5:game.comboCount>=7?3:game.comboCount>=3?2:1;game.maxCombo=Math.max(game.maxCombo,game.multi);if([3,7,12].includes(game.comboCount)){announce('COMBO ×'+game.multi);beep(450+game.multi*90,.12,'triangle',.06,800)}}
function award(n){game.score+=Math.round(n*game.multi*(game.boost>0?2:1))}
function burst(x,y,color,n=10){for(let k=0;k<n;k++){if(game.particles.length>=120)game.particles.shift();const a=random(0,TAU),speed=random(30,155),life=random(.25,.65);game.particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,color,life,max:life,r:random(1,3)})}}
function speed(){return (145+game.elapsed*1.15)*clamp(h/600,.77,1.25)}
function spawn(){const t=game.elapsed,level=t>110?3:t>75?2:t>30?1:0,laneW=(w-44)/5,center=i=>22+laneW*(i+.5);const shift=Math.round(random(level? -1.8:-1.49,level?1.8:1.49)),safe=clamp(game.safe+shift,0,4);game.safe=safe;game.waves++;let amount=level===0?1+(game.waves%3===0?1:0):level===1?2+(game.waves%4===0?1:0):level===2?2+(game.waves%3!==0?1:0):3+(game.waves%3===0?1:0);const possible=[0,1,2,3,4].filter(n=>n!==safe).sort(()=>Math.random()-.5);for(const lane of possible.slice(0,amount)){const large=level>0&&Math.random()<(level===3?.55:.22),r=large?clamp(laneW*.41,23,42):clamp(laneW*.27,15,26);game.rocks.push({x:center(lane),y:-r-random(0,25),r,vy:speed(),large,rotation:random(0,TAU),spin:random(-.6,.6),shape:Array.from({length:10},()=>random(.77,1.08)),near:false,awarded:false,removed:false})}if(game.waves%2===0)game.items.push({x:center(safe),y:-35,r:12,vy:speed(),type:'coin',spin:0});if(((t>38&&t<46)||(t>77&&t<87))&&game.hp<3&&game.waves%4===0&&Math.random()<.8)game.items.push({x:center(safe),y:-85,r:13,vy:speed(),type:'repair',spin:0});game.spawn=level===0?1.04:level===1?.87:level===2?.77:.69}
function hit(){if(game.ship.inv>0)return;game.hp--;game.hits++;game.ship.inv=1.3;game.comboCount=0;game.comboTime=0;game.multi=1;game.shake=10;game.flash=.3;burst(game.ship.x,game.ship.y,'#ff6e93',24);beep(210,.24,'sawtooth',.07,65);announce(game.hp?'HIT! HP -1':'SHIP DESTROYED',.9);if(game.hp<=0){hud();finish(false)}}
function update(dt){const g=game;g.elapsed=Math.min(DURATION,g.elapsed+dt);g.ship.y=h*.78;if(mode==='tilt'&&seen&&Number.isFinite(sensor)){if(!Number.isFinite(g.filtered))g.filtered=sensor;g.filtered+=(sensor-g.filtered)*(1-Math.exp(-dt/.08));if(pointer===null&&performance.now()>touchUntil){const value=clamp((g.filtered-neutral)*sensitivity/25,-1,1);g.ship.target=w/2+value*(w/2-22)}}const dx=g.ship.target-g.ship.x;g.ship.x=clamp(g.ship.x+clamp(dx,-w*1.55*dt,w*1.55*dt),18,w-18);g.ship.inv=Math.max(0,g.ship.inv-dt);g.shake=Math.max(0,g.shake-33*dt);g.flash=Math.max(0,g.flash-dt);g.boost=Math.max(0,g.boost-dt);g.comboTime=Math.max(0,g.comboTime-dt);if(g.comboCount&&g.comboTime===0){g.comboCount=0;g.multi=1}g.notice=Math.max(0,g.notice-dt);if(g.notice===0)ui.message.classList.remove('show');g.score+=dt*20*(g.boost>0?2:1);g.spawn-=dt;while(g.spawn<=0&&g.elapsed<119.2)spawn();const factor=g.boost>0?1.5:1;for(const s of g.stars){s.y+=dt*(40+s.z*95)*factor;if(s.y>h+3){s.y=-3;s.x=random(0,w)}}for(const o of g.rocks){o.y+=o.vy*dt*factor;o.rotation+=o.spin*dt;const distance=Math.hypot(o.x-g.ship.x,o.y-g.ship.y),contact=o.r+g.ship.r;if(distance<contact&&!o.removed){o.removed=true;hit();if(phase!=='playing')return}else if(!o.removed&&g.ship.inv<=0&&distance<contact+23)o.near=true;if(!o.awarded&&!o.removed&&o.y>g.ship.y+o.r+g.ship.r){o.awarded=true;if(o.near){g.near++;combo();award(o.large?100:50);g.energy=clamp(g.energy+7,0,100);burst(o.x,g.ship.y,'#ffe184',8);beep(570,.07,'sine',.035,730);if(g.near%5===0)announce('NEAR MISS ×'+g.multi)}}}g.rocks=g.rocks.filter(o=>!o.removed&&o.y<h+o.r+40);for(const item of g.items){item.y+=item.vy*dt*factor;item.spin+=dt*5;if(Math.hypot(item.x-g.ship.x,item.y-g.ship.y)<item.r+g.ship.r+1){item.removed=true;if(item.type==='coin'){g.coins++;combo();award(100);g.energy=clamp(g.energy+20,0,100);burst(item.x,item.y,'#ffe874',12);beep(630,.09,'triangle',.055,990)}else{g.hp=Math.min(3,g.hp+1);burst(item.x,item.y,'#78ffb4',14);beep(510,.16,'sine',.07,900);announce('HP +1')}}}g.items=g.items.filter(i=>!i.removed&&i.y<h+40);for(const p of g.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.max(0,1-2*dt);p.vy*=Math.max(0,1-2*dt);p.life-=dt}g.particles=g.particles.filter(p=>p.life>0);g.hudTick+=dt;if(g.hudTick>.08){g.hudTick=0;hud()}if(g.elapsed>=DURATION){hud();finish(true)}}
function hud(){if(!game)return;const g=game;ui.hp.textContent='▰ '.repeat(g.hp).trim()+' ▱'.repeat(3-g.hp);ui.score.textContent=Math.floor(g.score).toLocaleString('ja-JP');ui.time.textContent=time(DURATION-g.elapsed);ui.combo.textContent='COMBO ×'+g.multi;ui.progress.style.width=(g.elapsed/DURATION*100)+'%';ui.energy.style.width=g.energy+'%';ui.energyText.textContent=Math.floor(g.energy)+' / 100';ui.boost.disabled=phase!=='playing'||g.energy<50||g.boost>0;ui.boost.classList.toggle('ready',!ui.boost.disabled);ui.boost.classList.toggle('is-active',g.boost>0);ui.boost.innerHTML='<span class="boost-state">'+(g.boost>0?'BOOST ACTIVE · '+g.boost.toFixed(1)+'s':g.energy>=50?'BOOST READY · 50 ENERGY':'BOOST · '+Math.floor(g.energy)+' / 50')+'</span><span class="boost-instruction">下のエリアをタッチ</span>'}
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const noise=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v);};
function asteroidSprite(o){
 if(o.sprite)return o.sprite;
 const image=document.createElement('canvas');image.width=image.height=160;const a=image.getContext('2d'),center=80,r=65;
 a.beginPath();o.shape.forEach((v,i)=>{const t=i/o.shape.length*TAU,px=center+Math.cos(t)*r*v,py=center+Math.sin(t)*r*v;i?a.lineTo(px,py):a.moveTo(px,py);});a.closePath();a.save();a.clip();
 const stone=a.createRadialGradient(48,38,4,86,88,100);stone.addColorStop(0,'#b9b7a9');stone.addColorStop(.4,'#7d817d');stone.addColorStop(.78,'#4b5357');stone.addColorStop(1,'#252f39');a.fillStyle=stone;a.fillRect(0,0,160,160);
 for(let i=0;i<240;i++){const px=noise(i+o.r)*160,py=noise(i+o.r+8)*160;a.fillStyle=i%2?'#e3dfc31a':'#1024382a';a.fillRect(px,py,1+noise(i+2)*3,1+noise(i+3)*2);}
 for(let i=0;i<11;i++){
  const px=34+noise(i*7+o.r)*94,py=32+noise(i*9+o.r)*92,rr=3+noise(i+o.spin)*13;
  const pit=a.createRadialGradient(px-rr*.25,py-rr*.3,rr*.1,px,py,rr);pit.addColorStop(0,'#26323c9c');pit.addColorStop(.7,'#3e494f88');pit.addColorStop(.86,'#b8b6a257');pit.addColorStop(1,'#d4ceb900');a.fillStyle=pit;a.beginPath();a.ellipse(px,py,rr,rr*.83,i*.4,0,TAU);a.fill();
 }
 a.strokeStyle='#d6d1b329';a.lineWidth=1;for(let i=0;i<6;i++){a.beginPath();a.moveTo(30+i*17,23+noise(i)*30);a.lineTo(22+i*20,66+noise(i+3)*42);a.lineTo(38+i*17,120);a.stroke();}a.restore();
 o.sprite=image;return image;
}
function spacecraft(s,g){
 ctx.save();ctx.translate(s.x,s.y);ctx.rotate(clamp((s.target-s.x)/w,-.3,.3)*.5);
 const t=reducedMotion.matches?0:g.elapsed;
 for(const engine of[-7,7]){
  const length=15+Math.sin(t*38+engine)*2+(g.boost>0?34:0),flame=ctx.createLinearGradient(engine,13,engine,length+22);
  flame.addColorStop(0,'#f4f4dfef');flame.addColorStop(.2,'#a8cce5b8');flame.addColorStop(.6,'#719ecb44');flame.addColorStop(1,'#38628e00');ctx.fillStyle=flame;
  ctx.beginPath();ctx.moveTo(engine-3,13);ctx.bezierCurveTo(engine-5,25,engine-2,length+14,engine,length+22);ctx.bezierCurveTo(engine+2,length+14,engine+5,25,engine+3,13);ctx.fill();
 }
 const hull=ctx.createLinearGradient(-22,-20,23,23);hull.addColorStop(0,'#e6e6d9');hull.addColorStop(.3,'#a9b6ba');hull.addColorStop(.48,'#e6e8dc');hull.addColorStop(.56,'#8e9da8');hull.addColorStop(1,'#475c6d');
 ctx.fillStyle=hull;ctx.strokeStyle='#273a4b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(7,-8);ctx.lineTo(19,3);ctx.lineTo(25,17);ctx.lineTo(12,12);ctx.lineTo(9,22);ctx.lineTo(0,16);ctx.lineTo(-9,22);ctx.lineTo(-12,12);ctx.lineTo(-25,17);ctx.lineTo(-19,3);ctx.lineTo(-7,-8);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.strokeStyle='#40586c99';ctx.lineWidth=.8;
 for(const side of[-1,1]){ctx.beginPath();ctx.moveTo(side*5,-8);ctx.lineTo(side*8,14);ctx.lineTo(side*20,13);ctx.moveTo(side*9,2);ctx.lineTo(side*16,9);ctx.stroke();ctx.fillStyle='#d6c59d';ctx.fillRect(side*16-1,8,2,4);ctx.fillStyle='#455d70';ctx.fillRect(side*7-2,12,4,8);}
 ctx.fillStyle='#dbe5e4';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(2,-15);ctx.lineTo(1,13);ctx.lineTo(-1,13);ctx.lineTo(-2,-15);ctx.fill();
 const glass=ctx.createLinearGradient(-5,-16,6,5);glass.addColorStop(0,'#b8d1ce');glass.addColorStop(.3,'#4b748c');glass.addColorStop(1,'#162f48');ctx.fillStyle=glass;ctx.strokeStyle='#acbec2';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(0,-18);ctx.quadraticCurveTo(7,-7,4,4);ctx.lineTo(-4,4);ctx.quadraticCurveTo(-7,-7,0,-18);ctx.fill();ctx.stroke();
 ctx.strokeStyle='#f5f1d577';ctx.beginPath();ctx.moveTo(-2,-13);ctx.lineTo(-3,-3);ctx.stroke();
 if(s.inv>0){ctx.strokeStyle='#ddb88d7a';ctx.setLineDash([3,5]);ctx.beginPath();ctx.ellipse(0,0,30,35,0,0,TAU);ctx.stroke();ctx.setLineDash([]);}
 if(g.boost>0){ctx.strokeStyle='#abcdd145';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,8,32,45,0,0,TAU);ctx.stroke();}
 ctx.restore();
}
function draw(){
 if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);const g=game||state();
 ctx.fillStyle='#080e18';ctx.fillRect(0,0,w,h);
 const haze=ctx.createRadialGradient(w*.9,h*.13,0,w*.6,h*.25,Math.max(w,h)*.8);haze.addColorStop(0,'#354750');haze.addColorStop(.35,'#172737');haze.addColorStop(1,'#080e18');ctx.fillStyle=haze;ctx.fillRect(0,0,w,h);
 // Distant planetary limb: lit terrain, a thin atmosphere and the night side.
 const px=w*1.02,py=h*.23,r=w*.43;
 ctx.save();ctx.beginPath();ctx.arc(px,py,r,0,TAU);ctx.clip();
 const planet=ctx.createRadialGradient(px-r*.75,py-r*.5,0,px,py,r*1.2);planet.addColorStop(0,'#7a999e');planet.addColorStop(.5,'#3a6978');planet.addColorStop(1,'#102334');ctx.fillStyle=planet;ctx.fillRect(px-r,py-r,r*2,r*2);
 for(let i=0;i<20;i++){const cy=py-r+i*r*.11,cx=px-r+noise(i+2)*r*1.4;ctx.fillStyle=i%2?'#9aa69128':'#cbd3c426';ctx.beginPath();ctx.ellipse(cx,cy,r*(.1+noise(i)*.3),r*.04,Math.sin(i)*.3,0,TAU);ctx.fill();}
 const night=ctx.createLinearGradient(px-r,py,px+r,py);night.addColorStop(0,'#00071300');night.addColorStop(.5,'#00071355');night.addColorStop(1,'#000713ed');ctx.fillStyle=night;ctx.fillRect(px-r,py-r,r*2,r*2);ctx.restore();
 ctx.strokeStyle='#a5cbd24d';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(px,py,r+.7,Math.PI*.75,Math.PI*1.7);ctx.stroke();
 ctx.save();if(g.shake&&!reducedMotion.matches)ctx.translate(Math.sin(g.elapsed*88)*g.shake,Math.cos(g.elapsed*73)*g.shake);
 for(let i=0;i<g.stars.length;i++){const star=g.stars[i];ctx.fillStyle=i%5?'#ccd6d9':'#d9ccae';ctx.globalAlpha=clamp(.18+star.z*.28,.2,.8);ctx.fillRect(star.x,star.y,Math.max(.6,star.z*.7),g.boost>0&&!reducedMotion.matches?star.z*7:Math.max(.7,star.z));}ctx.globalAlpha=1;
 for(const item of g.items){ctx.save();ctx.translate(item.x,item.y);ctx.rotate(Math.sin(item.spin)*.15);const repair=item.type==='repair';ctx.strokeStyle=repair?'#b1ccad':'#d8bf83';ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(0,0,item.r*(.7+Math.abs(Math.cos(item.spin))*.3),item.r,0,0,TAU);ctx.stroke();ctx.fillStyle=repair?'#acc9a6':'#bba46e';ctx.fillRect(-6,-6,12,12);ctx.fillStyle='#263b4a';if(repair){ctx.fillRect(-1,-4,2,8);ctx.fillRect(-4,-1,8,2);}else{ctx.fillRect(-3,-3,6,6);ctx.strokeStyle='#eee1b2';ctx.lineWidth=1;ctx.strokeRect(-5,-5,10,10);}ctx.restore();}
 for(const o of g.rocks){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rotation);const extent=o.r*80/65;ctx.drawImage(asteroidSprite(o),-extent,-extent,extent*2,extent*2);ctx.restore();}
 for(const p of g.particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,Math.max(1,p.r*.7),Math.max(1,p.r*.7));}ctx.globalAlpha=1;
 spacecraft(g.ship,g);ctx.restore();
 if(g.flash>0&&!reducedMotion.matches){const impact=ctx.createRadialGradient(w/2,h/2,h*.12,w/2,h/2,h*.7);impact.addColorStop(0,'#8c554600');impact.addColorStop(1,`rgba(161,82,65,${g.flash*.7})`);ctx.fillStyle=impact;ctx.fillRect(0,0,w,h);}
}
function loop(now){if(phase!=='playing')return;const dt=last?clamp((now-last)/1000,0,.043):0;last=now;update(dt);draw();if(phase==='playing')raf=requestAnimationFrame(loop)}
function xOf(e){const r=canvas.getBoundingClientRect();return clamp(e.clientX-r.left,20,w-20)}
canvas.addEventListener('pointerdown',e=>{if(phase!=='playing'||(pointer!==null&&pointer!==e.pointerId))return;pointer=e.pointerId;try{canvas.setPointerCapture(pointer)}catch{}game.ship.target=xOf(e);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(phase!=='playing'||pointer!==e.pointerId)return;game.ship.target=xOf(e);e.preventDefault()});function release(e){if(pointer===e.pointerId){pointer=null;touchUntil=performance.now()+900}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
ui.boost.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();boost();});ui.boost.addEventListener('click',e=>{if(e.detail===0)boost();});ui.pause.addEventListener('click',()=>pause());document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});window.addEventListener('blur',()=>pause(true));window.addEventListener('keydown',e=>{if(e.code==='Space'&&phase==='playing'&&!['BUTTON','A','INPUT'].includes(document.activeElement?.tagName)){e.preventDefault();boost()}if(phase==='playing'&&['ArrowLeft','ArrowRight'].includes(e.code)){e.preventDefault();game.ship.target=clamp(game.ship.target+(e.code==='ArrowLeft'?-1:1)*w*.12,20,w-20)}if(e.code==='Escape'){if(phase==='playing')pause();else if(phase==='paused')resume()}});
if('ResizeObserver' in window)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>{pointer=null;if(phase==='playing')pause(true);setTimeout(resize,80);});resize();menu();
})();
