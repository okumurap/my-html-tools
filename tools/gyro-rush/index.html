<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#f3f8ff;background:#050916}*{box-sizing:border-box}body{margin:0;overflow:hidden}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f9e783;outline-offset:2px}.app{height:100vh;height:100dvh;max-width:620px;margin:auto;display:flex;flex-direction:column;background:#071027;overflow:hidden}.top,.bottom{flex:none;background:#0b1630;border-color:#345173;border-style:solid;border-width:0;display:flex;align-items:center;gap:12px}.top{border-bottom-width:1px;justify-content:space-between;padding:calc(9px + env(safe-area-inset-top)) 15px 10px;min-height:55px}.brand{font-weight:950;letter-spacing:.18em;font-size:16px}.brand span{color:#53e6ff}.home{color:#b6d6ef;text-decoration:none;font-size:12px}.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;inset:0 0 auto;padding:11px 12px 0;pointer-events:none;text-shadow:0 2px 5px #000}.hud[hidden]{display:none}.hud-line{display:flex;justify-content:space-between;align-items:center;gap:8px}.hud-label{font-size:10px;color:#aac9f3}.hud-value{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}.hearts{color:#ff728c}.hud-mid{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-top:7px}.hud-mid b{color:#ffe67a}.pause{pointer-events:auto;background:#1b3054;color:#fff;border:1px solid #6c93c4;border-radius:12px;min-width:44px;min-height:44px;font-weight:900;font-size:18px}.progress{background:#263b5d;height:4px;border-radius:4px;margin-top:9px;overflow:hidden}.progress div{height:100%;background:#42dbef;width:0}.message{position:absolute;top:30%;left:0;right:0;text-align:center;color:#ffe17e;font-size:23px;font-weight:1000;text-shadow:0 2px 12px #000,0 0 20px #fcbd56;pointer-events:none;opacity:0;transition:opacity .17s}.message.show{opacity:1}.bottom{border-top-width:1px;padding:10px 12px calc(9px + env(safe-area-inset-bottom));min-height:94px}.energy{flex:1;min-width:0}.energy-label{display:flex;justify-content:space-between;gap:4px;color:#bad5f6;font-size:11px;font-weight:800;letter-spacing:.05em}.meter{height:12px;background:#243c60;border:1px solid #52769d;border-radius:50px;overflow:hidden;margin-top:8px}.meter div{height:100%;width:0;background:linear-gradient(90deg,#188cff,#5aeeff)}.hint{font-size:10px;color:#93b5d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.boost{min-width:114px;min-height:69px;border:1px solid #55dfff;border-radius:17px;background:linear-gradient(135deg,#136f9b,#27438b);color:white;font-size:17px;font-weight:950}.boost small{display:block;font-size:10px;margin-top:2px}.boost:disabled{opacity:.4}.boost.ready{box-shadow:0 0 20px #42dfff66}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#050a1bd9,#050a1bef);z-index:5;overflow:auto;padding:14px}.overlay[hidden]{display:none}.panel{width:min(100%,390px);padding:19px 17px;background:linear-gradient(145deg,#142b51,#09152e);border:1px solid #466a96;border-radius:22px;text-align:center;box-shadow:0 20px 55px #0009}.eyebrow{color:#79e8ff;font-size:10px;font-weight:900;letter-spacing:.19em}.panel h1{margin:7px 0;font-size:clamp(31px,9vw,46px);letter-spacing:.04em}.panel h2{font-size:29px;margin:8px 0}.sub{font-size:12px;color:#bad4f5;line-height:1.6}.rules{text-align:left;background:#0b1c3d;border:1px solid #315078;border-radius:12px;padding:11px;font-size:12px;line-height:1.85;margin:13px 0}.rules strong{color:#68eaff}.primary,.secondary{display:block;width:100%;min-height:48px;border-radius:12px;font-weight:900;margin-top:9px}.primary{border:0;color:#05243a;background:linear-gradient(110deg,#61f4ff,#75b7ff)}.secondary{border:1px solid #4d72a6;color:#e8f5ff;background:#20375d}.settings{border-top:1px solid #42608c;margin-top:13px;padding-top:12px}.setting{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin:8px 0}.setting input[type=range]{width:52%;accent-color:#57e0f3}.setting input[type=checkbox]{width:20px;height:20px;accent-color:#50d5ed}.notice{font-size:11px;color:#ffd88b;min-height:16px;margin-top:10px}.small{color:#a8bddc;font-size:10px;line-height:1.6;margin-top:10px}.total{font-size:48px;font-weight:950;color:#77f0ff;margin:10px 0}.stats{display:grid;grid-template-columns:1fr 1fr;text-align:left;gap:8px;margin:13px 0}.stats div{background:#0a1e3f;border:1px solid #32527b;border-radius:10px;color:#a9c5e9;padding:9px;font-size:11px}.stats b{display:block;color:#fff;font-size:17px;margin-top:3px}.best{color:#ffe084;font-weight:900}.landscape{display:none}@media(max-height:640px){.panel{padding:11px 14px}.panel h1{font-size:31px}.rules{padding:6px 10px;margin:8px 0}.bottom{min-height:77px}.boost{min-height:57px}}@media(orientation:landscape) and (max-height:430px){.landscape{position:absolute;inset:0;display:grid;place-items:center;background:#071027;z-index:9;font-weight:800;text-align:center;padding:20px}}@media(prefers-reduced-motion:reduce){.message{transition:none}}

<body class="mobile-touch-game">
<main class="app" aria-label="ジャイロ宇宙船ゲーム">
<header class="top"><div class="brand">GYRO <span>RUSH</span></div><a class="home" href="../../index.html">ツール一覧へ</a></header>
<section class="stage" id="stage" aria-label="宇宙船ゲーム。画面を横になぞると機体が移動します"><canvas id="game" aria-label="宇宙船と隕石"></canvas>
<div class="hud" id="hud" hidden><div class="hud-line"><div><div class="hud-label">HP</div><div class="hud-value hearts" id="hp">♥ ♥ ♥</div></div><div style="text-align:right"><div class="hud-label">SCORE</div><div class="hud-value" id="score">0</div></div><button class="pause" id="pause" type="button" aria-label="一時停止">Ⅱ</button></div><div class="hud-mid"><span id="time">02:00</span><b id="combo">COMBO ×1</b></div><div class="progress"><div id="progress"></div></div></div>
<div class="message" id="message" aria-live="polite"></div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div><div class="landscape">縦向きに戻すとプレイできます</div></section>
<footer class="bottom"><div class="energy"><div class="energy-label"><span>BOOST ENERGY</span><span id="energyText">0 / 100</span></div><div class="meter"><div id="energyFill"></div></div><div class="hint" id="hint">左右に傾ける／画面をなぞって移動</div></div><button id="boost" class="boost" type="button" disabled>⚡ BOOST<small>50 ENERGY</small></button></footer>
</main>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false}),stage=$('stage'),overlay=$('overlay'),panel=$('panel');
const ui={hud:$('hud'),hp:$('hp'),score:$('score'),time:$('time'),combo:$('combo'),progress:$('progress'),energy:$('energyFill'),energyText:$('energyText'),hint:$('hint'),boost:$('boost'),pause:$('pause'),message:$('message')};
const KEY='gyro-rush:v1',DURATION=120,TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),random=(a,b)=>a+Math.random()*(b-a);
let w=360,h=600,dpr=1,phase='menu',mode='touch',game=null,raf=0,last=0,seen=false,sensor=null,neutral=null,sensorEnabled=false,sensorTimeout=0,pointer=null,touchUntil=0,audio=null;
let sensitivity=1,sound=true,best=0;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(Number.isFinite(saved.highScore))best=Math.max(0,saved.highScore);if(Number.isFinite(saved.sensitivity))sensitivity=clamp(saved.sensitivity,.55,1.65);if(typeof saved.sound==='boolean')sound=saved.sound}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify({highScore:best,sensitivity,sound}))}catch{}}
function state(){return {elapsed:0,ship:{x:w/2,target:w/2,y:h*.78,r:12,inv:0},hp:3,score:0,comboCount:0,multi:1,maxCombo:1,comboTime:0,energy:0,boost:0,boostUses:0,coins:0,near:0,hits:0,spawn:0,waves:0,safe:2,filtered:null,stars:Array.from({length:75},()=>({x:random(0,w),y:random(0,h),z:random(.35,1.7)})),rocks:[],items:[],particles:[],shake:0,flash:0,notice:0,hudTick:0};}
function resize(){const r=stage.getBoundingClientRect(),ow=w,oh=h;w=Math.max(200,r.width||360);h=Math.max(200,r.height||600);dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);if(game){let sx=w/ow;game.ship.x*=sx;game.ship.target*=sx;game.ship.y=h*.78;for(const o of [...game.rocks,...game.items])o.x*=sx;for(const s of game.stars){s.x*=sx;s.y=s.y/oh*h}}draw()}
function panelShow(html){panel.innerHTML=html;overlay.hidden=false;ui.message.classList.remove('show')}
function panelHide(){overlay.hidden=true}
function menu(note=''){phase='menu';ui.hud.hidden=true;ui.boost.disabled=true;ui.energy.style.width='0%';ui.energyText.textContent='0 / 100';ui.hint.textContent='傾き操作・タッチ操作に対応';panelShow(`<div class="eyebrow">TILT · DODGE · SURVIVE</div><h1>GYRO RUSH</h1><p class="sub">傾けて、かわせ。120秒の宇宙サバイバル。</p><div class="rules"><strong>操作</strong>：左右に傾ける／画面をなぞる<br><strong>得点</strong>：コインとニアミスでコンボ<br><strong>ブースト</strong>：ゲージ50で2秒間、スコア2倍<br><strong>終了</strong>：3回被弾または120秒でクリア</div><button class="primary" type="button" id="startTilt">◈ ジャイロでスタート</button><button class="secondary" type="button" id="startTouch">☝ タッチでスタート</button><div class="settings"><label class="setting">傾き感度 <input id="sense" type="range" min="0.55" max="1.65" step="0.05" value="${sensitivity}"></label><label class="setting">効果音 <input id="sound" type="checkbox" ${sound?'checked':''}></label></div><div id="notice" class="notice"></div><div class="small">${note}<br>ジャイロ利用時はセンサーの許可が必要です。<br>大きく振らず、座って遊べます。 BEST ${best.toLocaleString('ja-JP')} PTS</div>`);$('sense').oninput=e=>{sensitivity=Number(e.target.value);save()};$('sound').onchange=e=>{sound=e.target.checked;save()};$('startTouch').onclick=()=>start('touch');$('startTilt').onclick=startTilt;draw()}
async function startTilt(){let request;try{if(!('DeviceOrientationEvent' in window))throw Error('傾きセンサーがありません。');request=typeof DeviceOrientationEvent.requestPermission==='function'?DeviceOrientationEvent.requestPermission():Promise.resolve('granted')}catch(e){$('notice').textContent=e.message+' タッチ操作を利用してください。';return}try{$('notice').textContent='センサー接続中…';if(await request!=='granted')throw Error('センサーが許可されませんでした。');seen=false;sensor=null;neutral=null;if(!sensorEnabled){window.addEventListener('deviceorientation',orientation,{passive:true});sensorEnabled=true}start('tilt');clearTimeout(sensorTimeout);sensorTimeout=setTimeout(()=>{if(phase==='playing'&&mode==='tilt'&&!seen){mode='touch';ui.hint.textContent='センサーが応答しないためタッチ操作に変更';announce('タッチ操作に切替',1.8)}},2200)}catch(e){$('notice').textContent=e.message+' タッチ操作を利用してください。'}}
function orientation(e){if(!Number.isFinite(e.gamma))return;sensor=e.gamma;seen=true;if(neutral===null)neutral=sensor}
function soundStart(){if(!sound)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch{}}
function beep(freq=500,duration=.1,type='sine',volume=.06,end){if(!sound||!audio||audio.state!=='running')return;try{const osc=audio.createOscillator(),gain=audio.createGain(),at=audio.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,at);if(end)osc.frequency.exponentialRampToValueAtTime(Math.max(end,30),at+duration);gain.gain.setValueAtTime(volume,at);gain.gain.exponentialRampToValueAtTime(.001,at+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(at);osc.stop(at+duration+.01)}catch{}}
function announce(text,duration=1){if(!game)return;ui.message.textContent=text;ui.message.classList.add('show');game.notice=duration}
function start(which){clearTimeout(sensorTimeout);cancelAnimationFrame(raf);soundStart();phase='playing';mode=which;game=state();last=0;ui.hud.hidden=false;ui.hint.textContent=which==='tilt'?'左右に傾ける・タッチも可能':'画面を左右になぞって移動';panelHide();announce('MISSION START',1.2);hud();raf=requestAnimationFrame(loop)}
function pause(auto=false){if(phase!=='playing')return;phase='paused';cancelAnimationFrame(raf);clearTimeout(sensorTimeout);ui.boost.disabled=true;panelShow(`<div class="eyebrow">FLIGHT PAUSED</div><h2>一時停止</h2><p class="sub">スコア ${Math.floor(game.score).toLocaleString('ja-JP')} · 残り ${time(DURATION-game.elapsed)}</p><button class="primary" id="resume">▶ 再開</button>${mode==='tilt'?'<button class="secondary" id="calibrate">◎ 現在の角度を中央に設定</button>':''}<button class="secondary" id="touch">☝ タッチ操作に変更</button><button class="secondary" id="restart">↻ 最初からやり直す</button><div class="small">${auto?'画面が非表示になったため自動停止しました。':'停止中は時間が進みません。'}</div>`);$('resume').onclick=resume;if($('calibrate'))$('calibrate').onclick=()=>{if(Number.isFinite(sensor)){neutral=sensor;game.filtered=sensor;game.ship.target=w/2}resume()};$('touch').onclick=()=>{mode='touch';ui.hint.textContent='画面を左右になぞって移動';resume()};$('restart').onclick=()=>start(mode);draw()}
function resume(){if(phase!=='paused')return;phase='playing';last=0;panelHide();hud();raf=requestAnimationFrame(loop)}
function time(t){let n=Math.max(0,Math.ceil(t));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function boost(){if(phase!=='playing'||game.energy<50||game.boost>0)return;game.energy-=50;game.boost=2;game.boostUses++;beep(240,.2,'sawtooth',.05,850);announce('HYPER BOOST ×2',1.25);hud()}
function finish(clear){if(phase!=='playing')return;phase='result';cancelAnimationFrame(raf);clearTimeout(sensorTimeout);let n=Math.floor(game.score),record=n>best;if(record){best=n;save()}ui.hud.hidden=true;ui.boost.disabled=true;beep(clear?720:170,.34,clear?'triangle':'sawtooth',.07,clear?1100:60);panelShow(`<div class="eyebrow">${clear?'MISSION COMPLETE':'MISSION FAILED'}</div><h2>${clear?'120秒、生還！':'宇宙に散った…'}</h2><div class="total">${n.toLocaleString('ja-JP')}</div><div class="eyebrow">TOTAL SCORE</div><div class="stats"><div>生存時間<b>${game.elapsed.toFixed(1)}秒</b></div><div>獲得コイン<b>${game.coins}個</b></div><div>ニアミス<b>${game.near}回</b></div><div>最大倍率<b>×${game.maxCombo}</b></div><div>被弾回数<b>${game.hits}回</b></div><div>ブースト<b>${game.boostUses}回</b></div></div><div class="best">${record?'★ NEW BEST!':'BEST '+best.toLocaleString('ja-JP')+' PTS'}</div><button class="primary" id="again">↻ もう一度プレイ</button><button class="secondary" id="menu">メニューへ戻る</button>`);$('again').onclick=()=>start(mode);$('menu').onclick=()=>menu();draw()}
function combo(){game.comboCount++;game.comboTime=4;game.multi=game.comboCount>=12?5:game.comboCount>=7?3:game.comboCount>=3?2:1;game.maxCombo=Math.max(game.maxCombo,game.multi);if([3,7,12].includes(game.comboCount)){announce('COMBO ×'+game.multi);beep(450+game.multi*90,.12,'triangle',.06,800)}}
function award(n){game.score+=Math.round(n*game.multi*(game.boost>0?2:1))}
function burst(x,y,color,n=10){for(let k=0;k<n;k++){if(game.particles.length>=120)game.particles.shift();const a=random(0,TAU),speed=random(30,155),life=random(.25,.65);game.particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,color,life,max:life,r:random(1,3)})}}
function speed(){return (145+game.elapsed*1.15)*clamp(h/600,.77,1.25)}
function spawn(){const t=game.elapsed,level=t>110?3:t>75?2:t>30?1:0,laneW=(w-44)/5,center=i=>22+laneW*(i+.5);const shift=Math.round(random(level? -1.8:-1.49,level?1.8:1.49)),safe=clamp(game.safe+shift,0,4);game.safe=safe;game.waves++;let amount=level===0?1+(game.waves%3===0?1:0):level===1?2+(game.waves%4===0?1:0):level===2?2+(game.waves%3!==0?1:0):3+(game.waves%3===0?1:0);const possible=[0,1,2,3,4].filter(n=>n!==safe).sort(()=>Math.random()-.5);for(const lane of possible.slice(0,amount)){const large=level>0&&Math.random()<(level===3?.55:.22),r=large?clamp(laneW*.41,23,42):clamp(laneW*.27,15,26);game.rocks.push({x:center(lane),y:-r-random(0,25),r,vy:speed(),large,rotation:random(0,TAU),spin:random(-.6,.6),shape:Array.from({length:10},()=>random(.77,1.08)),near:false,awarded:false,removed:false})}if(game.waves%2===0)game.items.push({x:center(safe),y:-35,r:12,vy:speed(),type:'coin',spin:0});if(((t>38&&t<46)||(t>77&&t<87))&&game.hp<3&&game.waves%4===0&&Math.random()<.8)game.items.push({x:center(safe),y:-85,r:13,vy:speed(),type:'repair',spin:0});game.spawn=level===0?1.04:level===1?.87:level===2?.77:.69}
function hit(){if(game.ship.inv>0)return;game.hp--;game.hits++;game.ship.inv=1.3;game.comboCount=0;game.comboTime=0;game.multi=1;game.shake=10;game.flash=.3;burst(game.ship.x,game.ship.y,'#ff6e93',24);beep(210,.24,'sawtooth',.07,65);announce(game.hp?'HIT! HP -1':'SHIP DESTROYED',.9);if(game.hp<=0){hud();finish(false)}}
function update(dt){const g=game;g.elapsed=Math.min(DURATION,g.elapsed+dt);g.ship.y=h*.78;if(mode==='tilt'&&seen&&Number.isFinite(sensor)){if(!Number.isFinite(g.filtered))g.filtered=sensor;g.filtered+=(sensor-g.filtered)*(1-Math.exp(-dt/.08));if(pointer===null&&performance.now()>touchUntil){const value=clamp((g.filtered-neutral)*sensitivity/25,-1,1),dead=3/25;g.ship.target=w/2+(Math.abs(value)<dead?0:Math.sign(value)*(Math.abs(value)-dead)/(1-dead))*(w/2-22)}}const dx=g.ship.target-g.ship.x;g.ship.x=clamp(g.ship.x+clamp(dx,-w*1.55*dt,w*1.55*dt),18,w-18);g.ship.inv=Math.max(0,g.ship.inv-dt);g.shake=Math.max(0,g.shake-33*dt);g.flash=Math.max(0,g.flash-dt);g.boost=Math.max(0,g.boost-dt);g.comboTime=Math.max(0,g.comboTime-dt);if(g.comboCount&&g.comboTime===0){g.comboCount=0;g.multi=1}g.notice=Math.max(0,g.notice-dt);if(g.notice===0)ui.message.classList.remove('show');g.score+=dt*20*(g.boost>0?2:1);g.spawn-=dt;while(g.spawn<=0&&g.elapsed<119.2)spawn();const factor=g.boost>0?1.5:1;for(const s of g.stars){s.y+=dt*(40+s.z*95)*factor;if(s.y>h+3){s.y=-3;s.x=random(0,w)}}for(const o of g.rocks){o.y+=o.vy*dt*factor;o.rotation+=o.spin*dt;const distance=Math.hypot(o.x-g.ship.x,o.y-g.ship.y),contact=o.r+g.ship.r;if(distance<contact&&!o.removed){o.removed=true;hit();if(phase!=='playing')return}else if(!o.removed&&g.ship.inv<=0&&distance<contact+23)o.near=true;if(!o.awarded&&!o.removed&&o.y>g.ship.y+o.r+g.ship.r){o.awarded=true;if(o.near){g.near++;combo();award(o.large?100:50);g.energy=clamp(g.energy+7,0,100);burst(o.x,g.ship.y,'#ffe184',8);beep(570,.07,'sine',.035,730);if(g.near%5===0)announce('NEAR MISS ×'+g.multi)}}}g.rocks=g.rocks.filter(o=>!o.removed&&o.y<h+o.r+40);for(const item of g.items){item.y+=item.vy*dt*factor;item.spin+=dt*5;if(Math.hypot(item.x-g.ship.x,item.y-g.ship.y)<item.r+g.ship.r+1){item.removed=true;if(item.type==='coin'){g.coins++;combo();award(100);g.energy=clamp(g.energy+20,0,100);burst(item.x,item.y,'#ffe874',12);beep(630,.09,'triangle',.055,990)}else{g.hp=Math.min(3,g.hp+1);burst(item.x,item.y,'#78ffb4',14);beep(510,.16,'sine',.07,900);announce('HP +1')}}}g.items=g.items.filter(i=>!i.removed&&i.y<h+40);for(const p of g.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.max(0,1-2*dt);p.vy*=Math.max(0,1-2*dt);p.life-=dt}g.particles=g.particles.filter(p=>p.life>0);g.hudTick+=dt;if(g.hudTick>.08){g.hudTick=0;hud()}if(g.elapsed>=DURATION){hud();finish(true)}}
function hud(){if(!game)return;const g=game;ui.hp.textContent='♥ '.repeat(g.hp).trim()+' ♡'.repeat(3-g.hp);ui.score.textContent=Math.floor(g.score).toLocaleString('ja-JP');ui.time.textContent=time(DURATION-g.elapsed);ui.combo.textContent='COMBO ×'+g.multi;ui.progress.style.width=(g.elapsed/DURATION*100)+'%';ui.energy.style.width=g.energy+'%';ui.energyText.textContent=Math.floor(g.energy)+' / 100';ui.boost.disabled=phase!=='playing'||g.energy<50||g.boost>0;ui.boost.classList.toggle('ready',!ui.boost.disabled);ui.boost.innerHTML=g.boost>0?'⚡ ACTIVE<small>'+g.boost.toFixed(1)+'s</small>':'⚡ BOOST<small>50 ENERGY</small>'}
function draw(){if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);const g=game||state();ctx.fillStyle='#050a1d';ctx.fillRect(0,0,w,h);const grad=ctx.createRadialGradient(w*.25,h*.25,8,w*.48,h*.45,h*.72);grad.addColorStop(0,'#193568');grad.addColorStop(.52,'#0d193c');grad.addColorStop(1,'#050a1d');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.save();if(g.shake)ctx.translate(random(-g.shake,g.shake),random(-g.shake,g.shake));ctx.fillStyle='#b6daff';for(const s of g.stars){ctx.globalAlpha=clamp(.4+s.z*.3,.3,.95);ctx.fillRect(s.x,s.y,Math.max(.8,s.z),g.boost>0?s.z*6:s.z*2)}ctx.globalAlpha=1;for(const item of g.items){ctx.save();ctx.translate(item.x,item.y);ctx.rotate(Math.sin(item.spin)*.3);ctx.shadowColor=item.type==='repair'?'#66ffb5':'#ffdc65';ctx.shadowBlur=20;ctx.strokeStyle=item.type==='repair'?'#8fffc7':'#ffd15b';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,item.r*(.65+Math.abs(Math.cos(item.spin))*.35),item.r,0,0,TAU);ctx.stroke();ctx.fillStyle='#ffefa7';if(item.type==='repair'){ctx.fillRect(-2,-7,4,14);ctx.fillRect(-7,-2,14,4)}else{ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(4,0);ctx.lineTo(0,7);ctx.lineTo(-4,0);ctx.fill()}ctx.restore()}for(const o of g.rocks){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rotation);ctx.beginPath();for(let j=0;j<o.shape.length;j++){let a=j/o.shape.length*TAU,r=o.r*o.shape[j];if(j===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();const fill=ctx.createRadialGradient(-o.r*.3,-o.r*.4,2,0,0,o.r*1.3);fill.addColorStop(0,'#d1a789');fill.addColorStop(.65,'#936754');fill.addColorStop(1,'#563e47');ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle='#e7b48e';ctx.lineWidth=1.3;ctx.stroke();ctx.fillStyle='#554449';for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(Math.cos(k*2.2)*o.r*.42,Math.sin(k*2.2)*o.r*.42,o.r*.16,o.r*.12,k*.6,0,TAU);ctx.fill()}ctx.restore()}for(const p of g.particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;const s=g.ship;if(!(s.inv>0&&Math.floor(s.inv*12)%2===0)){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(clamp((s.target-s.x)/w,-.3,.3)*.5);ctx.shadowColor=g.boost>0?'#63ffff':'#22caff';ctx.shadowBlur=g.boost>0?30:14;let tail=19+Math.sin(g.elapsed*32)*4+(g.boost>0?28:0),flame=ctx.createLinearGradient(0,10,0,tail+23);flame.addColorStop(0,'#fff');flame.addColorStop(.25,'#74faff');flame.addColorStop(1,'#1788ff00');ctx.fillStyle=flame;ctx.beginPath();ctx.moveTo(-6,12);ctx.lineTo(0,tail+23);ctx.lineTo(6,12);ctx.fill();ctx.shadowBlur=10;ctx.fillStyle='#48ddff';ctx.strokeStyle='#e3ffff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(7,-7);ctx.lineTo(20,7);ctx.lineTo(24,16);ctx.lineTo(11,12);ctx.lineTo(9,21);ctx.lineTo(0,14);ctx.lineTo(-9,21);ctx.lineTo(-11,12);ctx.lineTo(-24,16);ctx.lineTo(-20,7);ctx.lineTo(-7,-7);ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#195098';ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(6,-4);ctx.lineTo(4,9);ctx.lineTo(-4,9);ctx.lineTo(-6,-4);ctx.fill();if(g.boost>0){ctx.strokeStyle='#52edff80';ctx.beginPath();ctx.ellipse(0,0,30,38,0,0,TAU);ctx.stroke()}ctx.restore()}ctx.restore();if(g.flash>0){ctx.fillStyle=`rgba(255,75,105,${g.flash*.47})`;ctx.fillRect(0,0,w,h)}}
function loop(now){if(phase!=='playing')return;const dt=last?clamp((now-last)/1000,0,.043):0;last=now;update(dt);draw();if(phase==='playing')raf=requestAnimationFrame(loop)}
function xOf(e){const r=canvas.getBoundingClientRect();return clamp(e.clientX-r.left,20,w-20)}
canvas.addEventListener('pointerdown',e=>{if(phase!=='playing')return;pointer=e.pointerId;try{canvas.setPointerCapture(pointer)}catch{}game.ship.target=xOf(e);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(phase!=='playing'||pointer!==e.pointerId)return;game.ship.target=xOf(e);e.preventDefault()});function release(e){if(pointer===e.pointerId){pointer=null;touchUntil=performance.now()+900}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
ui.boost.addEventListener('click',boost);ui.pause.addEventListener('click',()=>pause());document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});window.addEventListener('blur',()=>pause(true));window.addEventListener('keydown',e=>{if(e.code==='Space'&&phase==='playing'){e.preventDefault();boost()}if(phase==='playing'&&['ArrowLeft','ArrowRight'].includes(e.code)){e.preventDefault();game.ship.target=clamp(game.ship.target+(e.code==='ArrowLeft'?-1:1)*w*.12,20,w-20)}if(e.code==='Escape'){if(phase==='playing')pause();else if(phase==='paused')resume()}});
if('ResizeObserver' in window)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,80));resize();menu();
})();
