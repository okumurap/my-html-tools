<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e8f4df">
<title>レールタウン・レイアウト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,"Yu Gothic",sans-serif;background:#f3f0e7;color:#263238}button{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:7px;padding:max(7px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}header{display:flex;align-items:center;gap:9px}.logo{width:36px;height:36px;border-radius:11px;background:#eb5b47;display:grid;place-items:center;font-size:20px}h1{font-size:clamp(16px,3vw,22px);margin:0}.sub{font-size:11px;color:#66756f}.head-actions{margin-left:auto;display:flex;gap:5px}.icon,.btn,.tool{border:1px solid #d7d4ca;background:#fffdf7;border-radius:12px;box-shadow:0 3px 10px #2a373014;cursor:pointer}.icon{width:40px;height:38px;font-size:17px}.stage{position:relative;min-height:0;border-radius:17px;overflow:hidden;border:1px solid #c9d9ba;background:#dfeecf;box-shadow:0 10px 28px #2a373021}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:9px;left:9px;display:flex;gap:6px;pointer-events:none}.pill{background:#ffffffe8;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}.msg{position:absolute;bottom:10px;left:50%;transform:translate(-50%,15px);opacity:0;transition:.2s;background:#263238e8;color:#fff;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.msg.show{opacity:1;transform:translate(-50%,0)}.bottom{display:grid;gap:6px}.tools,.controls{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tools::-webkit-scrollbar,.controls::-webkit-scrollbar{display:none}.tool{flex:0 0 75px;padding:6px 4px}.tool.active{outline:2px solid #eb5b4740;border-color:#eb5b47}.tool b{display:block;font-size:23px;line-height:27px}.tool span{display:block;font-size:11px;font-weight:800}.btn{height:38px;padding:0 12px;font-size:13px;font-weight:800;white-space:nowrap}.btn.primary{background:#eb5b47;color:white;border-color:#d64a39}.speed{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fffdf7;border:1px solid #d7d4ca;border-radius:12px;padding:0 9px;min-width:135px;font-size:11px;font-weight:800}.speed input{width:75px;accent-color:#eb5b47}.modal{position:fixed;inset:0;background:#17201b70;display:none;place-items:center;padding:18px}.modal.open{display:grid}.card{max-width:500px;background:#fffdf7;border-radius:18px;padding:20px;line-height:1.7}.card h2{margin-top:0}.card button{width:100%;height:42px;border:0;border-radius:11px;background:#263238;color:white;font-weight:800}@media(max-width:650px){.sub{display:none}.optional{display:none}.logo{width:33px;height:33px}.tool{flex-basis:69px}.stage{border-radius:13px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🚆</div><div><h1>レールタウン・レイアウト</h1><div class="sub">線路をつないで、列車を走らせよう</div></div><div class="head-actions"><button class="icon optional" id="save">💾</button><button class="icon optional" id="load">📂</button><button class="icon" id="sound">🔊</button><button class="icon" id="help">？</button></div></header>
<main class="stage" id="stage"><canvas id="cv"></canvas><div class="hud"><div class="pill" id="toolName">直線・横</div><div class="pill" id="trainCount">列車 1本</div></div><div class="msg" id="msg"></div></main>
<section class="bottom"><div class="tools" id="tools">
<button class="tool active" data-t="straight"><b>━</b><span>直線</span></button><button class="tool" data-t="curve"><b>╰</b><span>カーブ</span></button><button class="tool" data-t="station"><b>🚉</b><span>駅</span></button><button class="tool" data-t="crossing"><b>🚧</b><span>踏切</span></button><button class="tool" data-t="switch"><b>⑂</b><span>ポイント</span></button><button class="tool" data-t="train"><b>🚃</b><span>列車</span></button><button class="tool" data-t="delete"><b>⌫</b><span>消す</span></button>
</div><div class="controls"><button class="btn primary" id="play">▶ 運転</button><button class="btn" id="rotate">↻ 回転</button><button class="btn" id="undo">↶ 戻す</button><button class="btn" id="demo">🏙 お手本</button><button class="btn" id="clear">全消去</button><label class="speed">速度<input id="speed" type="range" min=".5" max="1.8" step=".1" value="1"></label></div></section>
</div>
<div class="modal" id="modal"><div class="card"><h2>遊び方</h2><p>パーツを選び、マスをタップして配置します。「回転」で向きを変えられます。線路の上に列車を置いて「運転」を押してください。</p><p>運転中にポイントをタップすると進路が切り替わります。駅では自動停車し、踏切は列車が近づくと閉まります。</p><button id="close">わかった</button></div></div>
<script>
(()=>{'use strict';
const cv=document.querySelector('#cv'),x=cv.getContext('2d'),stage=document.querySelector('#stage'),C=12,R=8,D=['N','E','S','W'],V={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]},O={N:'S',E:'W',S:'N',W:'E'},colors=['#e64c3c','#2f7ec1','#f0a629'];let g=grid(),tr=[],tool='straight',rot=0,run=false,spd=1,hist=[],down=false,last='',vw={},audio=null,sound=true,toastTimer=0,lastTime=performance.now();
function grid(){return Array.from({length:R},()=>Array(C).fill(null))}function cp(){return JSON.parse(JSON.stringify({g,tr}))}function push(){hist.push(cp());if(hist.length>25)hist.shift()}function piece(a,b){return a>=0&&b>=0&&a<C&&b<R?g[b][a]:null}
function con(p){if(!p)return[];let r=p.r||0;if(['straight','station','crossing'].includes(p.t))return r%2?['N','S']:['W','E'];if(p.t==='curve')return [['N','E'],['E','S'],['S','W'],['W','N']][r%4];if(p.t==='switch')return [[['W','E'],['W','N']],[['N','S'],['N','E']],[['E','W'],['E','S']],[['S','N'],['S','W']]][r%4].flat();return[]}
function exit(p,e){if(!p)return null;let r=p.r||0;if(['straight','station','crossing'].includes(p.t)){let a=con(p);return a.includes(e)?a.find(q=>q!==e):null}if(p.t==='curve'){let a=con(p);return a.includes(e)?a.find(q=>q!==e):null}if(p.t==='switch'){let z=[[['W','E'],['W','N']],[['N','S'],['N','E']],[['E','W'],['E','S']],[['S','N'],['S','W']]][r%4],route=p.a?z[1]:z[0];if(route.includes(e))return route.find(q=>q!==e);for(let q of z)if(q.includes(e))return q.find(k=>k!==e)}return null}
function resize(){let r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;x.setTransform(d,0,0,d,0,0);let cell=Math.min((r.width-16)/C,(r.height-16)/R);vw={w:r.width,h:r.height,c:cell,ox:(r.width-cell*C)/2,oy:(r.height-cell*R)/2}}
function pathCell(cx,cy,p){let c=vw.c,l=vw.ox+cx*c,t=vw.oy+cy*c,mx=l+c/2,my=t+c/2,pts={N:[mx,t],E:[l+c,my],S:[mx,t+c],W:[l,my]};x.lineCap='round';x.lineJoin='round';function line(a,b){x.beginPath();x.moveTo(...pts[a]);x.lineTo(mx,my);x.lineTo(...pts[b])}function rails(a,b){line(a,b);x.strokeStyle='#7a6d5d';x.lineWidth=c*.24;x.stroke();line(a,b);x.strokeStyle='#ded6c7';x.lineWidth=c*.12;x.stroke();line(a,b);x.strokeStyle='#8e8374';x.setLineDash([3,5]);x.lineWidth=2;x.stroke();x.setLineDash([])}if(!p)return;if(p.t==='switch'){let z=[[['W','E'],['W','N']],[['N','S'],['N','E']],[['E','W'],['E','S']],[['S','N'],['S','W']]][p.r%4];rails(...z[0]);rails(...z[1]);x.fillStyle=p.a?'#eb5b47':'#2f83c5';x.beginPath();x.arc(mx,my,c*.09,0,7);x.fill()}else rails(...con(p));if(p.t==='station'){x.fillStyle='#faf6e8';x.fillRect(l+c*.12,t+c*.08,c*.76,c*.18);x.fillStyle='#e85b47';x.fillRect(l+c*.12,t+c*.08,c*.76,c*.045)}if(p.t==='crossing'){let closed=tr.some(q=>Math.abs(q.x-cx)+Math.abs(q.y-cy)<=1.2);x.save();x.translate(mx,my);x.rotate((p.r%2)*Math.PI/2);x.strokeStyle='#333';x.lineWidth=3;x.beginPath();x.moveTo(-c*.32,-c*.2);x.lineTo(c*.32,c*.2);x.moveTo(-c*.32,c*.2);x.lineTo(c*.32,-c*.2);x.stroke();x.strokeStyle='#e33';x.lineWidth=4;x.beginPath();x.moveTo(0,0);x.lineTo(closed?0:-c*.3,closed?c*.3:-c*.24);x.stroke();x.restore()}}
function point(t){let p=piece(t.x,t.y),a=loc(t.x,t.y,t.en,t.ex,t.p),b=loc(t.x,t.y,t.en,t.ex,Math.min(1,t.p+.03)),ang=Math.atan2(b[1]-a[1],b[0]-a[0]),c=vw.c;x.save();x.translate(...a);x.rotate(ang);x.fillStyle=t.col;x.strokeStyle='#fff';x.lineWidth=2;round(-c*.28,-c*.14,c*.56,c*.28,c*.08);x.fill();x.stroke();x.fillStyle='#dcecf8';x.fillRect(-c*.12,-c*.1,c*.12,c*.2);x.fillStyle='#fff4bd';x.beginPath();x.arc(c*.22,-c*.06,c*.035,0,7);x.fill();x.restore();if(t.pause>0){x.fillStyle='#fff';x.font=`700 ${Math.max(9,c*.13)}px sans-serif`;x.textAlign='center';x.fillText('とまります',a[0],a[1]-c*.32)}}
function loc(cx,cy,en,ex,p){let c=vw.c,l=vw.ox+cx*c,t=vw.oy+cy*c,m=[l+c/2,t+c/2],q={N:[m[0],t],E:[l+c,m[1]],S:[m[0],t+c],W:[l,m[1]]},a=q[en]||m,b=q[ex]||m;if(p<.5){let u=p*2;return[a[0]+(m[0]-a[0])*u,a[1]+(m[1]-a[1])*u]}let u=(p-.5)*2;return[m[0]+(b[0]-m[0])*u,m[1]+(b[1]-m[1])*u]}
function round(a,b,c,d,r){x.beginPath();x.roundRect(a,b,c,d,r)}function draw(){x.clearRect(0,0,vw.w,vw.h);x.fillStyle='#dfeecf';x.fillRect(0,0,vw.w,vw.h);x.strokeStyle='#b7cda6';x.lineWidth=1;for(let i=0;i<=C;i++){x.beginPath();x.moveTo(vw.ox+i*vw.c,vw.oy);x.lineTo(vw.ox+i*vw.c,vw.oy+R*vw.c);x.stroke()}for(let i=0;i<=R;i++){x.beginPath();x.moveTo(vw.ox,vw.oy+i*vw.c);x.lineTo(vw.ox+C*vw.c,vw.oy+i*vw.c);x.stroke()}for(let y=0;y<R;y++)for(let z=0;z<C;z++)pathCell(z,y,g[y][z]);tr.forEach(point)}
function tick(now){let dt=Math.min(.04,(now-lastTime)/1000);lastTime=now;if(run)tr.forEach(t=>step(t,dt));draw();requestAnimationFrame(tick)}function step(t,dt){if(t.pause>0){t.pause-=dt;return}let p=piece(t.x,t.y);if(!p)return;let key=t.x+','+t.y;if(p.t==='station'&&t.p>.46&&t.p<.56&&t.last!==key){t.pause=1.2;t.last=key;tone(700,.1);return}t.p+=dt*.75*spd;if(t.p<1)return;let d=V[t.ex],nx=t.x+d[0],ny=t.y+d[1],np=piece(nx,ny),ne=O[t.ex],nex=exit(np,ne);if(np&&nex){t.x=nx;t.y=ny;t.en=ne;t.ex=nex;t.p=0;if(t.last!==nx+','+ny)t.last=''}else{let a=t.en;t.en=t.ex;t.ex=a;t.p=0;t.pause=.3}}
function cell(e){let r=cv.getBoundingClientRect(),a=Math.floor((e.clientX-r.left-vw.ox)/vw.c),b=Math.floor((e.clientY-r.top-vw.oy)/vw.c);return a>=0&&b>=0&&a<C&&b<R?{a,b}:null}function act(c,drag=false){if(!c)return;let k=c.a+','+c.b;if(drag&&k===last)return;last=k;let p=piece(c.a,c.b);if(run){if(p?.t==='switch'){p.a=!p.a;tone(p.a?520:390,.06);toast(p.a?'ポイント：分岐':'ポイント：直進')}return}if(tool==='delete'){if(p||tr.some(t=>t.x===c.a&&t.y===c.b)){push();g[c.b][c.a]=null;tr=tr.filter(t=>t.x!==c.a||t.y!==c.b);hud()}return}if(tool==='train'){if(!p){toast('線路の上に置いてください');return}if(tr.length>=3){toast('列車は3本までです');return}let q=con(p);if(q.length<2)return;push();let en=q[0],ex=exit(p,en)||q[1];tr.push({x:c.a,y:c.b,en,ex,p:.16,col:colors[tr.length],pause:0,last:''});hud();tone(520,.1);return}push();g[c.b][c.a]={t:tool,r:rot%(['straight','station','crossing'].includes(tool)?2:4),a:false};tone(330,.03)}
cv.onpointerdown=e=>{down=true;last='';cv.setPointerCapture?.(e.pointerId);act(cell(e))};cv.onpointermove=e=>{if(down&&!run&&tool!=='train')act(cell(e),true)};cv.onpointerup=cv.onpointercancel=()=>{down=false;last=''};
document.querySelector('#tools').onclick=e=>{let b=e.target.closest('.tool');if(!b)return;tool=b.dataset.t;document.querySelectorAll('.tool').forEach(q=>q.classList.toggle('active',q===b));hud()};document.querySelector('#rotate').onclick=()=>{rot=(rot+1)%4;hud();tone(450,.05)};document.querySelector('#undo').onclick=()=>{if(!hist.length)return toast('これ以上戻せません');let s=hist.pop();g=s.g;tr=s.tr;hud()};document.querySelector('#clear').onclick=()=>{push();g=grid();tr=[];run=false;play();hud()};document.querySelector('#demo').onclick=()=>{push();demo();toast('お手本を読み込みました')};document.querySelector('#play').onclick=()=>{if(!tr.length)return toast('先に列車を置いてください');run=!run;play();tone(run?650:250,.1)};document.querySelector('#speed').oninput=e=>spd=+e.target.value;
function play(){document.querySelector('#play').textContent=run?'■ 停止':'▶ 運転'}function hud(){let names={straight:'直線',curve:'カーブ',station:'駅',crossing:'踏切',switch:'ポイント',train:'列車',delete:'消す'},dir=['横','縦','横','縦'][rot];document.querySelector('#toolName').textContent=names[tool]+(['train','delete'].includes(tool)?'':'・'+dir);document.querySelector('#trainCount').textContent='列車 '+tr.length+'本'}function toast(s){let m=document.querySelector('#msg');m.textContent=s;m.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>m.classList.remove('show'),1600)}
function tone(f,d){if(!sound)return;if(!audio)audio=new (AudioContext||webkitAudioContext)();let o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;a.gain.setValueAtTime(.025,audio.currentTime);a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}document.querySelector('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇'};document.querySelector('#save').onclick=()=>{localStorage.railTown=JSON.stringify({g,tr});toast('保存しました')};document.querySelector('#load').onclick=()=>{try{let s=JSON.parse(localStorage.railTown);g=s.g;tr=s.tr;run=false;play();hud();toast('読み込みました')}catch{toast('保存データがありません')}};let modal=document.querySelector('#modal');document.querySelector('#help').onclick=()=>modal.classList.add('open');document.querySelector('#close').onclick=()=>modal.classList.remove('open');
function demo(){g=grid();tr=[];run=false;let P=(a,b,t,r=0,o={})=>g[b][a]={t,r,...o};P(2,1,'curve',1);P(9,1,'curve',2);P(9,6,'curve',3);P(2,6,'curve',0);for(let a=3;a<=8;a++)P(a,1,a===5?'station':'straight');for(let a=3;a<=8;a++)P(a,6,a===6?'switch':'straight',0,{a:false});for(let b=2;b<=5;b++)P(2,b,'straight',1);for(let b=2;b<=5;b++)P(9,b,b===3?'crossing':'straight',1);P(6,5,'straight',1);P(6,4,'station',1);P(6,3,'straight',1);tr.push({x:4,y:1,en:'E',ex:'W',p:.2,col:colors[0],pause:0,last:''});play();hud()}
new ResizeObserver(resize).observe(stage);resize();demo();requestAnimationFrame(tick)
})();
</script>
</body></html>
