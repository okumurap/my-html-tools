<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ecf5df">
<title>レールタウン・レイアウト</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html{touch-action:manipulation}html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;background:#f5f1e8;color:#24312d}button{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:max(7px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));gap:7px}.top{display:flex;align-items:center;gap:8px;min-height:42px}.brand{display:flex;align-items:center;gap:8px;min-width:0}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#ef604d;font-size:21px;box-shadow:0 4px 12px #aa45352b}.title{font-weight:900;font-size:clamp(16px,3.6vw,22px);white-space:nowrap}.hint{font-size:11px;color:#6e7b76;white-space:nowrap}.top-actions{margin-left:auto;display:flex;gap:5px}.small{width:42px;height:40px;border:1px solid #d7d4ca;border-radius:12px;background:#fffdf8;font-size:18px;box-shadow:0 3px 10px #27362f12}.stage{position:relative;min-height:0;overflow:hidden;border:1px solid #c5d7b6;border-radius:17px;background:#dceccb;box-shadow:0 10px 26px #26352d1c}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.modebar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;padding:3px;border-radius:14px;background:#ffffffea;box-shadow:0 3px 12px #26352d20}.mode{height:36px;min-width:86px;padding:0 14px;border:0;border-radius:11px;background:transparent;font-weight:900;font-size:13px}.mode.active{background:#263832;color:#fff}.badge{position:absolute;top:10px;left:10px;background:#ffffffea;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;box-shadow:0 3px 12px #26352d18;pointer-events:none}.toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,12px);opacity:0;background:#24312ded;color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;white-space:nowrap;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom{display:grid;gap:6px}.palette{display:grid;grid-template-columns:repeat(6,minmax(58px,1fr));gap:5px}.part{height:60px;border:1px solid #d7d4ca;border-radius:14px;background:#fffdf8;box-shadow:0 3px 10px #27362f12;font-weight:900;display:grid;place-items:center;padding:4px}.part strong{display:block;font-size:25px;line-height:25px}.part span{display:block;font-size:10px;line-height:13px}.part.active{border:2px solid #ef604d;background:#fff4ef;box-shadow:0 0 0 3px #ef604d20}.runpanel{display:none;grid-template-columns:1.2fr .8fr .8fr;gap:6px}.runpanel.show{display:grid}.big{height:50px;border:1px solid #d7d4ca;border-radius:14px;background:#fffdf8;font-weight:900;box-shadow:0 3px 10px #27362f12}.big.primary{background:#ef604d;color:#fff;border-color:#d94f3d}.big.stop{background:#263832;color:#fff}.edit-actions{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.edit-actions::-webkit-scrollbar{display:none}.action{height:38px;flex:1 0 auto;min-width:78px;padding:0 12px;border:1px solid #d7d4ca;border-radius:12px;background:#fffdf8;font-weight:800;font-size:12px}.hidden{display:none!important}.modal{position:fixed;inset:0;display:none;place-items:center;background:#13201978;padding:18px;z-index:20}.modal.open{display:grid}.card{width:min(520px,100%);max-height:85vh;overflow:auto;background:#fffdf8;border-radius:20px;padding:20px;line-height:1.7}.card h2{margin:0 0 8px}.card p{margin:8px 0}.card button{width:100%;height:45px;border:0;border-radius:13px;background:#263832;color:#fff;font-weight:900;margin-top:8px}@media(max-width:700px){.hint{display:none}.palette{grid-template-columns:repeat(6,1fr)}.part{height:57px}.part strong{font-size:23px}.part span{font-size:9px}.top-actions .optional{display:none}.stage{border-radius:14px}}@media(max-width:390px){.logo{width:34px;height:34px}.small{width:38px;height:38px}.mode{min-width:78px}.palette{gap:4px}.part{padding:2px}.part strong{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">🚆</div><div><div class="title">レールタウン</div><div class="hint">置く・つなぐ・走らせる</div></div></div><div class="top-actions"><button class="small optional" id="save" aria-label="保存">💾</button><button class="small optional" id="load" aria-label="読込">📂</button><button class="small" id="sound" aria-label="音">🔊</button><button class="small" id="help" aria-label="遊び方">？</button></div></header>
<main class="stage" id="stage"><canvas id="cv"></canvas><div class="badge" id="badge">直線を置く</div><div class="modebar"><button class="mode active" data-mode="edit">つくる</button><button class="mode" data-mode="run">走らせる</button></div><div class="toast" id="toast"></div></main>
<section class="bottom">
<div id="editUI">
<div class="palette" id="palette">
<button class="part active" data-tool="straight"><strong>━</strong><span>直線</span></button>
<button class="part" data-tool="curve"><strong>╰</strong><span>カーブ</span></button>
<button class="part" data-tool="station"><strong>🚉</strong><span>駅</span></button>
<button class="part" data-tool="crossing"><strong>🚧</strong><span>踏切</span></button>
<button class="part" data-tool="switch"><strong>⑂</strong><span>ポイント</span></button>
<button class="part" data-tool="train"><strong>🚃</strong><span>列車</span></button>
</div>
<div class="edit-actions"><button class="action" id="undo">↶ 戻す</button><button class="action" id="demo">お手本</button><button class="action" id="clear">全消去</button></div>
</div>
<div class="runpanel" id="runUI"><button class="big primary" id="start">▶ 出発</button><button class="big" id="slower">− ゆっくり</button><button class="big" id="faster">＋ はやく</button></div>
</section>
</div>
<div class="modal" id="modal"><div class="card"><h2>遊び方</h2><p><b>空いているマスをタップ</b>すると、選んだ線路を置けます。</p><p><b>同じパーツを選んでタップ</b>すると回転し、<b>別のパーツを選んでタップ</b>すると上書きします。<b>長押し</b>すると消えます。指でなぞると、同じパーツを続けて置けます。</p><p>「列車」を選び、線路をタップすると列車を置けます。置いた列車をもう一度タップすると消せます。「走らせる」に切り替えて出発してください。運転中はポイントをタップして進路を変えられます。</p><button id="close">わかった</button></div></div>
<script>
(()=>{'use strict';
const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),stage=document.querySelector('#stage');
const COLS=12,ROWS=8,DIRS=['N','E','S','W'],V={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]},OPP={N:'S',E:'W',S:'N',W:'E'};
let grid=makeGrid(),trains=[],tool='straight',mode='edit',running=false,speed=1,history=[],view={},dpr=1,lastTime=performance.now(),soundOn=true,audio=null,toastTimer=0;
let pointer={down:false,startX:0,startY:0,startTime:0,lastCell:'',longTimer:null,longDone:false,moved:false};
function makeGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function cloneState(){return JSON.parse(JSON.stringify({grid,trains}))}
function remember(){history.push(cloneState());if(history.length>30)history.shift()}
function inside(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS}
function at(x,y){return inside(x,y)?grid[y][x]:null}
function connections(p){if(!p)return[];const r=p.r||0;if(['straight','station','crossing'].includes(p.t))return r%2?['N','S']:['W','E'];if(p.t==='curve')return [['N','E'],['E','S'],['S','W'],['W','N']][r%4];if(p.t==='switch'){const routes=switchRoutes(p);return [...new Set(routes.flat())]}return[]}
function switchRoutes(p){const all=[[['W','E'],['W','N']],[['N','S'],['N','E']],[['E','W'],['E','S']],[['S','N'],['S','W']]];return all[(p.r||0)%4]}
function exitDir(p,entry){if(!p)return null;if(p.t==='switch'){const routes=switchRoutes(p),chosen=p.a?routes[1]:routes[0];if(chosen.includes(entry))return chosen.find(d=>d!==entry);for(const route of routes)if(route.includes(entry))return route.find(d=>d!==entry);return null}const c=connections(p);return c.includes(entry)?c.find(d=>d!==entry):null}
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const cell=Math.min((r.width-12)/COLS,(r.height-12)/ROWS);view={w:r.width,h:r.height,c:cell,ox:(r.width-cell*COLS)/2,oy:(r.height-cell*ROWS)/2}}
function cellFromEvent(e){const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-view.ox)/view.c),y=Math.floor((e.clientY-r.top-view.oy)/view.c);return inside(x,y)?{x,y}:null}
function endpoints(x,y){const c=view.c,l=view.ox+x*c,t=view.oy+y*c,mx=l+c/2,my=t+c/2;return{N:[mx,t],E:[l+c,my],S:[mx,t+c],W:[l,my],M:[mx,my],l,t,mx,my,c}}
function railLine(a,b,e){ctx.beginPath();ctx.moveTo(...e[a]);ctx.lineTo(e.mx,e.my);ctx.lineTo(...e[b]);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#756958';ctx.lineWidth=e.c*.25;ctx.stroke();ctx.strokeStyle='#e3dccd';ctx.lineWidth=e.c*.13;ctx.stroke();ctx.strokeStyle='#8a7e6e';ctx.lineWidth=2;ctx.setLineDash([3,5]);ctx.stroke();ctx.setLineDash([])}
function drawPiece(x,y,p){if(!p)return;const e=endpoints(x,y);if(p.t==='switch'){const routes=switchRoutes(p);railLine(...routes[0],e);railLine(...routes[1],e);ctx.fillStyle=p.a?'#ef604d':'#2d82c5';ctx.beginPath();ctx.arc(e.mx,e.my,e.c*.095,0,Math.PI*2);ctx.fill()}else{const c=connections(p);railLine(c[0],c[1],e)}if(p.t==='station'){ctx.fillStyle='#fffaf0';ctx.fillRect(e.l+e.c*.1,e.t+e.c*.08,e.c*.8,e.c*.19);ctx.fillStyle='#ef604d';ctx.fillRect(e.l+e.c*.1,e.t+e.c*.08,e.c*.8,e.c*.045)}if(p.t==='crossing'){const near=trains.some(t=>Math.abs(t.x-x)+Math.abs(t.y-y)<=1.4);ctx.save();ctx.translate(e.mx,e.my);ctx.rotate((p.r%2)*Math.PI/2);ctx.strokeStyle='#303434';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-e.c*.3,-e.c*.2);ctx.lineTo(e.c*.3,e.c*.2);ctx.moveTo(-e.c*.3,e.c*.2);ctx.lineTo(e.c*.3,-e.c*.2);ctx.stroke();ctx.strokeStyle='#e74d3c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(near?0:-e.c*.3,near?e.c*.3:-e.c*.22);ctx.stroke();ctx.restore()}}
function trainPos(t,p){const e=endpoints(t.x,t.y),a=e[t.entry]||e.M,b=e[t.exit]||e.M;if(p<.5){const u=p*2;return[a[0]+(e.mx-a[0])*u,a[1]+(e.my-a[1])*u]}const u=(p-.5)*2;return[e.mx+(b[0]-e.mx)*u,e.my+(b[1]-e.my)*u]}
function drawTrain(t){const a=trainPos(t,t.p),b=trainPos(t,Math.min(1,t.p+.04)),ang=Math.atan2(b[1]-a[1],b[0]-a[0]),c=view.c;ctx.save();ctx.translate(...a);ctx.rotate(ang);ctx.fillStyle=t.color;ctx.strokeStyle='#fff';ctx.lineWidth=2;roundRect(-c*.29,-c*.145,c*.58,c*.29,c*.08);ctx.fill();ctx.stroke();ctx.fillStyle='#ddecf7';ctx.fillRect(-c*.13,-c*.1,c*.13,c*.2);ctx.fillStyle='#fff4ad';ctx.beginPath();ctx.arc(c*.22,-c*.06,c*.036,0,Math.PI*2);ctx.fill();ctx.restore()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function draw(){ctx.clearRect(0,0,view.w,view.h);ctx.fillStyle='#dceccb';ctx.fillRect(0,0,view.w,view.h);ctx.strokeStyle='#b8cfa5';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(view.ox+x*view.c,view.oy);ctx.lineTo(view.ox+x*view.c,view.oy+ROWS*view.c);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(view.ox,view.oy+y*view.c);ctx.lineTo(view.ox+COLS*view.c,view.oy+y*view.c);ctx.stroke()}for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)drawPiece(x,y,grid[y][x]);trains.forEach(drawTrain)}
function updateTrain(t,dt){if(t.pause>0){t.pause-=dt;return}const p=at(t.x,t.y);if(!p)return;const key=`${t.x},${t.y}`;if(p.t==='station'&&t.p>.46&&t.p<.56&&t.lastStop!==key){t.pause=1.2;t.lastStop=key;tone(700,.08);return}t.p+=dt*.76*speed;if(t.p<1)return;const d=V[t.exit],nx=t.x+d[0],ny=t.y+d[1],np=at(nx,ny),entry=OPP[t.exit],nextExit=exitDir(np,entry);if(np&&nextExit){t.x=nx;t.y=ny;t.entry=entry;t.exit=nextExit;t.p=0;if(t.lastStop!==`${nx},${ny}`)t.lastStop=''}else{const tmp=t.entry;t.entry=t.exit;t.exit=tmp;t.p=0;t.pause=.25}}
function frame(now){const dt=Math.min(.04,(now-lastTime)/1000);lastTime=now;if(running)trains.forEach(t=>updateTrain(t,dt));draw();requestAnimationFrame(frame)}
function placeOrRotate(c,drag=false){if(!c||mode!=='edit')return;const key=`${c.x},${c.y}`;if(drag&&pointer.lastCell===key)return;pointer.lastCell=key;const p=at(c.x,c.y);if(tool==='train'){if(!p){toast('線路の上に置いてね');return}if(drag)return;const i=trains.findIndex(t=>t.x===c.x&&t.y===c.y);remember();if(i>=0){trains.splice(i,1);tone(220,.05);toast('列車を消しました')}else addTrain(c.x,c.y,p);return}if(p){if(drag)return;remember();if(p.t===tool){p.r=(p.r+1)%4;tone(460,.04);toast('向きを変えました')}else{grid[c.y][c.x]={t:tool,r:0,a:false};tone(360,.035);toast('上書きしました')}return}remember();grid[c.y][c.x]={t:tool,r:0,a:false};tone(360,.035)}
function removeAt(c){if(!c||mode!=='edit')return;const p=at(c.x,c.y),hasTrain=trains.some(t=>t.x===c.x&&t.y===c.y);if(!p&&!hasTrain)return;remember();grid[c.y][c.x]=null;trains=trains.filter(t=>!(t.x===c.x&&t.y===c.y));tone(220,.05);toast('消しました')}
function addTrain(x,y,p){if(trains.length>=3){toast('列車は3本まで');return}const c=connections(p);if(c.length<2){toast('ここには置けません');return}trains.push({x,y,entry:c[0],exit:c[1],p:.5,pause:0,lastStop:'',color:['#e94f3d','#2e82c5','#f0a62a'][trains.length]});tone(620,.07);toast('列車を置きました')}
function setMode(next){mode=next;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelector('#editUI').classList.toggle('hidden',mode!=='edit');document.querySelector('#runUI').classList.toggle('show',mode==='run');if(mode==='edit'){running=false;document.querySelector('#start').textContent='▶ 出発';setBadge()}else{document.querySelector('#badge').textContent=trains.length?`列車 ${trains.length}本`:'列車を置いてね';toast(trains.length?'出発を押してください':'「つくる」で列車を置いてね')}}
function setBadge(){const names={straight:'直線を置く',curve:'カーブを置く',station:'駅を置く',crossing:'踏切を置く',switch:'ポイントを置く',train:'線路をタップして列車を置く'};document.querySelector('#badge').textContent=names[tool]}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1400)}
function tone(freq,dur){if(!soundOn)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function demo(){remember();grid=makeGrid();trains=[];const put=(x,y,t,r=0)=>grid[y][x]={t,r,a:false};for(let x=2;x<=9;x++){put(x,1,'straight');put(x,6,'straight')}for(let y=2;y<=5;y++){put(1,y,'straight',1);put(10,y,'straight',1)}put(1,1,'curve',1);put(10,1,'curve',2);put(10,6,'curve',3);put(1,6,'curve',0);put(5,1,'station');put(8,6,'crossing');put(2,1,'switch');trains.push({x:5,y:1,entry:'W',exit:'E',p:.5,pause:0,lastStop:'',color:'#e94f3d'});toast('お手本を読み込みました')}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const c=cellFromEvent(e);pointer={down:true,startX:e.clientX,startY:e.clientY,startTime:performance.now(),lastCell:'',longTimer:null,longDone:false,moved:false};if(mode==='run'){if(c&&at(c.x,c.y)?.t==='switch'){at(c.x,c.y).a=!at(c.x,c.y).a;tone(500,.05);toast('ポイント切替')}return}pointer.longTimer=setTimeout(()=>{pointer.longDone=true;removeAt(c)},520)});
cv.addEventListener('pointermove',e=>{if(!pointer.down||mode!=='edit')return;const dist=Math.hypot(e.clientX-pointer.startX,e.clientY-pointer.startY);if(dist>8){pointer.moved=true;clearTimeout(pointer.longTimer);placeOrRotate(cellFromEvent(e),true)}});
function endPointer(e){if(!pointer.down)return;clearTimeout(pointer.longTimer);const c=cellFromEvent(e);if(mode==='edit'&&!pointer.longDone&&!pointer.moved)placeOrRotate(c,false);pointer.down=false}
cv.addEventListener('pointerup',endPointer);cv.addEventListener('pointercancel',endPointer);
document.querySelectorAll('.part').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('.part').forEach(x=>x.classList.toggle('active',x===b));setBadge();tone(420,.025)}));
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.querySelector('#start').addEventListener('click',()=>{if(!trains.length){toast('列車を置いてね');return}running=!running;document.querySelector('#start').textContent=running?'■ 一時停止':'▶ 出発';document.querySelector('#start').classList.toggle('stop',running);tone(running?700:280,.08)});
document.querySelector('#slower').addEventListener('click',()=>{speed=Math.max(.5,+(speed-.2).toFixed(1));toast(`速度 ${speed.toFixed(1)}倍`)});document.querySelector('#faster').addEventListener('click',()=>{speed=Math.min(2,+(speed+.2).toFixed(1));toast(`速度 ${speed.toFixed(1)}倍`)});
document.querySelector('#undo').addEventListener('click',()=>{const s=history.pop();if(!s){toast('戻せません');return}grid=s.grid;trains=s.trains;toast('1つ戻しました')});
document.querySelector('#demo').addEventListener('click',demo);document.querySelector('#clear').addEventListener('click',()=>{if(!confirm('全部消しますか？'))return;remember();grid=makeGrid();trains=[];toast('全部消しました')});
document.querySelector('#save').addEventListener('click',()=>{localStorage.setItem('railTownV2',JSON.stringify({grid,trains}));toast('保存しました')});document.querySelector('#load').addEventListener('click',()=>{try{const s=JSON.parse(localStorage.getItem('railTownV2'));if(!s)throw 0;remember();grid=s.grid;trains=s.trains||[];toast('読み込みました')}catch{toast('保存データがありません')}});
document.querySelector('#sound').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';if(soundOn)tone(520,.05)});
const modal=document.querySelector('#modal');document.querySelector('#help').addEventListener('click',()=>modal.classList.add('open'));document.querySelector('#close').addEventListener('click',()=>modal.classList.remove('open'));modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('resize',resize);resize();demo();history=[];setBadge();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
