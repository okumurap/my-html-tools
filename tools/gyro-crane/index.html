<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1930">
<meta name="description" content="夕暮れの港で吊り荷を運搬。風と慣性の予測軌道を読み、位置・横速度・傾きをそろえて積み下ろす4モードのクレーンゲーム。">
<title>ぐらぐらクレーン | SWING CRANE</title>
<link rel='stylesheet' href='./style.css'>
<link rel="stylesheet" href="../../assets/css/mobile-touch.css">
</head>
<body class="mobile-touch-game">
<main class="app">
<header class="top"><div class="brand">SWING <span>CRANE</span> <span aria-hidden="true">▣</span></div><a class="home" href="../../index.html">ツール一覧へ</a></header>
<section class="stage" id="stage" aria-label="クレーンゲーム画面"><canvas id="game" aria-label="クレーンと吊り荷、着地目標"></canvas>
<div class="hud" id="hud" hidden><div class="hud-top"><div><small id="modeLabel">90秒チャレンジ</small><br><strong id="timeLabel">01:30</strong></div><div style="text-align:right"><small>SCORE</small><br><strong id="scoreLabel">0</strong></div><button type="button" id="pauseBtn" aria-label="一時停止">Ⅱ</button></div><div class="stats"><span id="countLabel">成功 0</span><span id="swingLabel">揺れ 0°</span><span id="windLabel">風 なし</span></div></div>
<div class="readiness" id="readiness"><span id="readyLabel">揺れを止めて、中心へ</span><small id="cargoLabel">風と慣性を読んで運ぼう</small></div><div class="message" id="message" aria-live="polite"></div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div><div class="landscape">スマホを縦向きに戻してください</div></section>
<footer class="bottom"><div class="control-guide"><span id="sensorLabel">◀ ▶ 長押しで移動</span><span>逆方向へ動かして振れ止め！</span></div><div class="buttons"><button type="button" class="control" id="left" aria-label="左に移動">◀ 左</button><button type="button" class="control drop" id="drop" disabled>DROP !</button><button type="button" class="control" id="right" aria-label="右に移動">右 ▶</button></div></footer>
</main>
<script src='./game.js'></script>
</body>
</html>
