<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ブラウザだけで使える、小さく便利なHTMLツール集です。">
  <title>My HTML Tools</title>
  <script>
    // CSSの読み込み前に保存済みの手動テーマを適用し、表示時のちらつきを防ぐ。
    try {
      const savedTheme = localStorage.getItem('my-html-tools:theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (_) {
      // 保存不可のブラウザはOSのテーマに従う。
    }
  </script>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/home.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="site-name" href="./index.html" aria-label="My HTML Tools ホーム">My HTML Tools</a>
      <div class="home-header-actions">
        <label class="theme-field" for="theme-select">表示
          <select id="theme-select" class="theme-select" aria-label="表示テーマ">
            <option value="auto">自動</option>
            <option value="light">ライト</option>
            <option value="dark">ダーク</option>
          </select>
        </label>
      </div>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <div class="container">
        <h1 id="page-title">ブラウザで使えるツール</h1>
        <p class="lead">インストール不要。PCでもスマートフォンでも、必要なときにすぐ使えます。</p>
      </div>
    </section>
    <section class="tools-section" aria-label="ツールを探す">
      <div class="container">
        <div class="catalog-controls">
          <label class="catalog-search" for="tool-search">ツールを検索
            <input id="tool-search" type="search" placeholder="名前や説明で検索" autocomplete="off" aria-controls="tool-list">
          </label>
          <div id="category-filters" class="category-filters" role="group" aria-label="カテゴリーで絞り込み"></div>
          <label class="mobile-filter" for="mobile-category">カテゴリーで絞り込み
            <select id="mobile-category" class="mobile-category" aria-controls="tool-list"></select>
          </label>
        </div>
        <section id="favorites-section" class="catalog-group" aria-labelledby="favorites-title" hidden>
          <div class="section-heading"><h2 id="favorites-title">★ お気に入り</h2></div>
          <ul id="favorites-list" class="quick-list"></ul>
        </section>
        <section id="recent-section" class="catalog-group" aria-labelledby="recent-title" hidden>
          <div class="section-heading"><h2 id="recent-title">最近使ったツール</h2></div>
          <ul id="recent-list" class="quick-list"></ul>
        </section>
        <section class="catalog-group" aria-labelledby="tools-title">
          <div class="section-heading">
            <h2 id="tools-title">すべてのツール</h2>
            <div class="section-heading__actions">
              <span id="result-count" class="tool-count" role="status" aria-live="polite">ツールを読み込み中</span>
              <button id="compact-toggle" class="compact-toggle" type="button" aria-pressed="false">コンパクト表示</button>
            </div>
          </div>
          <ol id="tool-list" class="tool-grid"></ol>
          <p id="catalog-empty" class="catalog-empty" hidden>該当するツールがありません。検索語やカテゴリーを変更してください。</p>
          <noscript><p class="catalog-empty">ツール一覧の表示にはJavaScriptが必要です。ブラウザの設定を確認してください。</p></noscript>
        </section>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p>&copy; My HTML Tools</p></div></footer>
  <script src="./assets/js/catalog.js"></script>
</body>
</html>
