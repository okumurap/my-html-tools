<script>
(()=>{'use strict';

 {id:'eight',name:'クロスブリッジ8',level:'立体交差',shape:'eight',half:42,elevated:true,grass:'#83bf9b',sky:'#addce5',curb:'#e7a85f',road:'#586777'},

 {id:'sunset',name:'サンセットビーンズ',level:'ふつう',shape:'sunset',half:50,grass:'#c0bc87',inner:'#b7bd83',sky:'#efd3b3',curb:'#d78076',road:'#656574'}

function frameAt(course,distance){const d=((distance%course.length)+course.length)%course.length;let low=0,high=course.table.length-1;while(high-low>1){const mid=(low+high)>>1;if(course.table[mid].d<=d)low=mid;else high=mid;}const a=course.table[low],b=course.table[high],theta=a.a+(b.a-a.a)*(d-a.d)/(b.d-a.d);return courseFrame(course,theta);}

const RECORD_KEY='mini-kart-park:records-rc-v1',LEGACY_KEY='mini-kart-park:best-v1';let records={},recordBlocked=false,recordProblem='',legacyBest=null;

let course=courses[0],state='ready',distance=0,offset=0,lateralVelocity=0,speed=0,elapsed=0,lap=1,finishRank=1,hitCooldown=0,particles=[],rivals=[],noticeText='',noticeTimer=0,raf=0,prev=0,display={w:600,h:440,scale:1,x:0,y:0,dpr:1};
let countdownRemaining=0,goRemaining=0,lastNewBest=false;

const projectWorld=(x,z,y=0)=>{const p=viewPoint(x,z);return{x:p.x,y:p.z*.46-y*.89};};
const scene=(x,z,y=0)=>{const p=projectWorld(x,z,y);return{x:camera.x+p.x*camera.zoom,y:camera.y+p.y*camera.zoom};};
function fitCamera(){let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
for(let i=0;i<192;i++){const f=frameAt(course,i/192*course.length);for(const side of [-1,1])for(const h of [0,65]){const p=projectWorld(f.x+f.rx*(course.half+18)*side,f.z+f.rz*(course.half+18)*side,f.height+h);minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);}}
camera.zoom=Math.min(544/(maxX-minX),Math.max(1,camera.height-48)/(maxY-minY));camera.x=300-(minX+maxX)/2*camera.zoom;camera.y=camera.height/2-(minY+maxY)/2*camera.zoom;

function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),scale=r.width/600;
cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));display={w:r.width,h:r.height,scale,x:0,y:0,dpr};camera.height=scale>0?r.height/scale:440;bg.height=Math.max(1,Math.ceil(camera.height));buildBackground();render();}
function render(){const v=display;if(v.w<=0||v.h<=0)return;g.setTransform(v.dpr,0,0,v.dpr,0,0);g.fillStyle=course.sky;g.fillRect(0,0,v.w,v.h);g.setTransform(v.dpr*v.scale,0,0,v.dpr*v.scale,v.x*v.dpr,v.y*v.dpr);g.drawImage(bg,0,0);if(!course.elevated)drawParkItems();const actors=decorations.map(p=>({...p,depth:viewDepth(p.x,p.z)}));if(course.elevated){actors.push(...roadSections());addRaisedScenery(actors);if(delivery)for(let i=0;i<3;i++){if(collected.has(i))continue;const p=roadPosition(course,course.length*(.2+i*.29),[-26,26,-26][i]);actors.push({type:'parcel',...p,depth:viewDepth(p.x,p.z)+p.height*.52+26});}}for(const r of rivals){const p=roadPosition(course,r.distance,r.offset);actors.push({type:'kart',...r,depth:viewDepth(p.x,p.z)+(p.height||0)*.52+30});}const p={x:playerX,z:playerZ};actors.push({type:'kart',distance,offset,color:'#ffb342',player:true,lateralVelocity,velocity:speed,depth:viewDepth(p.x,p.z)+frameAt(course,distance).height*.52+30});actors.sort((a,b)=>a.depth-b.depth);for(const a of actors){if(a.type==='road'){drawRoadSection(a);continue;}if(a.type==='support'){box(a.x,a.z,10,10,a.height-5,'#6b8084','#a5b2b0');continue;}if(a.type==='parcel'){box(a.x,a.z,22,22,25,'#c28a36','#ffe28a',a.height);continue;}if(a.type==='tree')tree(a.x,a.z,a.scale);else if(a.type==='box')box(a.x,a.z,a.w,a.d,a.h,a.color,a.top);else kart(a.distance,a.offset,a.color,a.player,a.lateralVelocity,a.velocity,a.name);}for(const p of particles){const a=scene(p.x,p.z,12);g.fillStyle='#ffe7a2';g.fillRect(a.x-2,a.y-2,4,4);}drawEnvironment();}

function glow(x,y,r,color){const gradient=g.createRadialGradient(x,y,0,x,y,r);gradient.addColorStop(0,color);gradient.addColorStop(1,'rgba(255,220,140,0)');g.fillStyle=gradient;g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}
function drawHeadlights(x,z,height,fx,fz){const side={x:-fz,z:fx},near=scene(x+fx*24,z+fz*24,height+8),far=scene(x+fx*155,z+fz*155,height+2);const beam=g.createLinearGradient(near.x,near.y,far.x,far.y);beam.addColorStop(0,'rgba(255,240,181,.65)');beam.addColorStop(1,'rgba(255,238,170,0)');quad([scene(x+fx*20+side.x*9,z+fz*20+side.z*9,height+5),scene(x+fx*155+side.x*55,z+fz*155+side.z*55,height+2),scene(x+fx*155-side.x*55,z+fz*155-side.z*55,height+2),scene(x+fx*20-side.x*9,z+fz*20-side.z*9,height+5)],beam);for(const sign of [-1,1]){const p=scene(x+fx*22+side.x*sign*8,z+fz*22+side.z*sign*8,height+12);glow(p.x,p.y,12*camera.zoom,'rgba(255,246,197,.95)');const tail=scene(x-fx*21+side.x*sign*8,z-fz*21+side.z*sign*8,height+11);glow(tail.x,tail.y,7*camera.zoom,'rgba(255,70,60,.85)');}}
function drawEnvironment(){g.save();if(environmentMode==='evening'){g.fillStyle='rgba(228,105,63,.12)';g.fillRect(0,0,600,camera.height);const sunset=g.createLinearGradient(0,0,600,camera.height);sunset.addColorStop(0,'rgba(255,191,110,.16)');sunset.addColorStop(1,'rgba(104,56,117,.20)');g.fillStyle=sunset;g.fillRect(0,0,600,camera.height);}
if(environmentMode==='night'){g.fillStyle='rgba(3,10,34,.70)';g.fillRect(0,0,600,camera.height);for(let i=0;i<12;i++){const p=roadPosition(course,i/12*course.length,-course.half-18),base=scene(p.x,p.z,p.height),bulb=scene(p.x,p.z,p.height+48);g.strokeStyle='#9ba9b1';g.lineWidth=2;g.beginPath();g.moveTo(base.x,base.y);g.lineTo(bulb.x,bulb.y);g.stroke();g.globalCompositeOperation='screen';glow(base.x,base.y,45*camera.zoom,'rgba(255,185,77,.35)');glow(bulb.x,bulb.y,17*camera.zoom,'rgba(255,220,137,.85)');g.globalCompositeOperation='source-over';}g.globalCompositeOperation='screen';drawHeadlights(playerX,playerZ,frameAt(course,distance).height,Math.cos(heading),Math.sin(heading));for(const r of rivals){const p=roadPosition(course,r.distance,r.offset);drawHeadlights(p.x,p.z,p.height,p.frame.tx,p.frame.tz);}g.globalCompositeOperation='source-over';const tag=scene(playerX,playerZ,frameAt(course,distance).height+48);g.fillStyle='#fff1b2';g.font='900 17px system-ui';g.textAlign='center';g.fillText('YOU',tag.x,tag.y);}
if(environmentMode==='rain'){g.fillStyle='rgba(37,66,93,.25)';g.fillRect(0,0,600,camera.height);g.strokeStyle='rgba(207,235,251,.52)';g.lineWidth=1;const t=reducedMotion.matches?0:weatherTime;for(let i=0;i<95;i++){const x=((i*79-t*65)%650+650)%650-25,y=((i*113+t*280)%(camera.height+50)+camera.height+50)%(camera.height+50)-25;g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y+15);g.stroke();}for(let i=0;i<24;i++){const p=roadPosition(course,i/24*course.length,Math.sin(i*4)*course.half*.5),q=scene(p.x,p.z,p.height+1);g.strokeStyle='rgba(195,226,243,.22)';g.beginPath();g.ellipse(q.x,q.y,14*camera.zoom,3*camera.zoom,0,0,TAU);g.stroke();}}
g.restore();}

function loop(now){raf=0;const dt=Math.max(0,(now-prev)/1000);prev=now;if(state==='countdown')stepCountdown(dt);else if(state==='playing')stepRace(Math.min(.04,dt));render();if(state==='playing'||state==='countdown')raf=requestAnimationFrame(loop);}

function drawParkItems(){if(delivery)for(let i=0;i<3;i++){if(collected.has(i))continue;const p=roadPosition(course,course.length*(.2+i*.29),[-26,26,-26][i]);box(p.x,p.z,22,22,25,'#c28a36','#ffe28a');const tag=scene(p.x,p.z,42);g.fillStyle='#26352a';g.font='bold 15px system-ui';g.textAlign='center';g.fillText(i+1,tag.x,tag.y);}}
$('playMode').addEventListener('change',()=>{if(state==='playing'||state==='countdown'){$('playMode').value=delivery?'delivery':'race';return;}delivery=$('playMode').value==='delivery';state='ready';resetRace();syncUI();render();});
$('start').addEventListener('click',action);for(const c of courses){const o=document.createElement('option');o.value=c.id;o.textContent=c.name+' · '+c.level;$('courseSelect').append(o);}$('courseSelect').addEventListener('change',e=>selectCourse(e.target.value));
// Keep long presses on the game from opening selection/callout menus; native form controls stay usable.
function isNativeField(target){return target instanceof Element&&Boolean(target.closest('select,input,textarea'));}
// Cancel browser long-press/magnifier gestures on game surfaces without blocking native controls or button taps.
function stopGameTouchDefaults(e){const target=e.target;if(target instanceof Element&&!isNativeField(target)&&!target.closest('button,a'))e.preventDefault();}
for(const type of ['touchstart','touchmove'])document.addEventListener(type,stopGameTouchDefaults,{passive:false});
document.addEventListener('selectstart',e=>{if(!isNativeField(e.target))e.preventDefault();});
document.addEventListener('contextmenu',e=>{if(!isNativeField(e.target)&&(matchMedia('(pointer: coarse)').matches||e.pointerType==='touch'||e.target instanceof Element&&e.target.closest('.controls,.stage')))e.preventDefault();});
document.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea'))return;if(e.code==='Space'){if(e.target.closest('button'))return;e.preventDefault();if(!e.repeat)action();return;}if(!Object.values(controlKeys).flat().includes(e.code))return;e.preventDefault();if(state==='playing'||state==='countdown'){heldKeys.add(e.code);syncButtons();}});document.addEventListener('keyup',e=>{heldKeys.delete(e.code);syncButtons();});
function pauseOnBlur(){endViewDrag();clearInputs();if(state==='countdown'){state='ready';resetRace();syncUI();render();}else if(state==='playing'){state='paused';syncUI();render();}}window.addEventListener('blur',pauseOnBlur);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseOnBlur();});window.addEventListener('resize',()=>{endViewDrag();clearInputs();resize();});if('ResizeObserver'in window)new ResizeObserver(resize).observe(cv);selectCourse(course.id);resize();
})();
</script></main></body></html>
