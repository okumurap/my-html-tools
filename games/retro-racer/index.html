<script>
(()=>{'use strict';
const TAU=Math.PI*2,START_ANGLE=-Math.PI/2;
const COURSES=[

 {id:'river',name:'リバーSカーブ',level:'ふつう',shape:'river',half:50,grass:'#81bdab',inner:'#7bac8d',sky:'#a8dce7',curb:'#f0a46e',road:'#52646b'},

 {id:'sunset',name:'サンセットビーンズ',level:'ふつう',shape:'sunset',half:50,grass:'#c0bc87',inner:'#b7bd83',sky:'#efd3b3',curb:'#d78076',road:'#656574'}

// Eight radial handles, interpolated by a periodic Catmull–Rom curve.

function parkNodes(radii){return radii.map((r,i)=>{const a=START_ANGLE+i*TAU/8;return{x:342*Math.cos(a)*r,z:245*Math.sin(a)*r};});}

function validPark(data){if(!data||data.version!==1||!Array.isArray(data.radii)||data.radii.length!==8||!data.radii.every(r=>Number.isFinite(r)&&r>=.8&&r<=1.2)||!Array.isArray(data.items)||data.items.length>24)return false;if(!data.items.every(p=>p&&['ramp','cone'].includes(p.type)&&Number.isFinite(p.f)&&p.f>=.06&&p.f<=.94&&Number.isFinite(p.offset)&&Math.abs(p.offset)<=28))return false;const c={shape:'custom',radii:data.radii};for(let i=0;i<256;i++){const p=courseFrame(c,START_ANGLE+i*TAU/256);if(!Number.isFinite(p.curvature)||Math.abs(p.curvature)>1/65)return false;}return true;}
function centerPoint(course,a){if(course.shape==='custom')return parkPoint(course,a);const c=Math.cos(a),s=Math.sin(a),c2=Math.cos(2*a),s2=Math.sin(2*a),c3=Math.cos(3*a),s3=Math.sin(3*a);if(course.shape==='river')return{x:315*c,z:205*s+35*s3,dx:-315*s,dz:205*c+105*c3,ddx:-315*c,ddz:-205*s-315*s3};if(course.shape==='harbor')return{x:315*c-25*c3,z:215*s+20*s3,dx:-315*s+75*s3,dz:215*c+60*c3,ddx:-315*c+225*c3,ddz:-215*s-180*s3};if(course.shape==='sunset')return{x:290*c+30*c2,z:215*s-22*s2,dx:-290*s-60*s2,dz:215*c-44*c2,ddx:-290*c-120*c2,ddz:-215*s+88*s2};return{x:342*c,z:245*s,dx:-342*s,dz:245*c,ddx:-342*c,ddz:-245*s};}
function courseFrame(course,a){const p=centerPoint(course,a),length=Math.hypot(p.dx,p.dz);return{x:p.x,z:p.z,tx:p.dx/length,tz:p.dz/length,rx:-p.dz/length,rz:p.dx/length,curvature:(p.dx*p.ddz-p.dz*p.ddx)/(length**3)};}

function frameAt(course,distance){const d=((distance%course.length)+course.length)%course.length;let low=0,high=course.table.length-1;while(high-low>1){const mid=(low+high)>>1;if(course.table[mid].d<=d)low=mid;else high=mid;}const a=course.table[low],b=course.table[high],theta=a.a+(b.a-a.a)*(d-a.d)/(b.d-a.d);return courseFrame(course,theta);}

function distanceGap(a,b,length){return((a-b+length*1.5)%length+length)%length-length/2;}
const cv=document.querySelector('#scene'),g=cv.getContext('2d'),$=id=>document.getElementById(id),courses=COURSES.map(buildCourse),bg=document.createElement('canvas');bg.width=600;bg.height=440;const bgc=bg.getContext('2d');
const RECORD_KEY='mini-kart-park:records-v2',LEGACY_KEY='mini-kart-park:best-v1';let records={},recordBlocked=false,recordProblem='',legacyBest=null;
try{const raw=localStorage.getItem(RECORD_KEY);if(raw!==null){const data=JSON.parse(raw);if(!data||data.version!==2||!data.records||typeof data.records!=='object'||Array.isArray(data.records))throw Error();for(const[id,value]of Object.entries(data.records)){if(!courses.some(c=>c.id===id)||!value||!Number.isFinite(value.time)||value.time<=0||value.time>36000||!Number.isInteger(value.rank)||value.rank<1||value.rank>4)throw Error();}records=data.records;}}catch{recordBlocked=true;recordProblem='保存済み記録を読み込めません。新記録はこの画面内のみ保持します。';}

let course=courses[0],state='ready',distance=0,offset=0,lateralVelocity=0,speed=0,elapsed=0,lap=1,finishRank=1,hitCooldown=0,particles=[],rivals=[],noticeText='',noticeTimer=0,raf=0,prev=0,display={w:600,h:440,scale:1,x:0,y:0,dpr:1};
const PARK_KEY='mini-kart-park:park-v1';let park=defaultPark(),parkBlocked=false,parkProblem='',editing=false,editTool='road',nodeIndex=0,editPointer=null,undoParks=[],delivery=false,collected=new Set(),itemHits=new Set(),jumps=0;
try{const raw=localStorage.getItem(PARK_KEY);if(raw!==null){const data=JSON.parse(raw);if(!validPark(data))throw Error();park=data;}}catch{parkBlocked=true;parkProblem='パーク保存を読み込めません。元データを保護し、この画面内で編集します。';}
function customCourse(){return buildCourse({...COURSES[0],id:'custom',shape:'custom',name:'マイパーク',level:'自作',half:46,radii:[...park.radii]});}
courses.push(customCourse());
const heldKeys=new Set(),heldPointers=new Map(),buttonKeys=new Set();
const scene=(x,z,y=0)=>({x:300+(x-z*.23)*.56,y:225+(x*.15+z*.65)*.56-y*.56});
function notice(text,seconds=2){noticeText=text;noticeTimer=seconds;}
function setText(id,text){if($(id).textContent!==text)$(id).textContent=text;}
function clearInputs(){heldKeys.clear();buttonKeys.clear();const pointers=[...heldPointers.keys()];heldPointers.clear();for(const id of['left','right']){const button=$(id);button.classList.remove('active');button.setAttribute('aria-pressed','false');for(const pointer of pointers)if(button.hasPointerCapture(pointer))button.releasePointerCapture(pointer);}}
function steering(){return Number(heldKeys.has('ArrowRight')||heldKeys.has('KeyD')||buttonKeys.has('right')||[...heldPointers.values()].includes('right'))-Number(heldKeys.has('ArrowLeft')||heldKeys.has('KeyA')||buttonKeys.has('left')||[...heldPointers.values()].includes('left'));}
function syncButtons(){for(const id of['left','right']){const active=buttonKeys.has(id)||[...heldPointers.values()].includes(id)||(id==='left'?(heldKeys.has('ArrowLeft')||heldKeys.has('KeyA')):(heldKeys.has('ArrowRight')||heldKeys.has('KeyD')));$(id).classList.toggle('active',active);$(id).setAttribute('aria-pressed',String(active));}}
function quad(points,color,ctx=g){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();}
function worldQuad(points,color,ctx=bgc,y=0){quad(points.map(p=>scene(p[0],p[1],y)),color,ctx);}
function line(a,b,y,color,width,ctx=g){const p=scene(a.x,a.z,y),q=scene(b.x,b.z,y);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function drawRing(width,color){bgc.beginPath();for(const sign of[-1,1]){for(let i=0;i<=256;i++){const a=START_ANGLE+(sign<0?i:256-i)*TAU/256,p=courseFrame(course,a),q=scene(p.x+p.rx*width*sign,p.z+p.rz*width*sign,2);i?bgc.lineTo(q.x,q.y):bgc.moveTo(q.x,q.y);}bgc.closePath();}bgc.fillStyle=color;bgc.fill('evenodd');}
function buildBackground(){bgc.fillStyle=course.sky;bgc.fillRect(0,0,600,440);worldQuad([[-545,-450],[545,-450],[545,450],[-545,450]],course.grass);if(course.id==='river'||course.id==='harbor'){worldQuad([[-155,-93],[115,-113],[170,75],[-120,102]],'#6bb8ca');for(let i=0;i<6;i++)line({x:-115+i*40,z:-50},{x:-98+i*40,z:-50},1,'#b8e4e4',2,bgc);}drawRing(course.half+11,'#f2dfb4');drawRing(course.half+7,'#fbf1d5');drawRing(course.half,course.road);for(let i=0;i<96;i++){const a=courseFrame(course,START_ANGLE+i*TAU/96),b=courseFrame(course,START_ANGLE+(i+1)*TAU/96);for(const sign of[-1,1])worldQuad([[a.x+a.rx*course.half*sign,a.z+a.rz*course.half*sign],[a.x+a.rx*(course.half+7)*sign,a.z+a.rz*(course.half+7)*sign],[b.x+b.rx*(course.half+7)*sign,b.z+b.rz*(course.half+7)*sign],[b.x+b.rx*course.half*sign,b.z+b.rz*course.half*sign]],i%2?course.curb:'#fff5dc',bgc,3);if(i%4===0)line(a,b,4,'#d7d5a5',1.6,bgc);}const f=frameAt(course,0),p=(forward,lateral)=>[f.x+f.tx*forward+f.rx*lateral,f.z+f.tz*forward+f.rz*lateral];for(let row=0;row<2;row++)for(let col=0;col<8;col++){const l=-course.half+col*course.half/4;worldQuad([p(row*7-7,l),p(row*7,l),p(row*7,l+course.half/4),p(row*7-7,l+course.half/4)],(row+col)%2?'#fff7de':'#24313a',bgc,5);}}
function box(x,z,w,d,h,color,top){const b=[scene(x-w/2,z-d/2),scene(x+w/2,z-d/2),scene(x+w/2,z+d/2),scene(x-w/2,z+d/2)],t=[scene(x-w/2,z-d/2,h),scene(x+w/2,z-d/2,h),scene(x+w/2,z+d/2,h),scene(x-w/2,z+d/2,h)];quad([b[1],b[2],t[2],t[1]],color);quad([b[2],b[3],t[3],t[2]],color);quad(t,top);}
function tree(x,z,s=1){const a=scene(x,z),b=scene(x,z,38*s);g.strokeStyle='#815935';g.lineWidth=5*s;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();const p=scene(x,z,48*s);g.fillStyle='#1d815b';g.beginPath();g.ellipse(p.x+3,p.y+6,18*s,13*s,0,0,TAU);g.fill();g.fillStyle=course.id==='sunset'?'#dba365':'#4eb579';g.beginPath();g.ellipse(p.x-3,p.y-1,16*s,12*s,0,0,TAU);g.fill();}
function kart(d,off,color,player=false,sideSpeed=0,forwardSpeed=140,label=''){const p=roadPosition(course,d,off),t=p.frame,vx=t.tx*forwardSpeed+t.rx*sideSpeed,vz=t.tz*forwardSpeed+t.rz*sideSpeed,length=Math.hypot(vx,vz)||1,fx={x:vx/length,z:vz/length},side={x:-fx.z,z:fx.x},rr=player?1.12:1;const at=(f,l,h)=>scene(p.x+fx.x*f+side.x*l,p.z+fx.z*f+side.z*l,h+(player&&jumps>0&&h>2?Math.sin(jumps/.85*Math.PI)*65:0));quad([at(-25,-15,2),at(27,-15,2),at(27,17,2),at(-25,17,2)],'#23423166');quad([at(-24*rr,-14*rr,6),at(24*rr,-14*rr,6),at(24*rr,14*rr,6),at(-24*rr,14*rr,6)],'#202e3a');quad([at(-20*rr,-11*rr,13),at(20*rr,-11*rr,13),at(20*rr,11*rr,13),at(-20*rr,11*rr,13)],color);quad([at(5,-9,22),at(16,-9,22),at(16,9,22),at(5,9,22)],'#b1edf8');const h=at(-6,0,25);g.fillStyle=player?'#ffea94':'#fff7e8';g.beginPath();g.arc(h.x,h.y,7*rr,0,TAU);g.fill();quad([at(29,0,12),at(19,-5,12),at(19,5,12)],'#fff4b1');const tag=at(0,0,44);g.fillStyle=player?'#fff7d0':'#244355';g.font='900 '+(player?17:14)+'px system-ui';g.textAlign='center';g.fillText(player?'YOU':label,tag.x,tag.y);}
function decorate(){const items=[];for(let i=0;i<23;i++){const a=START_ANGLE+i*TAU/23,p=courseFrame(course,a),far=course.half+40+(i%3)*15;items.push({x:p.x-p.rx*far,z:p.z-p.rz*far,type:'tree',scale:.65+(i%4)*.1});}if(course.id==='harbor'){items.push({x:-50,z:20,type:'box',w:90,d:58,h:34,color:'#8b98a7',top:'#e3e2c6'},{x:65,z:15,type:'box',w:62,d:70,h:42,color:'#b87d60',top:'#e4c9a0'});}else{items.push({x:-35,z:0,type:'box',w:38,d:28,h:33,color:'#996e51',top:'#ffc973'},{x:20,z:-10,type:'box',w:27,d:38,h:26,color:'#68829f',top:'#a6dbfc'},{x:0,z:105,type:'tree',scale:1.15});}return items;}
let decorations=[];
function createRivals(){return[-42,-92,-142].map((d,i)=>({distance:d,offset:[-24,26,0][i],target:[-24,26,0][i],velocity:40,lateralVelocity:0,baseSpeed:[154,149,145][i],phase:i*2.1+1,planTimer:0,finishedAt:null,color:['#ef6b79','#6095ed','#d1a7e9'][i],name:'CP'+(i+1)}));}
function resetRace(){collected.clear();itemHits.clear();jumps=0;distance=0;offset=0;lateralVelocity=0;speed=0;elapsed=0;lap=1;finishRank=1;hitCooldown=0;particles=[];rivals=createRivals();clearInputs();}
function selectCourse(id){if(state==='playing'||editing){$('courseSelect').value=course.id;return;}const next=courses.find(c=>c.id===id);if(!next)return;course=next;state='ready';resetRace();noticeText='';noticeTimer=0;buildBackground();decorations=decorate();syncUI();render();}
function currentRank(){if(state==='finished')return finishRank;return 1+rivals.filter(r=>r.finishedAt!==null||r.distance>distance).length;}
function syncUI(){const custom=course.id==='custom';$('editPark').textContent=editing?'✓ 編集おわり':'パークを作る';$('editPark').setAttribute('aria-pressed',String(editing));$('editor').hidden=!editing;$('hud').hidden=editing;$('playMode').disabled=state==='playing'||editing;$('left').disabled=editing;$('right').disabled=editing;$('nodeLabel').textContent='道の点 '+(nodeIndex+1);$('nodeRadius').value=park.radii[nodeIndex];$('radiusValue').textContent=Math.round(park.radii[nodeIndex]*100)+'%';$('undoPark').disabled=!undoParks.length;document.body.classList.toggle('editing',editing);setText('lapTitle',delivery?'荷物':'周回');setText('lap',delivery?collected.size+' / 3':Math.min(3,lap)+' / 3');setText('rank',currentRank()+' / 4');setText('time',elapsed.toFixed(1)+'s');setText('best',!delivery&&!custom&&records[course.id]?records[course.id].time.toFixed(1)+'s':'--');setText('start',state==='playing'?'一時停止':state==='paused'?'再開':state==='finished'?'もう一度':editing?'試走する':'スタート');$('courseSelect').disabled=state==='playing'||editing;setText('legacyBest',course.id==='oval'&&legacyBest!==null?' 以前の記録 '+legacyBest.toFixed(1)+'s':'');const message=parkProblem||recordProblem||noticeTimer>0&&noticeText||editing&&(editTool==='road'?'点をドラッグ、またはタップ→スライダー。急カーブは元に戻します。':editTool==='erase'?'仕掛けをタップして削除（最大24個）':'道をタップして配置（最大24個）')||(state==='ready'?delivery?'荷物3個を集めてスタート地点へ。取り逃しは次の周で！':course.level+' · スタートして3周レース！':state==='paused'?'一時停止 · コースを変更できます':state==='finished'?(delivery?'配達完了！ ':finishRank+'位 · FINISH！ ')+elapsed.toFixed(1)+'秒':Math.abs(offset)>course.half-9?'芝生で減速中！ コースへ戻ろう':delivery?'荷物 '+collected.size+' / 3 · 黄色い箱を集めてゴールへ':'走行中 · CPを避けて3周走ろう');setText('status',message);$('status').dataset.kind=recordProblem||parkProblem?'error':'normal';}
function action(){if(editing){endEditing();state='ready';}if(state==='playing'){state='paused';clearInputs();}else if(state==='paused'){state='playing';clearInputs();prev=performance.now();}else{resetRace();state='playing';notice('GO！ 進行方向に左右ハンドル',2);prev=performance.now();}syncUI();render();if(state==='playing'&&!raf)raf=requestAnimationFrame(loop);}
function finish(time){noticeTimer=0;noticeText='';elapsed=time;distance=delivery?distance:course.length*3;lap=delivery?lap:3;finishRank=1+rivals.filter(r=>r.finishedAt!==null&&r.finishedAt<=time).length;state='finished';clearInputs();if(!delivery&&course.id!=='custom'&&(!records[course.id]||time<records[course.id].time)){records[course.id]={time,rank:finishRank};if(!recordBlocked){try{localStorage.setItem(RECORD_KEY,JSON.stringify({version:2,records}));recordProblem='';notice('コース新記録！ '+finishRank+'位 · '+time.toFixed(1)+'秒',60);}catch{recordProblem='記録を保存できません。新記録はこの画面内のみ保持します。';}}}syncUI();}
function updateRivals(dt,oldElapsed){const cars=[{distance,offset},...rivals.map(r=>({distance:r.distance,offset:r.offset}))];for(let i=0;i<rivals.length;i++){const r=rivals[i],ahead=cars.filter((_,j)=>j!==i+1).filter(c=>{const gap=distanceGap(c.distance,r.distance,course.length);return gap>0&&gap<95&&Math.abs(c.offset-r.offset)<27;}).sort((a,b)=>distanceGap(a.distance,r.distance,course.length)-distanceGap(b.distance,r.distance,course.length))[0];r.planTimer-=dt;const bend=frameAt(course,r.distance+65);if(r.planTimer<=0){let target=Math.sin(oldElapsed*.45+r.distance/240+r.phase)*course.half*.46+Math.sign(bend.curvature)*course.half*.09;if(ahead){const options=[-course.half*.62,course.half*.62];options.sort((a,b)=>(Math.min(Math.abs(b-ahead.offset),35)*2-Math.abs(b-r.offset)*.35)-(Math.min(Math.abs(a-ahead.offset),35)*2-Math.abs(a-r.offset)*.35));target=options[0];}r.target=clamp(target,-course.half+16,course.half-16);r.planTimer=.5+i*.07;}const change=clamp((r.target-r.offset)*2.5,-48,48)*dt;r.offset=clamp(r.offset+change,-course.half+16,course.half-16);r.lateralVelocity=change/dt;let targetSpeed=r.baseSpeed*(1-Math.min(.20,Math.abs(bend.curvature)*23));if(ahead&&distanceGap(ahead.distance,r.distance,course.length)<45&&Math.abs(ahead.offset-r.offset)<25)targetSpeed*=.70;r.velocity+=clamp(targetSpeed-r.velocity,-90*dt,45*dt);const previous=r.distance;r.distance+=r.velocity*dt;if(r.finishedAt===null&&r.distance>=course.length*3)r.finishedAt=oldElapsed+dt*(course.length*3-previous)/(r.distance-previous);}}
function applyParkItems(dt,oldDistance){jumps=Math.max(0,jumps-dt);if(course.id==='custom')for(let i=0;i<park.items.length;i++){const item=park.items[i],d=item.f*course.length,lapKey=i+':'+Math.floor(distance/course.length);if(Math.abs(distanceGap(distance,d,course.length))<18&&Math.abs(offset-item.offset)<(item.type==='ramp'?23:18)&&!itemHits.has(lapKey)){itemHits.add(lapKey);if(item.type==='ramp'){jumps=.85;speed=Math.min(1.35,speed+.3);notice('JUMP！',1);}else if(jumps===0){speed=Math.max(.12,speed*.45);notice('コーンに接触！ ラインを変えよう',1.4);}}}if(delivery){for(let i=0;i<3;i++)if(!collected.has(i)&&Math.abs(distanceGap(distance,course.length*(.2+i*.29),course.length))<24&&Math.abs(offset-[-26,26,-26][i])<18){collected.add(i);notice('荷物 '+collected.size+' / 3 を回収！',1.4);}if(collected.size===3&&Math.floor(distance/course.length)>Math.floor(oldDistance/course.length)){const boundary=(Math.floor(oldDistance/course.length)+1)*course.length,time=elapsed-dt+dt*(boundary-oldDistance)/(distance-oldDistance);distance=boundary;finish(time);return true;}}return false;}
function stepRace(dt){if(state!=='playing'||dt<=0)return;dt=Math.min(.04,dt);const oldElapsed=elapsed,oldDistance=distance;elapsed+=dt;noticeTimer=Math.max(0,noticeTimer-dt);hitCooldown=Math.max(0,hitCooldown-dt);const steer=steering();lateralVelocity+=clamp(steer*110-lateralVelocity,-650*dt,650*dt);offset=clamp(offset+lateralVelocity*dt,-course.half-32,course.half+32);if(Math.abs(offset)>=course.half+32)lateralVelocity=0;const offroad=Math.abs(offset)>course.half-9,target=offroad?.28:1;speed+=clamp(target-speed,-1.5*dt,.48*dt);const forward=40+speed*100;distance+=forward*dt;updateRivals(dt,oldElapsed);if(hitCooldown===0&&jumps===0){const hit=rivals.find(r=>r.finishedAt===null&&Math.abs(distanceGap(distance,r.distance,course.length))<38&&Math.abs(offset-r.offset)<25);if(hit){speed=Math.max(.12,speed*.58);hitCooldown=1.0;notice('接触！ スピードダウン',1.3);const p=roadPosition(course,distance,offset);for(let i=0;i<7;i++)particles.push({x:p.x,z:p.z,vx:Math.cos(i)*35,vz:Math.sin(i)*35,life:.35});}}
if(applyParkItems(dt,oldDistance))return;for(const p of particles){p.x+=p.vx*dt;p.z+=p.vz*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);if(!delivery&&distance>=course.length*3){const exact=oldElapsed+dt*(course.length*3-oldDistance)/(distance-oldDistance);finish(exact);return;}const nextLap=Math.floor(distance/course.length)+1;if(nextLap>lap){lap=nextLap;notice(delivery?'次の周で残りの荷物を集めよう':'LAP '+lap+' / 3',1.8);}syncUI();}
function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),scale=Math.min(r.width/600,r.height/440);cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));display={w:r.width,h:r.height,scale,x:(r.width-600*scale)/2,y:(r.height-440*scale)/2,dpr};render();}
function render(){const v=display;if(v.w<=0||v.h<=0)return;g.setTransform(v.dpr,0,0,v.dpr,0,0);g.fillStyle=course.sky;g.fillRect(0,0,v.w,v.h);g.setTransform(v.dpr*v.scale,0,0,v.dpr*v.scale,v.x*v.dpr,v.y*v.dpr);g.drawImage(bg,0,0);drawParkItems();const actors=decorations.map(p=>({...p,depth:p.x*.15+p.z*.65}));for(const r of rivals){const p=roadPosition(course,r.distance,r.offset);actors.push({type:'kart',...r,depth:p.x*.15+p.z*.65});}const p=roadPosition(course,distance,offset);actors.push({type:'kart',distance,offset,color:'#ffb342',player:true,lateralVelocity,velocity:40+speed*100,depth:p.x*.15+p.z*.65});actors.sort((a,b)=>a.depth-b.depth);for(const a of actors){if(a.type==='tree')tree(a.x,a.z,a.scale);else if(a.type==='box')box(a.x,a.z,a.w,a.d,a.h,a.color,a.top);else kart(a.distance,a.offset,a.color,a.player,a.lateralVelocity,a.velocity,a.name);}for(const p of particles){const a=scene(p.x,p.z,12);g.fillStyle='#ffe7a2';g.fillRect(a.x-2,a.y-2,4,4);}if(editing){drawHandles();return;}if(state!=='playing'){g.fillStyle='#12232ce8';g.fillRect(120,153,360,125);g.fillStyle='#fff5d6';g.textAlign='center';g.font='900 25px system-ui';g.fillText(state==='ready'?'MINI KART PARK':state==='paused'?'PAUSE':delivery?'配達完了！':finishRank+'位 · FINISH!',300,190);g.font='700 16px system-ui';g.fillText(state==='finished'?elapsed.toFixed(1)+'秒 · '+course.name:course.name,300,221);g.font='14px system-ui';g.fillText(state==='ready'?(delivery?'荷物3個を集めてゴールへ':'スタートで3周レース'):state==='paused'?'再開して続きを走ろう':'もう一度チャレンジ',300,250);}}
function loop(now){raf=0;if(state==='playing'){const dt=Math.min(.04,Math.max(0,(now-prev)/1000));prev=now;stepRace(dt);}render();if(state==='playing')raf=requestAnimationFrame(loop);}

function drawParkItems(){if(course.id==='custom')for(const item of park.items){const p=roadPosition(course,item.f*course.length,item.offset),f=p.frame;if(item.type==='ramp'){const at=(a,b,h)=>scene(p.x+f.tx*a+f.rx*b,p.z+f.tz*a+f.rz*b,h);quad([at(-22,-23,2),at(22,-23,18),at(22,23,18),at(-22,23,2)],'#dfac54');quad([at(0,-6,12),at(15,0,18),at(0,6,12)],'#fff0b1');}else{const a=scene(p.x,p.z,2),b=scene(p.x,p.z,28);quad([{x:a.x-9,y:a.y},{x:a.x+9,y:a.y},b],'#ff8856');g.fillStyle='#fff5d6';g.fillRect(a.x-4,a.y-8,8,3);}}if(delivery&&!editing)for(let i=0;i<3;i++){if(collected.has(i))continue;const p=roadPosition(course,course.length*(.2+i*.29),[-26,26,-26][i]);box(p.x,p.z,22,22,25,'#c28a36','#ffe28a');const tag=scene(p.x,p.z,42);g.fillStyle='#26352a';g.font='bold 15px system-ui';g.textAlign='center';g.fillText(i+1,tag.x,tag.y);}}
function drawHandles(){parkNodes(park.radii).forEach((p,i)=>{const q=scene(p.x,p.z,6);g.fillStyle=i===nodeIndex?'#ffe09b':'#f9fbef';g.strokeStyle='#294d58';g.lineWidth=3;g.beginPath();g.arc(q.x,q.y,13,0,TAU);g.fill();g.stroke();g.fillStyle='#263d42';g.font='bold 15px system-ui';g.textAlign='center';g.fillText(i+1,q.x,q.y+5);});}
function savePark(){if(parkBlocked)return;try{localStorage.setItem(PARK_KEY,JSON.stringify(park));parkProblem='';}catch{parkProblem='パークを保存できません。編集はこの画面内で保持しています。';}}
function rememberPark(){undoParks.push(JSON.stringify(park));if(undoParks.length>40)undoParks.shift();}
function refreshPark(){noticeTimer=0;course=customCourse();courses[courses.findIndex(c=>c.id==='custom')]=course;resetRace();buildBackground();decorations=decorate();syncUI();render();}
function beginEditing(){if(editPointer)endEditPointer(null,true);if(state==='playing')state='paused';clearInputs();editing=true;course=courses.find(c=>c.id==='custom');$('courseSelect').value='custom';state='ready';noticeTimer=0;refreshPark();}
function endEditing(){editing=false;savePark();syncUI();render();}
function applyRadius(value,remember=true){const next={...park,radii:[...park.radii]};next.radii[nodeIndex]=clamp(value,.8,1.2);if(!validPark(next)){notice('急カーブになるため変更できません',2);syncUI();return false;}if(next.radii[nodeIndex]===park.radii[nodeIndex])return true;if(remember)rememberPark();park=next;refreshPark();savePark();syncUI();return true;}
function canvasWorld(e){const r=cv.getBoundingClientRect(),sx=((e.clientX-r.left-display.x)/display.scale-300)/.56,sy=((e.clientY-r.top-display.y)/display.scale-225)/.56,z=(sy-.15*sx)/.6845;return{x:sx+.23*z,z};}
function nearestRoad(p){let best=null;for(let i=0;i<512;i++){const d=i/512*course.length,f=frameAt(course,d),dx=p.x-f.x,dz=p.z-f.z,error=dx*dx+dz*dz;if(!best||error<best.error)best={d,f,offset:dx*f.rx+dz*f.rz,error};}return best;}
$('editPark').addEventListener('click',()=>editing?endEditing():beginEditing());
$('playMode').addEventListener('change',()=>{if(state==='playing'||editing){$('playMode').value=delivery?'delivery':'race';return;}delivery=$('playMode').value==='delivery';state='ready';resetRace();syncUI();render();});
for(const button of document.querySelectorAll('[data-tool]'))button.addEventListener('click',()=>{editTool=button.dataset.tool;noticeTimer=0;document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));syncUI();render();});
$('nodeRadius').addEventListener('input',e=>applyRadius(Number(e.target.value)));
$('undoPark').addEventListener('click',()=>{if(!editing||!undoParks.length)return;park=JSON.parse(undoParks.pop());refreshPark();savePark();syncUI();});
cv.addEventListener('pointerdown',e=>{if(!editing||e.button!==0||editPointer)return;e.preventDefault();const p=canvasWorld(e);if(editTool==='road'){const nodes=parkNodes(park.radii);nodeIndex=nodes.map((n,i)=>({i,d:Math.hypot(n.x-p.x,n.z-p.z)})).sort((a,b)=>a.d-b.d)[0].i;editPointer={id:e.pointerId,before:JSON.stringify(park),start:p,moved:false};cv.setPointerCapture(e.pointerId);syncUI();render();}else{const hit=nearestRoad(p);if(hit.error>(course.half+10)**2){notice('道の上をタップしてください',2);syncUI();return;}if(editTool==='erase'){let best=-1,error=Infinity;park.items.forEach((item,i)=>{const q=roadPosition(course,item.f*course.length,item.offset),d=Math.hypot(q.x-p.x,q.z-p.z);if(d<error){error=d;best=i;}});if(best>=0&&error<65){rememberPark();park.items.splice(best,1);}else{notice('消す仕掛けの近くをタップしてください',2);syncUI();return;}}else{if(park.items.length>=24){notice('仕掛けは24個まで。消すと追加できます',2);syncUI();return;}const f=hit.d/course.length;if(f<.06||f>.94){notice('スタート付近には置けません',2);syncUI();return;}rememberPark();park.items.push({type:editTool,f,offset:clamp(hit.offset,-28,28)});}refreshPark();savePark();syncUI();}});
cv.addEventListener('pointermove',e=>{if(!editPointer||e.pointerId!==editPointer.id)return;const p=canvasWorld(e);if(Math.hypot(p.x-editPointer.start.x,p.z-editPointer.start.z)<6&&!editPointer.moved)return;editPointer.moved=true;const a=START_ANGLE+nodeIndex*TAU/8,bx=342*Math.cos(a),bz=245*Math.sin(a);applyRadius(Math.round((p.x*bx+p.z*bz)/(bx*bx+bz*bz)*100)/100,false);});
function endEditPointer(e,cancel=false){if(!editPointer||e&&e.pointerId!==editPointer.id)return;const gesture=editPointer;editPointer=null;if(cancel){park=JSON.parse(gesture.before);refreshPark();savePark();}else if(gesture.before!==JSON.stringify(park)){undoParks.push(gesture.before);if(undoParks.length>40)undoParks.shift();}syncUI();}
cv.addEventListener('pointerup',e=>endEditPointer(e));cv.addEventListener('pointercancel',e=>endEditPointer(e,true));cv.addEventListener('lostpointercapture',e=>endEditPointer(e));
$('start').addEventListener('click',action);for(const c of courses){const o=document.createElement('option');o.value=c.id;o.textContent=c.name+' · '+c.level;$('courseSelect').append(o);}$('courseSelect').addEventListener('change',e=>selectCourse(e.target.value));
for(const id of['left','right']){const b=$(id);b.setAttribute('aria-pressed','false');b.addEventListener('pointerdown',e=>{if(state!=='playing'||e.button!==0)return;e.preventDefault();heldPointers.set(e.pointerId,id);b.setPointerCapture(e.pointerId);syncButtons();});const end=e=>{heldPointers.delete(e.pointerId);syncButtons();};for(const type of['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,end);b.addEventListener('keydown',e=>{if(!['Space','Enter'].includes(e.code))return;e.preventDefault();e.stopPropagation();if(state==='playing'){buttonKeys.add(id);syncButtons();}});b.addEventListener('keyup',e=>{if(!['Space','Enter'].includes(e.code))return;e.preventDefault();e.stopPropagation();buttonKeys.delete(id);syncButtons();});b.addEventListener('blur',()=>{buttonKeys.delete(id);syncButtons();});}
document.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea'))return;if(e.code==='Space'){if(e.target.closest('button'))return;e.preventDefault();if(!e.repeat)action();return;}if(!['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code))return;e.preventDefault();if(state==='playing'){heldKeys.add(e.code);syncButtons();}});document.addEventListener('keyup',e=>{heldKeys.delete(e.code);syncButtons();});
function pauseOnBlur(){if(editPointer)endEditPointer(null,true);clearInputs();if(state==='playing'){state='paused';syncUI();render();}}window.addEventListener('blur',pauseOnBlur);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseOnBlur();});window.addEventListener('resize',()=>{if(editPointer)endEditPointer(null,true);resize();});if('ResizeObserver'in window)new ResizeObserver(resize).observe(cv);selectCourse(course.id);resize();
})();
</script></main></body></html>
