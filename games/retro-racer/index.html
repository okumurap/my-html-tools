function buildBackground(){bgc.fillStyle=course.sky;bgc.fillRect(0,0,600,440);worldQuad([[-480,-350],[480,-350],[480,350],[-480,350]],course.grass);if(course.id==='river'||course.id==='harbor'){worldQuad([[-155,-93],[115,-113],[170,75],[-120,102]],'#6bb8ca');for(let i=0;i<6;i++)line({x:-115+i*40,z:-50},{x:-98+i*40,z:-50},1,'#b8e4e4',2,bgc);}if(course.elevated)return;drawRing(course.half+11,'#f2dfb4');drawRing(course.half+7,'#fbf1d5');drawRing(course.half,course.road);for(let i=0;i<96;i++){const a=courseFrame(course,START_ANGLE+i*TAU/96),b=courseFrame(course,START_ANGLE+(i+1)*TAU/96);for(const sign of[-1,1])worldQuad([[a.x+a.rx*course.half*sign,a.z+a.rz*course.half*sign],[a.x+a.rx*(course.half+7)*sign,a.z+a.rz*(course.half+7)*sign],[b.x+b.rx*(course.half+7)*sign,b.z+b.rz*(course.half+7)*sign],[b.x+b.rx*course.half*sign,b.z+b.rz*course.half*sign]],i%2?course.curb:'#fff5dc',bgc,3);if(i%4===0)line(a,b,4,'#d7d5a5',1.6,bgc);}const f=frameAt(course,0),p=(forward,lateral)=>[f.x+f.tx*forward+f.rx*lateral,f.z+f.tz*forward+f.rz*lateral];for(let row=0;row<2;row++)for(let col=0;col<8;col++){const l=-course.half+col*course.half/4;worldQuad([p(row*7-7,l),p(row*7,l),p(row*7,l+course.half/4),p(row*7-7,l+course.half/4)],(row+col)%2?'#fff7de':'#24313a',bgc,5);}}

function drawRoadSection(part){const {a,b,i}=part,w=course.half;
const point=(f,l,extra=0)=>scene(f.x+f.rx*l+(f===a?-1:1)*f.tx*.8,f.z+f.rz*l+(f===a?-1:1)*f.tz*.8,f.height+extra);

}

function tree(x,z,s=1){const a=scene(x,z),b=scene(x,z,38*s);g.strokeStyle='#815935';g.lineWidth=5*s;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();const p=scene(x,z,48*s);g.fillStyle='#1d815b';g.beginPath();g.ellipse(p.x+3,p.y+6,18*s,13*s,0,0,TAU);g.fill();g.fillStyle=course.id==='sunset'?'#dba365':'#4eb579';g.beginPath();g.ellipse(p.x-3,p.y-1,16*s,12*s,0,0,TAU);g.fill();}
function kart(d,off,color,player=false,sideSpeed=0,forwardSpeed=140,label=''){const p=player?{x:playerX,z:playerZ,height:frameAt(course,distance).height,frame:{tx:Math.cos(heading),tz:Math.sin(heading),rx:-Math.sin(heading),rz:Math.cos(heading)}}:roadPosition(course,d,off),t=p.frame,vx=player?t.tx:t.tx*forwardSpeed+t.rx*sideSpeed,vz=player?t.tz:t.tz*forwardSpeed+t.rz*sideSpeed,length=Math.hypot(vx,vz)||1,fx={x:vx/length,z:vz/length},side={x:-fx.z,z:fx.x},rr=player?1.12:1;const at=(f,l,h)=>scene(p.x+fx.x*f+side.x*l,p.z+fx.z*f+side.z*l,(p.height||0)+h+frameAt(course,d).grade*f*(fx.x*frameAt(course,d).tx+fx.z*frameAt(course,d).tz)+(player&&jumps>0&&h>2?Math.sin(jumps/.85*Math.PI)*65:0));quad([at(-25,-15,2),at(27,-15,2),at(27,17,2),at(-25,17,2)],'#23423166');quad([at(-24*rr,-14*rr,6),at(24*rr,-14*rr,6),at(24*rr,14*rr,6),at(-24*rr,14*rr,6)],'#202e3a');quad([at(-20*rr,-11*rr,13),at(20*rr,-11*rr,13),at(20*rr,11*rr,13),at(-20*rr,11*rr,13)],color);quad([at(5,-9,22),at(16,-9,22),at(16,9,22),at(5,9,22)],'#b1edf8');const h=at(-6,0,25);g.fillStyle=player?'#ffea94':'#fff7e8';g.beginPath();g.arc(h.x,h.y,7*rr,0,TAU);g.fill();quad([at(29,0,12),at(19,-5,12),at(19,5,12)],'#fff4b1');const tag=at(0,0,44);g.fillStyle=player?'#fff7d0':'#244355';g.font='900 '+(player?17:14)+'px system-ui';g.textAlign='center';g.fillText(player?'YOU':label,tag.x,tag.y);}
function decorate(){const items=[];if(course.elevated){for(let i=0;i<14;i++){const a=i*TAU/14;items.push({x:440*Math.cos(a),z:300*Math.sin(a),type:'tree',scale:.8});}return items;}for(let i=0;i<23;i++){const a=START_ANGLE+i*TAU/23,p=courseFrame(course,a),far=course.half+40+(i%3)*15;items.push({x:p.x-p.rx*far,z:p.z-p.rz*far,type:'tree',scale:.65+(i%4)*.1});}if(course.id==='harbor'){items.push({x:-50,z:20,type:'box',w:90,d:58,h:34,color:'#8b98a7',top:'#e3e2c6'},{x:65,z:15,type:'box',w:62,d:70,h:42,color:'#b87d60',top:'#e4c9a0'});}else{items.push({x:-35,z:0,type:'box',w:38,d:28,h:33,color:'#996e51',top:'#ffc973'},{x:20,z:-10,type:'box',w:27,d:38,h:26,color:'#68829f',top:'#a6dbfc'},{x:0,z:105,type:'tree',scale:1.15});}return items;}
let decorations=[];
function createRivals(){return[-42,-92,-142].map((d,i)=>({distance:d,offset:[-24,26,0][i],target:[-24,26,0][i],velocity:40,lateralVelocity:0,baseSpeed:[154,149,145][i],phase:i*2.1+1,planTimer:0,finishedAt:null,color:['#ef6b79','#6095ed','#d1a7e9'][i],name:'CP'+(i+1)}));}
function resetRace(){collected.clear();const initial=frameAt(course,0);playerX=initial.x;playerZ=initial.z;heading=Math.atan2(initial.tz,initial.tx);jumps=0;distance=0;offset=0;lateralVelocity=0;speed=0;elapsed=0;lap=1;finishRank=1;hitCooldown=0;particles=[];rivals=createRivals();clearInputs();}
function selectCourse(id){if(state==='playing'){$('courseSelect').value=course.id;return;}const next=courses.find(c=>c.id===id);if(!next)return;course=next;state='ready';resetRace();noticeText='';noticeTimer=0;buildBackground();decorations=decorate();syncUI();render();}
function currentRank(){if(state==='finished')return finishRank;return 1+rivals.filter(r=>r.finishedAt!==null||r.distance>distance).length;}
function syncUI(){$('playMode').disabled=state==='playing';setText('lapTitle',delivery?'荷物':'周回');setText('lap',delivery?collected.size+' / 3':Math.min(3,lap)+' / 3');setText('rank',currentRank()+' / 4');setText('time',elapsed.toFixed(1)+'s');setText('best',!delivery&&records[course.id]?records[course.id].time.toFixed(1)+'s':'--');setText('start',state==='playing'?'一時停止':state==='paused'?'再開':state==='finished'?'もう一度':'スタート');$('courseSelect').disabled=state==='playing';setText('legacyBest',course.id==='oval'&&legacyBest!==null?' 以前の記録 '+legacyBest.toFixed(1)+'s':'');const message=recordProblem||noticeTimer>0&&noticeText||(state==='ready'?delivery?'荷物3個を集めてスタート地点へ。取り逃しは次の周で！':course.level+' · '+(course.elevated?'坂では速度が変化。ガードレール付き':'スタートして3周レース！'):state==='paused'?'一時停止 · コースを変更できます':state==='finished'?(delivery?'配達完了！ ':finishRank+'位 · FINISH！ ')+elapsed.toFixed(1)+'秒':Math.abs(offset)>course.half-9?'芝生で減速中！ コースへ戻ろう':delivery?'荷物 '+collected.size+' / 3 · 黄色い箱を集めてゴールへ':'走行中 · CPを避けて3周走ろう');setText('status',message);$('status').dataset.kind=recordProblem?'error':'normal';}
function action(){if(state==='playing'){state='paused';clearInputs();}else if(state==='paused'){state='playing';clearInputs();prev=performance.now();}else{resetRace();state='playing';notice('GO！ アクセルとハンドルで運転',2);prev=performance.now();}syncUI();render();if(state==='playing'&&!raf)raf=requestAnimationFrame(loop);}
function finish(time){noticeTimer=0;noticeText='';elapsed=time;distance=delivery?distance:course.length*3;lap=delivery?lap:3;finishRank=1+rivals.filter(r=>r.finishedAt!==null&&r.finishedAt<=time).length;state='finished';clearInputs();if(!delivery&&(!records[course.id]||time<records[course.id].time)){records[course.id]={time,rank:finishRank};if(!recordBlocked){try{localStorage.setItem(RECORD_KEY,JSON.stringify({version:1,records}));recordProblem='';notice('コース新記録！ '+finishRank+'位 · '+time.toFixed(1)+'秒',60);}catch{recordProblem='記録を保存できません。新記録はこの画面内のみ保持します。';}}}syncUI();}
function updateRivals(dt,oldElapsed){const cars=[{distance,offset},...rivals.map(r=>({distance:r.distance,offset:r.offset}))];for(let i=0;i<rivals.length;i++){const r=rivals[i],ahead=cars.filter((_,j)=>j!==i+1).filter(c=>{const gap=distanceGap(c.distance,r.distance,course.length);return gap>0&&gap<95&&Math.abs(c.offset-r.offset)<27;}).sort((a,b)=>distanceGap(a.distance,r.distance,course.length)-distanceGap(b.distance,r.distance,course.length))[0];r.planTimer-=dt;const bend=frameAt(course,r.distance+65);if(r.planTimer<=0){let target=Math.sin(oldElapsed*.45+r.distance/240+r.phase)*course.half*.46+Math.sign(bend.curvature)*course.half*.09;if(ahead){const options=[-course.half*.62,course.half*.62];options.sort((a,b)=>(Math.min(Math.abs(b-ahead.offset),35)*2-Math.abs(b-r.offset)*.35)-(Math.min(Math.abs(a-ahead.offset),35)*2-Math.abs(a-r.offset)*.35));target=options[0];}r.target=clamp(target,-course.half+16,course.half-16);r.planTimer=.5+i*.07;}const change=clamp((r.target-r.offset)*2.5,-48,48)*dt;r.offset=clamp(r.offset+change,-course.half+16,course.half-16);r.lateralVelocity=change/dt;let targetSpeed=r.baseSpeed*(1-Math.min(.20,Math.abs(bend.curvature)*23))-frameAt(course,r.distance).grade*90;if(ahead&&distanceGap(ahead.distance,r.distance,course.length)<45&&Math.abs(ahead.offset-r.offset)<25)targetSpeed*=.70;r.velocity+=clamp(targetSpeed-r.velocity,-90*dt,45*dt);const previous=r.distance;r.distance+=r.velocity*dt;if(r.finishedAt===null&&r.distance>=course.length*3)r.finishedAt=oldElapsed+dt*(course.length*3-previous)/(r.distance-previous);}}
function applyParkItems(dt,oldDistance){if(delivery){for(let i=0;i<3;i++)if(!collected.has(i)&&Math.abs(distanceGap(distance,course.length*(.2+i*.29),course.length))<24&&Math.abs(offset-[-26,26,-26][i])<18){collected.add(i);notice('荷物 '+collected.size+' / 3 を回収！',1.4);}if(collected.size===3&&distance>oldDistance&&Math.floor(distance/course.length)>Math.floor(oldDistance/course.length)){const boundary=(Math.floor(oldDistance/course.length)+1)*course.length,time=elapsed-dt+dt*(boundary-oldDistance)/(distance-oldDistance);distance=boundary;finish(time);return true;}}return false;}
function stepRace(dt){if(state!=='playing'||dt<=0)return;dt=Math.min(.04,dt);const oldElapsed=elapsed,oldDistance=distance;elapsed+=dt;noticeTimer=Math.max(0,noticeTimer-dt);hitCooldown=Math.max(0,hitCooldown-dt);const steer=steering(),offroad=Math.abs(offset)>course.half-9;
const throttle=Number(pressed('throttle'))-Number(pressed('brake'));
const roadFrame=frameAt(course,distance),gradeAlong=roadFrame.grade*(Math.cos(heading)*roadFrame.tx+Math.sin(heading)*roadFrame.tz);
const target=throttle>0?(offroad?55:160)-gradeAlong*90:throttle<0?-65-gradeAlong*45:0;
const acceleration=throttle<0&&speed>0?280:throttle===0?95:120;
speed+=clamp(target-speed,-acceleration*dt,acceleration*dt);
heading+=steer*speed/60*dt;
playerX=clamp(playerX+Math.cos(heading)*speed*dt,-510,510);
playerZ=clamp(playerZ+Math.sin(heading)*speed*dt,-390,390);
let best=null;for(let i=-40;i<=40;i++){const d=distance+i*2,f=frameAt(course,d),dx=playerX-f.x,dz=playerZ-f.z,error=dx*dx+dz*dz;if(!best||error<best.error)best={d,f,dx,dz,error};}
const delta=clamp(best.d-distance,-Math.abs(speed)*dt*1.5,Math.abs(speed)*dt*1.5);
distance+=delta;const f=frameAt(course,distance);offset=(playerX-f.x)*f.rx+(playerZ-f.z)*f.rz;
if(course.elevated&&Math.abs(offset)>course.half-12){offset=clamp(offset,-course.half+12,course.half-12);playerX=f.x+f.rx*offset;playerZ=f.z+f.rz*offset;speed*=.85;}
lateralVelocity=speed*(Math.cos(heading)*f.rx+Math.sin(heading)*f.rz);
updateRivals(dt,oldElapsed);if(hitCooldown===0&&jumps===0){const hit=rivals.find(r=>r.finishedAt===null&&Math.abs(distanceGap(distance,r.distance,course.length))<38&&Math.abs(offset-r.offset)<25);if(hit){speed*=.58;hitCooldown=1.0;notice('接触！ スピードダウン',1.3);const p=roadPosition(course,distance,offset);for(let i=0;i<7;i++)particles.push({x:p.x,z:p.z,vx:Math.cos(i)*35,vz:Math.sin(i)*35,life:.35});}}
if(applyParkItems(dt,oldDistance))return;for(const p of particles){p.x+=p.vx*dt;p.z+=p.vz*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);if(!delivery&&distance>=course.length*3){const exact=oldElapsed+dt*(course.length*3-oldDistance)/(distance-oldDistance);finish(exact);return;}const nextLap=Math.floor(distance/course.length)+1;if(nextLap>lap){lap=nextLap;notice(delivery?'次の周で残りの荷物を集めよう':'LAP '+lap+' / 3',1.8);}syncUI();}
function resize(){const r=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),scale=Math.min(r.width/600,r.height/440);cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));display={w:r.width,h:r.height,scale,x:(r.width-600*scale)/2,y:(r.height-440*scale)/2,dpr};render();}
function render(){const v=display;if(v.w<=0||v.h<=0)return;g.setTransform(v.dpr,0,0,v.dpr,0,0);g.fillStyle=course.sky;g.fillRect(0,0,v.w,v.h);g.setTransform(v.dpr*v.scale,0,0,v.dpr*v.scale,v.x*v.dpr,v.y*v.dpr);g.drawImage(bg,0,0);if(!course.elevated)drawParkItems();const actors=decorations.map(p=>({...p,depth:viewDepth(p.x,p.z)}));if(course.elevated){actors.push(...roadSections());addRaisedScenery(actors);if(delivery)for(let i=0;i<3;i++){if(collected.has(i))continue;const p=roadPosition(course,course.length*(.2+i*.29),[-26,26,-26][i]);actors.push({type:'parcel',...p,depth:viewDepth(p.x,p.z)+p.height*.72+26});}}for(const r of rivals){const p=roadPosition(course,r.distance,r.offset);actors.push({type:'kart',...r,depth:viewDepth(p.x,p.z)+(p.height||0)*.72+30});}const p={x:playerX,z:playerZ};actors.push({type:'kart',distance,offset,color:'#ffb342',player:true,lateralVelocity,velocity:speed,depth:viewDepth(p.x,p.z)+frameAt(course,distance).height*.72+30});actors.sort((a,b)=>a.depth-b.depth);for(const a of actors){if(a.type==='road'){drawRoadSection(a);continue;}if(a.type==='support'){box(a.x,a.z,10,10,a.height-5,'#6b8084','#a5b2b0');continue;}if(a.type==='parcel'){box(a.x,a.z,22,22,25,'#c28a36','#ffe28a',a.height);continue;}if(a.type==='tree')tree(a.x,a.z,a.scale);else if(a.type==='box')box(a.x,a.z,a.w,a.d,a.h,a.color,a.top);else kart(a.distance,a.offset,a.color,a.player,a.lateralVelocity,a.velocity,a.name);}for(const p of particles){const a=scene(p.x,p.z,12);g.fillStyle='#ffe7a2';g.fillRect(a.x-2,a.y-2,4,4);}if(state!=='playing'){g.fillStyle='#12232ce8';g.fillRect(120,153,360,125);g.fillStyle='#fff5d6';g.textAlign='center';g.font='900 25px system-ui';g.fillText(state==='ready'?'MINI KART PARK':state==='paused'?'PAUSE':delivery?'配達完了！':finishRank+'位 · FINISH!',300,190);g.font='700 16px system-ui';g.fillText(state==='finished'?elapsed.toFixed(1)+'秒 · '+course.name:course.name,300,221);g.font='14px system-ui';g.fillText(state==='ready'?(delivery?'荷物3個を集めてゴールへ':'スタートで3周レース'):state==='paused'?'再開して続きを走ろう':'もう一度チャレンジ',300,250);}}
function loop(now){raf=0;if(state==='playing'){const dt=Math.min(.04,Math.max(0,(now-prev)/1000));prev=now;stepRace(dt);}render();if(state==='playing')raf=requestAnimationFrame(loop);}

function drawParkItems(){if(delivery)for(let i=0;i<3;i++){if(collected.has(i))continue;const p=roadPosition(course,course.length*(.2+i*.29),[-26,26,-26][i]);box(p.x,p.z,22,22,25,'#c28a36','#ffe28a');const tag=scene(p.x,p.z,42);g.fillStyle='#26352a';g.font='bold 15px system-ui';g.textAlign='center';g.fillText(i+1,tag.x,tag.y);}}
$('playMode').addEventListener('change',()=>{if(state==='playing')return;delivery=$('playMode').value==='delivery';state='ready';resetRace();syncUI();render();});
$('start').addEventListener('click',action);for(const c of courses){const o=document.createElement('option');o.value=c.id;o.textContent=c.name+' · '+c.level;$('courseSelect').append(o);}$('courseSelect').addEventListener('change',e=>selectCourse(e.target.value));
for(const id of['left','right','throttle','brake']){const b=$(id);b.setAttribute('aria-pressed','false');b.addEventListener('pointerdown',e=>{if(state!=='playing'||e.button!==0)return;e.preventDefault();heldPointers.set(e.pointerId,id);b.setPointerCapture(e.pointerId);syncButtons();});const end=e=>{heldPointers.delete(e.pointerId);syncButtons();};for(const type of['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,end);b.addEventListener('keydown',e=>{if(!['Space','Enter'].includes(e.code))return;e.preventDefault();e.stopPropagation();if(state==='playing'){buttonKeys.add(id);syncButtons();}});b.addEventListener('keyup',e=>{if(!['Space','Enter'].includes(e.code))return;e.preventDefault();e.stopPropagation();buttonKeys.delete(id);syncButtons();});b.addEventListener('blur',()=>{buttonKeys.delete(id);syncButtons();});}
document.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea'))return;if(e.code==='Space'){if(e.target.closest('button'))return;e.preventDefault();if(!e.repeat)action();return;}if(!Object.values(controlKeys).flat().includes(e.code))return;e.preventDefault();if(state==='playing'){heldKeys.add(e.code);syncButtons();}});document.addEventListener('keyup',e=>{heldKeys.delete(e.code);syncButtons();});
function pauseOnBlur(){clearInputs();if(state==='playing'){state='paused';syncUI();render();}}window.addEventListener('blur',pauseOnBlur);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseOnBlur();});window.addEventListener('resize',()=>{resize();});if('ResizeObserver'in window)new ResizeObserver(resize).observe(cv);selectCourse(course.id);resize();
})();
</script></main></body></html>
