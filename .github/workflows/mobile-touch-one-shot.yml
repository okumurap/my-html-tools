name: Apply mobile touch patch once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-touch-one-shot.yml
permissions:
  contents: write
jobs:
  patch-gyro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only gyro HTML and verify inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          path = Path('tools/gyro-rush/index.html')
          source = path.read_text(encoding='utf-8')
          old = '</style>\n</head>\n<body>'
          new = '</style>\n<link rel="stylesheet" href="../../assets/css/mobile-touch.css">\n</head>\n<body class="mobile-touch-game">'
          if 'mobile-touch-game' not in source:
              assert source.count(old) == 1, 'Unexpected gyro HTML layout; refusing to modify it'
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          assert source.count('../../assets/css/mobile-touch.css') == 1
          assert source.count('body class="mobile-touch-game"') == 1
          assert 'touch-action:none' in source, 'Original gameplay drag protection was lost'
          code = re.search(r'<script>\s*(.*?)\s*</script>', source, re.S)
          assert code, 'Original game script is missing'
          with tempfile.NamedTemporaryFile(mode='w', suffix='.js', encoding='utf-8') as script:
              script.write(code.group(1))
              script.flush()
              subprocess.run(['node', '--check', script.name], check=True)
          for name in ('train-crossing', 'sakamoto-railway', 'sakamoto-kiss-fishing', 'gyro-crane'):
              other = Path(f'tools/{name}/index.html').read_text(encoding='utf-8')
              assert 'mobile-touch-game' in other and '../../assets/css/mobile-touch.css' in other, name
          print('PASS: 5 game pages reference scoped mobile styles; gyro script syntax valid')
          PY
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/gyro-rush/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add scoped mobile touch protection to gyro rush without changing game logic'
            git push origin HEAD:main
          fi
