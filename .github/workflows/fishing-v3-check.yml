name: Fishing game checks
on:
  push:
    paths:
      - 'tools/sakamoto-kiss-fishing/**'
      - '.github/workflows/fishing-v3-check.yml'
      - 'tests/kiss-fishing.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check tools/sakamoto-kiss-fishing/game-v3.js
          node --check tools/sakamoto-kiss-fishing/rules.js
      - name: Check gameplay rules
        run: node tests/kiss-fishing.cjs
      - name: Check entrypoint and supporting assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('tools/sakamoto-kiss-fishing')
          html = (root / 'index.html').read_text()
          js = (root / 'game-v3.js').read_text()
          assert 'src="./game-v3.js"' in html
          assert (root / 'style-v3.css').is_file()
          assert 'src="./rules.js"' in html
          assert (root / 'rules.js').is_file()
          assert (root / 'style-v4.css').is_file()
          for name in ('quick', 'challenge', 'daily', 'free', 'triggerFever', 'tutori' ,'rivalScore', 'combo', 'giant', 'pointercancel'):
              assert name in js, name
          print('Entrypoint, assets and key feature identifiers: OK')
          PY
