          from pathlib import Path
          s=Path('tools/drawing-pdf-dimension-manager/index.html').read_text(encoding='utf-8')
          assert 'confirmation-upgrade-v1' in s
          assert all(x in s for x in ['cmm-front','cmm-back','confirmationCategories','confirmationFilter','confirmationRgb','confirmationCategoryName','measurementOrientation'])
