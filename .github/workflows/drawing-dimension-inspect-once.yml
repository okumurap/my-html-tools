name: Inspect PDF dimension manager integration points
on:
  push:
    paths:
      - '.github/workflows/drawing-dimension-inspect-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect targeted source code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('tools/drawing-pdf-dimension-manager/index.html').read_text(encoding='utf-8').splitlines()
          for start,end in [(1,125),(180,255),(334,359),(378,445),(460,525),(552,559)]:
            print(f'===== LINES {start}-{end} =====')
            for n in range(start,end+1):
              if n>len(lines):break
              value=lines[n-1]
              if len(value)>1100:value=value[:450]+' ... [TRUNCATED] ... '+value[-300:]
              print(f'{n:04d}: {value}')
          PY